title: "産業廃棄物行政に係る厚生省・労働省・通商産業省等の関連通知"
category: "国通知"
sections:
  - id: "mhlw_infection_waste"
    article: "健政発第75号"
    title: "血液等が付着した廃棄物（感染性廃棄物）の取扱いについて"
    issued_by: "厚生省健康政策局長"
    issued_date: "平成1年3月31日"
    content: |
      医療機関等から排出される感染性廃棄物の処理に関する最初の通知。血液・体液が付着した廃棄物（注射針・メス・ガーゼ・包帯等）は感染性廃棄物として特別な管理・処理が必要であることを示した。感染性廃棄物の定義（形状基準・性状基準）の解説。医療機関での保管方法（密封容器・バイオハザードマーク表示）。収集運搬・処分の方法（専用収集車・焼却処分）。廃棄物処理法との関係（特別管理産業廃棄物としての位置付け）。
    keywords: ["感染性廃棄物最初の通知", "血液付着廃棄物", "注射針", "バイオハザードマーク", "医療機関感染性廃棄物", "焼却処分"]

  - id: "meti_used_oil_recycle"
    article: "産局第156号"
    title: "廃油の再生処理に関する指針について"
    issued_by: "通商産業省産業政策局"
    issued_date: "昭和60年3月"
    content: |
      廃油（使用済みエンジンオイル・切削油・洗浄油等）の再生利用に関する通商産業省の指針。廃油の再生処理（蒸留精製・水素精製等による再生潤滑油・再生燃料油の製造）の普及促進。廃油再生業者への指導基準（設備・処理能力・品質管理等）。廃油再生品の品質基準と流通規制との関係。廃棄物処理法との関係（廃油が産業廃棄物として処理される場合と有価物として取引される場合の区別）。産業廃棄物処理業の許可と廃油再生事業の関係（再生を目的とした廃油の保管・運搬・再生処理に係る許可の取扱い）。
    keywords: ["廃油再生処理", "再生潤滑油", "再生燃料油", "廃油再生業者", "廃油有価物判断", "再生処理業許可"]

  - id: "mhlw_h12_industrial_waste"
    article: "衛環第64号"
    title: "産業廃棄物処理業者の法令遵守及び適正処理の徹底について"
    issued_by: "厚生省環境衛生局長"
    issued_date: "平成12年3月31日"
    content: |
      産業廃棄物処理業者の法令遵守と適正処理の徹底を求めた通達。主な内容：①廃棄物処理法の処理基準の遵守徹底（収集運搬・中間処理・最終処分の各基準）②マニフェストの適正管理（交付・記載・送付・保存の各義務の履行）③施設の適切な維持管理（点検・記録・報告）④排出事業者への適切な情報提供（廃棄物の処理実績・施設の状況等）⑤不適正処理の事前防止対策（業者選定・契約・マニフェスト確認等）。都道府県・政令市に対して定期的な立入検査の実施と業者指導の強化を指示。
    keywords: ["処理業者法令遵守徹底", "処理基準遵守", "マニフェスト適正管理", "施設維持管理", "立入検査強化", "業者選定指導"]

  - id: "moe_h11_pcb_survey"
    article: "環産第13号"
    title: "ポリ塩化ビフェニル（PCB）廃棄物の保管の適正化について"
    issued_by: "環境庁（当時）大気保全局"
    issued_date: "平成11年3月"
    content: |
      PCB廃棄物の保管実態調査と適正保管の徹底を求めた通知。PCB使用機器（変圧器・コンデンサ・安定器・油入機器等）の廃棄時のPCB廃棄物の保管方法。PCB廃棄物の保管基準（密封容器・施錠・転倒防止措置・火気遠ざけ）。PCB廃棄物の都道府県への届出（特別管理産業廃棄物の保管）。処分見通しが立たないPCB廃棄物の長期保管に係る問題点の指摘（処分体制が整っていなかった当時の状況）と将来的な処分計画策定の指示（後のJESCO設立・PCB特措法へと繋がる）。
    keywords: ["PCB廃棄物保管実態調査", "PCB廃棄物適正保管", "変圧器廃棄PCB", "PCB廃棄物保管基準", "PCB処分計画", "JESCO設立前"]

  - id: "moe_h13_pcb_special_act"
    article: "環廃産発第010629001号"
    title: "ポリ塩化ビフェニル廃棄物の適正な処理の推進に関する特別措置法の施行について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部"
    issued_date: "平成13年6月29日"
    content: |
      PCB廃棄物処理特別措置法（平成13年6月施行）の施行通知。主な内容：①PCB廃棄物（廃PCB・PCB汚染物・PCB処理物）の保管事業者の届出義務（都道府県知事への年度届出）②PCB廃棄物の処分計画（高濃度PCB廃棄物の処分を日本環境安全事業株式会社（JESCO）の事業所で実施）③PCB廃棄物の保管基準の強化④PCB廃棄物の処分費用の負担（保管事業者負担）⑤PCB廃棄物を無届で保管・放置した場合の罰則（懲役・罰金）。高濃度PCBと低濃度PCBの処分方法・処分先の違い。
    keywords: ["PCB特措法施行通知", "PCB廃棄物届出義務", "JESCO処分", "高濃度PCB", "低濃度PCB", "PCB無届保管罰則"]

  - id: "moe_h21_recycle_fuel"
    article: "環廃産発第090202001号"
    title: "廃棄物由来の固形燃料（RPF等）の取扱いについて"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成21年2月2日"
    content: |
      廃棄物由来の固形燃料（RPF：Refuse Paper and Plastic Fuel・RDF：Refuse Derived Fuel）の廃棄物処理法上の位置付けと取扱いに関する通知。RPF（古紙・廃プラスチック類を原料とした固形燃料）・RDF（一般廃棄物等を原料とした固形燃料）が廃棄物に該当するかどうかの判断基準。製品として流通するRPF・RDFは廃棄物に該当しない場合がある。廃棄物原料（廃プラスチック類等）からRPFを製造する施設の廃棄物処理業の許可の取扱い（産業廃棄物処分業の許可が必要）。RDF・RPFの保管・運搬・使用に係る法令適用の解説。
    keywords: ["RPF固形燃料", "RDF固形燃料", "廃棄物由来固形燃料廃棄物該当性", "古紙廃プラスチック燃料化", "廃棄物処分業許可", "廃棄物製品変換"]

  - id: "moe_h25_disaster_waste_manual"
    article: "環循適発第1303281号"
    title: "災害廃棄物対策指針（初版）について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成25年3月28日"
    content: |
      大規模自然災害時に発生する災害廃棄物の適正かつ迅速な処理のための指針（東日本大震災の経験を踏まえた初版）。主な内容：①災害廃棄物対策の基本的考え方（迅速性・適正処理・環境保全の両立）②仮置き場の選定・管理（浸出水・悪臭・火災対策・アスベスト飛散防止）③災害廃棄物の種類別処理フロー（木くず・コンクリート・金属・廃家電・危険物等）④廃棄物処理法の特例措置（許可不要での廃棄物処理の特例）⑤国・都道府県・市町村・民間の役割分担⑥費用の国庫補助（災害等廃棄物処理事業費補助）。長野県を含む全都道府県への適用。
    keywords: ["災害廃棄物対策指針", "仮置き場管理", "種類別処理フロー", "廃棄物処理法特例措置", "国庫補助", "大規模災害廃棄物"]

  - id: "moe_r2_disaster_guideline_revised"
    article: "環循適発第200331002号"
    title: "災害廃棄物対策指針（改定版）について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和2年3月31日"
    content: |
      平成25年版災害廃棄物対策指針の改定版。改定の主な内容：①近年の台風・豪雨等の経験を反映（平成30年西日本豪雨・令和元年台風等）②広域処理（他都道府県への支援処理）の手続きの簡素化③仮置き場の選定・設営・管理マニュアルの詳細化④生活系ごみ・避難所ごみの処理方針④石綿含有廃棄物の飛散防止対策の強化⑤災害廃棄物処理支援ネットワーク（D.Waste-Net）の活用方法⑥国・都道府県・市区町村の事前準備（廃棄物処理計画）の充実。
    keywords: ["災害廃棄物対策指針改定版", "広域処理手続き簡素化", "仮置き場マニュアル", "D.Waste-Net", "事前準備計画", "石綿飛散防止強化"]
