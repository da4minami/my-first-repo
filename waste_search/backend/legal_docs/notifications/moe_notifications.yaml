title: "産業廃棄物行政に係る環境省通知集"
category: "国通知"
sections:
  - id: "moe_1998_685"
    article: "衛環第685号"
    title: "廃棄物の処理及び清掃に関する法律の一部を改正する法律の施行について"
    issued_by: "環境省（旧厚生省）"
    issued_date: "平成10年"
    content: |
      産業廃棄物の処理に関する委託基準の明確化。排出事業者が産業廃棄物の処理を委託する際には、許可を有する処理業者と書面による委託契約を締結することが義務付けられた。委託契約書に記載すべき事項として、廃棄物の種類・数量、処分方法、最終処分地等が明確化された。また、二者間及び三者間契約の取扱いが示された。
    keywords: ["委託契約", "委託基準", "書面契約", "排出事業者"]

  - id: "moe_2000_env_hei12"
    article: "環廃対発第121号"
    title: "廃棄物の処理及び清掃に関する法律の改正について（産業廃棄物管理票制度）"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部"
    issued_date: "平成12年"
    content: |
      産業廃棄物管理票（マニフェスト）制度の運用について。全産業廃棄物についてマニフェストの使用が義務化された。マニフェストはA票（排出事業者控え）、B1票（運搬業者控え）、B2票（運搬業者→排出事業者返送）、C1票（処分業者→運搬業者返送）、C2票（処分業者控え）、D票（処分業者→排出事業者返送）、E票（最終処分業者→排出事業者返送）の7票綴りが標準とされた。
    keywords: ["マニフェスト", "7票綴り", "A票", "B票", "C票", "D票", "E票", "返送義務"]

  - id: "moe_2001_env_hei13_1"
    article: "環廃産発第131014001号"
    title: "産業廃棄物に係る不法投棄の防止等について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成13年"
    content: |
      不法投棄防止のための監視・指導体制の強化について。排出事業者及び処理業者に対する定期的な立入検査の実施、不適正処理の早期発見・早期対応のための情報収集体制の強化が求められた。違反行為に対する厳正な行政処分の実施と、悪質な業者の許可取消等の措置を積極的に活用することが通知された。
    keywords: ["不法投棄", "立入検査", "行政処分", "許可取消", "監視体制"]

  - id: "moe_2010_env_hei22"
    article: "環廃産発第100331001号"
    title: "廃棄物処理法の改正について（産業廃棄物の適正処理等）"
    issued_by: "環境省"
    issued_date: "平成22年"
    content: |
      廃棄物処理法改正（平成22年改正）の施行に伴う運用通知。主な改正点として、産業廃棄物処理業者に対する欠格要件の拡充（禁錮以上の刑に処せられた者等の追加）、許可申請書類の整備、事業計画書の記載事項の充実が図られた。また、産業廃棄物処理施設の維持管理に関する記録・閲覧制度が整備された。
    keywords: ["欠格要件", "許可申請", "維持管理記録", "平成22年改正"]

  - id: "moe_2017_env_hei29"
    article: "環循適発第170323号"
    title: "廃棄物処理法に基づく感染性廃棄物処理マニュアルについて"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成29年"
    content: |
      感染性廃棄物の適正処理について。医療機関等から排出される感染性廃棄物の分類、容器・包装の基準、排出・保管・収集運搬・処分の各段階における注意事項が示された。感染性廃棄物は特別管理産業廃棄物として厳正な管理が必要であり、専用の容器に密封し、バイオハザードマークを表示することが求められた。
    keywords: ["感染性廃棄物", "医療廃棄物", "バイオハザード", "特別管理産業廃棄物", "医療機関"]

  - id: "moe_2019_env_r1"
    article: "環循適発第19030108号"
    title: "廃棄物処理法に基づく行政処分の指針について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和元年"
    content: |
      行政処分の指針として、許可の取消、事業の停止命令、措置命令の要件・手続・考え方が示された。許可の取消は、欠格要件に該当した場合、虚偽申請が判明した場合、処理基準違反の繰り返し等の場合に行う。事業の停止命令は、処理基準違反があり改善が必要な場合に行う。措置命令は、不適正処理による生活環境支障が生じた場合に排出事業者及び処理業者双方に対して発する。
    keywords: ["行政処分指針", "許可取消", "事業停止命令", "措置命令", "欠格要件"]

  - id: "moe_2021_env_r3"
    article: "環循適発第2103292号"
    title: "廃棄物の処理及び清掃に関する法律の一部を改正する法律（令和3年改正）の施行について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和3年"
    content: |
      令和3年改正廃棄物処理法の施行に関する通知。主な改正内容は、排出事業者の適正処理に関する「優良事業者認定制度」の拡充、産業廃棄物収集運搬業の積替え保管施設の基準強化、産業廃棄物処理施設における残留汚染に係る土地の形質変更の届出制度の創設。また、廃棄物の海外輸出に係る規制の見直しが行われた。
    keywords: ["令和3年改正", "優良事業者認定", "積替え保管", "残留汚染", "海外輸出"]

  - id: "moe_manifest_qa"
    article: "環廃産発通知（Q&A）"
    title: "産業廃棄物管理票（マニフェスト）制度に関するQ&A"
    issued_by: "環境省"
    issued_date: "随時更新"
    content: |
      Q: マニフェストを交付しなかった場合の罰則は？
      A: マニフェストの交付義務違反は、廃棄物処理法第27条の2により、30万円以下の罰金に処せられる。

      Q: 電子マニフェストの利用は義務か？
      A: 特別管理産業廃棄物を排出する多量排出事業者（前年度の排出量が50トン以上）は、電子マニフェストの使用が義務付けられている。

      Q: マニフェストのE票が返ってこない場合の対応は？
      A: 処分が終了した日から3ヶ月以内にE票が返送されない場合、排出事業者は都道府県知事に報告する義務がある。

      Q: マニフェストなしで廃棄物を引き渡した場合、収集運搬業者に責任はあるか？
      A: 収集運搬業者もマニフェストなしでの引き受けは禁止されており、違反した場合は行政処分の対象となる。
    keywords: ["マニフェストQ&A", "罰則", "電子マニフェスト", "多量排出事業者", "E票未返送"]
