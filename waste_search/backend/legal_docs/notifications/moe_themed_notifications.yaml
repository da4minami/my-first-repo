title: "産業廃棄物行政に係る環境省テーマ別通知集"
category: "国通知"
sections:
  - id: "moe_theme_taisho_discharge"
    article: "環廃産発第040120001号"
    title: "多量排出事業者の産業廃棄物処理計画及び実施状況報告の提出について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成16年1月20日"
    content: |
      多量排出事業者（前年度の産業廃棄物の発生量が1,000トン以上又は特別管理産業廃棄物の発生量が50トン以上の事業場を設置している事業者）に関する産業廃棄物処理計画の作成・提出・公表に係る運用通知。提出先：事業場所在地を管轄する都道府県知事（複数都道府県に事業場がある場合は各都道府県知事に提出）。提出期限：毎年6月30日まで（前年度実績を含む計画・実施状況報告）。処理計画の記載事項：廃棄物の種類・発生量・処理方法・委託先・削減目標等。公表方法：都道府県が閲覧可能な状態で公表する。
    keywords: ["多量排出事業者処理計画", "1000トン", "50トン", "6月30日提出", "都道府県知事提出", "処理計画公表", "削減目標"]

  - id: "moe_theme_permit_revoke"
    article: "環廃産発第080925003号"
    title: "産業廃棄物処理業者に対する行政処分の指針について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成20年9月25日"
    content: |
      産業廃棄物処理業者に対する行政処分（改善命令・事業停止命令・許可取消し）の発動基準と手続きを示した指針。各行政処分の要件と効果：①改善命令（第19条の3）：処理基準違反に対する改善・停止命令②事業停止命令（第14条第6項）：欠格要件該当・許可条件違反等に対する停止命令③許可取消し（第14条第6項）：欠格要件該当・不正許可取得・繰り返し違反等に対する取消し。処分の量定（違反の程度・回数・態様・改善状況・危険性等を総合判断）の考え方。聴聞手続き・意見陳述機会の付与の要否。取消し後の処分・清算の指導。
    keywords: ["行政処分指針", "改善命令", "事業停止命令", "許可取消し", "量定基準", "聴聞手続き", "繰り返し違反"]

  - id: "moe_theme_commit_standards"
    article: "環廃産発第110325001号"
    title: "産業廃棄物の処理委託に係る規制の適正な運用について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成23年3月25日"
    content: |
      産業廃棄物の処理委託（排出事業者から処理業者への委託）に係る規制の適正な運用に関する通知。主な内容：①委託基準の要件（書面による委託契約・許可業者の確認・マニフェスト交付）の遵守徹底②書面による委託契約書の記載事項の確認（種類・数量・運搬先・処分先・料金等）③二者間委託と三者間委託の取扱い（収集運搬と処分を一括で別々の業者に委託する場合のマニフェスト処理方法）④委託先の処理実績確認の重要性（現地確認・マニフェスト返送状況の確認）⑤委託先が無許可業者と後から判明した場合の対応。
    keywords: ["委託基準運用", "書面委託契約確認", "三者間委託", "委託先処理実績確認", "無許可業者委託発覚後対応", "委託基準違反"]

  - id: "moe_theme_permit_application"
    article: "環廃産発第140331011号"
    title: "産業廃棄物処理業の許可申請書の様式及び記載事項について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成26年3月31日"
    content: |
      産業廃棄物収集運搬業・処分業の許可申請書の様式と記載事項の解説通知。申請書の様式：廃棄物処理法施行規則別表第7・8で定める様式。主要記載事項の解説：①申請者の情報（法人の場合は役員全員の氏名・住所・生年月日）②欠格要件に該当しないことの誓約書の添付③事業計画書（取り扱う廃棄物の種類・数量・収集運搬の方法・運搬先等）④施設の構造・能力を示す書類（処分業の場合）⑤財務諸表（経理的基礎の確認）。都道府県ごとの申請窓口と申請手数料（都道府県条例で規定）。
    keywords: ["許可申請書様式", "許可申請記載事項", "役員全員氏名", "欠格要件誓約書", "事業計画書", "財務諸表", "申請手数料"]

  - id: "moe_theme_final_disposal_monitor"
    article: "環廃産発第040331029号"
    title: "産業廃棄物の最終処分場の水質・地下水モニタリングについて"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成16年3月31日"
    content: |
      産業廃棄物の最終処分場（管理型・遮断型）における水質・地下水モニタリングに関する技術的指針。モニタリング対象：①浸出水（最終処分場から漏出する水）の水質②地下水（処分場周辺の地下水）の水質③放流水（浸出水処理後の放流水）の水質。測定頻度：浸出水は年4回以上、地下水・放流水は年2回以上。測定項目：廃棄物処理法施行規則で定める有害物質（鉛・六価クロム・砒素・BOD・COD等）。基準超過時の対応：都道府県知事への報告・原因究明・改善措置の実施。廃止基準（浸出水が基準値以下かつ廃棄物が安定した状態）の確認方法。
    keywords: ["最終処分場モニタリング", "浸出水水質検査", "地下水モニタリング", "放流水基準", "年4回測定", "有害物質測定", "廃止基準確認"]

  - id: "moe_theme_incineration"
    article: "環廃産発第150331003号"
    title: "廃棄物の焼却施設に係る一般的な処理基準及び維持管理基準について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成27年3月31日"
    content: |
      廃棄物焼却施設（産業廃棄物焼却施設含む）の処理基準・維持管理基準の解説通知。焼却の技術基準：①燃焼室での廃棄物の燃焼ガスの温度：800度以上②燃焼ガスの滞留時間：2秒以上③燃焼ガスのCO濃度：100ppm以下④未燃物の含有率（焼却残さ中）：1g/kg以下。ダイオキシン類の排出基準：廃棄物処理能力に応じた基準値（0.1〜10ng-TEQ/Nm3）。排ガス処理装置（バグフィルター・触媒装置等）の設置要件。焼却残さの処理（管理型最終処分場への埋立・溶融処理）。
    keywords: ["焼却施設処理基準", "燃焼温度800度", "ガス滞留時間2秒", "ダイオキシン排出基準", "バグフィルター", "焼却残さ処理"]

  - id: "moe_theme_broad_processing"
    article: "環廃産発第041130001号"
    title: "廃棄物の広域処理に係る都道府県間の協力について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部"
    issued_date: "平成16年11月30日"
    content: |
      産業廃棄物の広域処理（都道府県をまたいで廃棄物を処理する場合）に係る制度・手続きの解説通知。都道府県間をまたぐ産業廃棄物収集運搬業の許可：排出事業場所在地の都道府県と処分地所在地の都道府県の両方の許可が必要（積卸し場所の都道府県の許可も必要）。複数都道府県の許可取得の効率化（様式の統一・書類の一本化等）。積替え保管施設を経由する場合の手続き。環境大臣認定制度（広域認定）との使い分けの解説。都道府県間の情報共有と不適正処理の防止。
    keywords: ["産業廃棄物広域処理", "複数都道府県許可", "収集運搬業都道府県許可", "積替え保管", "広域認定制度使い分け"]

  - id: "moe_theme_small_amount"
    article: "環廃産発第030331011号"
    title: "少量の産業廃棄物の処理に係る廃棄物処理法の適用について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成15年3月31日"
    content: |
      少量の産業廃棄物の排出・処理に係る廃棄物処理法の適用に関する通知。産業廃棄物の処理は量の多少に関わらず廃棄物処理法が適用される（少量であっても不法投棄罪・無許可業者への委託禁止等の規定が適用される）。少量の廃棄物であっても適正な処理が必要（マニフェストの交付義務・委託基準の遵守）。小規模事業者（個人商店・小規模飲食店等）からの産業廃棄物の一般廃棄物処理業者による処理の可否（市町村が産業廃棄物と一般廃棄物を同時処理できる場合の条件）。
    keywords: ["少量産業廃棄物", "廃棄物処理法適用", "小規模事業者廃棄物", "一般廃棄物同時処理", "量の多少と廃棄物処理法"]

  - id: "moe_theme_recycling_center"
    article: "環廃産発第050119001号"
    title: "廃棄物再生事業者の登録制度について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成17年1月19日"
    content: |
      廃棄物処理法第20条の2に基づく廃棄物再生事業者の登録制度に関する通知。廃棄物再生事業者とは、廃棄物の再生利用を事業として行う者であって、都道府県知事に登録した者。登録により受ける優遇措置：廃棄物処理業の許可を受けた場合と同等の取扱い（発注者への情報提供等）。登録要件：廃棄物の再生利用の実績・能力・施設の有無。登録を受けた廃棄物再生事業者への処理委託は委託基準上の位置付け（再生利用を行う者への委託の特例）。廃棄物再生事業者登録制度と広域認定制度の関係。
    keywords: ["廃棄物再生事業者登録", "廃棄物処理法第20条の2", "再生利用事業者", "登録要件", "委託基準特例"]

  - id: "moe_theme_illegal_download"
    article: "環廃産発第190829001号"
    title: "インターネット等を通じた産業廃棄物の不法投棄等の斡旋行為への対応について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和元年8月29日"
    content: |
      インターネット（オークションサイト・SNS・掲示板等）を通じた廃棄物の不適正処理の斡旋・仲介行為に対する監視・取締りに関する通知。主な問題事例：①無許可業者が「格安処理」等を謳って廃棄物処理を請け負う広告を掲載②廃棄物の不法投棄場所の斡旋③廃棄物の引き取りに見せかけた廃棄物の持ち込み誘引。都道府県・市区町村による定期的なネット監視の実施指示。摘発事例と適用法条の解説（廃棄物処理法第14条・第16条等）。排出事業者がインターネット経由で業者を選定する場合の注意事項（許可番号の確認等）。
    keywords: ["インターネット廃棄物斡旋", "無許可業者ネット広告", "ネット監視", "格安廃棄物処理", "無許可業者摘発", "排出事業者注意事項"]

  - id: "moe_theme_covid_manifest"
    article: "環循適発第200401001号"
    title: "新型コロナウイルス感染症に係るマニフェスト等の取扱いについて"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和2年4月1日"
    content: |
      新型コロナウイルス感染症（COVID-19）に係る廃棄物処理業の許可申請・更新申請・マニフェスト等の取扱いに関する特例通知。主な内容：①緊急事態宣言期間中のマニフェスト交付の代替措置（電子マニフェストへの切り替え推奨）②許可証更新申請の受付期限の延長（都道府県の判断による柔軟な対応）③感染性廃棄物（医療機関由来）の緊急処理に関する特例的な取扱い（処分業者の処理能力超過時の対応）④在宅勤務・テレワークに伴う廃棄物処理業者の事務処理の特例。
    keywords: ["コロナ禍マニフェスト特例", "緊急事態宣言廃棄物処理", "許可更新延長", "電子マニフェスト切替", "感染性廃棄物緊急処理", "在宅勤務廃棄物"]

  - id: "moe_theme_electronic_mandate_obligation"
    article: "環廃産発第130118001号"
    title: "電子マニフェスト義務化の詳細について（多量排出事業者）"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成25年1月18日"
    content: |
      特別管理産業廃棄物を排出する多量排出事業者（前年度の特別管理産業廃棄物の排出量が50トン以上の事業者）への電子マニフェスト使用義務の詳細解説通知。①義務化対象となる排出量の計算方法（全事業場の合計ではなく、1つの事業場ごとに前年度の排出量が50トン以上かどうかで判断）②電子マニフェスト（JWNET）の加入手続き③紙マニフェストから電子マニフェストへの移行スケジュール④電子マニフェストの操作方法の習得（システム説明会情報）⑤義務違反（紙マニフェストを継続使用）への対応（行政指導・改善命令の対象）。
    keywords: ["電子マニフェスト義務化詳細", "50トン", "事業場ごと判断", "JWNET加入手続き", "電子マニフェスト移行", "義務違反対応"]

  - id: "moe_theme_qualified_company"
    article: "環廃産発第110204003号"
    title: "優良産廃処理業者認定制度の申請・認定基準の詳細について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成23年2月4日"
    content: |
      優良産廃処理業者認定制度（廃棄物処理法第14条第13項に基づく認定）の申請手続き・認定基準の詳細解説。5つの認定基準の詳細：①遵法性：直近3年間に廃棄物処理法・環境関連法令の規定に違反していないこと（行政処分を受けていないこと）②情報公開：事業の状況（許可証写し・処理実績・財務諸表・施設の状況・具体的な処理方法等）をウェブサイトで公表③環境配慮：ISO14001・エコアクション21・独自の環境保全指針等の取組み実績④電子マニフェストの使用⑤財務体質の健全性（直近3年間の決算書等）。認定の有効期間（7年）と更新手続き。
    keywords: ["優良産廃処理業者認定基準詳細", "5つの認定基準", "遵法性", "情報公開ウェブサイト", "ISO14001", "電子マニフェスト使用", "7年許可期間"]

  - id: "moe_theme_waste_oil"
    article: "環廃産発第030110001号"
    title: "廃油の処理に係る留意事項について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成15年1月10日"
    content: |
      廃油（産業廃棄物・特別管理産業廃棄物）の処理に係る留意事項。廃油の分類：①引火点が70度未満の廃油：特別管理産業廃棄物（引火性廃油）として厳重な管理が必要②引火点が70度以上の廃油：通常の産業廃棄物として管理③廃PCBを含む廃油：特別管理産業廃棄物として廃PCB等の規定が適用。廃油の保管方法（専用の密閉容器・引火点未満での保管禁止・防火措置）。廃油の処分方法（燃料化・油水分離後の焼却・再生精製等）。廃食用油・廃潤滑油・廃切削油等の種類別の取扱い方法。廃油収集運搬業・廃油処分業の許可区分（引火点による特別管理産業廃棄物か否かで区分）。
    keywords: ["廃油処理留意事項", "引火点70度未満", "特別管理産業廃棄物廃油", "廃油保管方法", "廃食用油", "廃潤滑油", "廃油収集運搬業許可"]
