title: "産業廃棄物行政に係る環境省通知集（施設・技術基準編）"
category: "国通知"
sections:
  - id: "moe_facility_incineration_detail"
    article: "環廃産発第020820002号"
    title: "廃棄物処理法に基づく廃棄物焼却施設の技術基準について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成14年8月20日"
    content: |
      廃棄物処理法施行規則に規定する廃棄物焼却施設の技術基準の詳細解釈。
      【構造基準】①燃焼室（廃棄物の燃焼ガスの温度が800℃以上となるよう設計）②後燃焼室（ガス滞留時間2秒以上・後燃焼バーナー設置）③排ガス処理設備（集じん装置・有害ガス除去装置・排ガス冷却設備）④廃熱ボイラー（設置任意だが設置する場合の基準）⑤灰・残さの冷却・排出設備。
      【維持管理基準】燃焼管理記録（温度・CO濃度等）の毎日記録義務、年1回以上のダイオキシン類測定義務、排ガスの自動測定装置の設置推奨。
      【ばいじん・焼却残さの処理】ばいじんは特別管理産業廃棄物（廃棄物処理法施行令第2条の4第5号）として処理。焼却残さは管理型最終処分場での埋立又は溶融処理。
    keywords: ["廃棄物焼却施設技術基準", "燃焼室800℃", "後燃焼室2秒", "集じん装置", "ダイオキシン類測定", "ばいじん特別管理産業廃棄物", "焼却残さ処理"]

  - id: "moe_facility_final_disposal_structure"
    article: "環廃産発第030331012号"
    title: "産業廃棄物の最終処分場の構造基準について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成15年3月31日"
    content: |
      産業廃棄物最終処分場（安定型・管理型・遮断型）の構造基準の技術的解釈。
      【安定型最終処分場】埋立地の底面・周囲に遮水工は不要。ただし、浸透水調査ピット（検水設備）の設置が必要で、定期的な水質検査（半年1回以上）を実施する。展開検査（搬入廃棄物の目視確認）の実施義務。
      【管理型最終処分場】①遮水工（遮水シート・遮水壁）②浸出液集排水設備③浸出液処理設備（放流基準を満たす処理が必要）④地下水集排水設備⑤覆土設備。浸出液の水質検査：年4回以上（BOD・COD・有害物質等）。
      【遮断型最終処分場】金属製・コンクリート製の容器で廃棄物を完全密閉。雨水・地下水が廃棄物に接触しない構造。燃え殻・ばいじん・廃酸・廃アルカリ等の有害廃棄物の処分に使用。
    keywords: ["最終処分場構造基準", "安定型検水設備", "管理型遮水工", "浸出液処理設備", "遮断型最終処分場", "浸出液水質検査", "有害廃棄物処分"]

  - id: "moe_facility_intermediate_processing"
    article: "環廃産発第040331030号"
    title: "産業廃棄物の中間処理施設の技術基準及び維持管理基準について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成16年3月31日"
    content: |
      廃棄物処理法施行規則の中間処理施設（焼却以外）の技術・維持管理基準の解釈。
      【破砕施設】騒音・振動・粉じん防止設備の設置、金属等の発火性物質・爆発性物質の混入防止措置。
      【脱水施設（汚泥処理）】脱水機の種類（フィルタープレス・ベルトプレス・遠心脱水等）と処理能力の確認方法。処理水の排水基準適合確認。
      【中和施設（廃酸・廃アルカリ処理）】耐食性設備の使用、薬液の適切な保管、処理水の排水基準適合確認（pH等）。
      【油水分離施設】油分除去効率の確認方法、処理水の水質基準適合確認。
      【切断施設・圧縮施設】設備の構造・能力確認。
      維持管理記録（日誌等）の記載事項・保存期間（5年）の詳細解説。
    keywords: ["中間処理施設技術基準", "破砕施設", "脱水施設汚泥", "中和施設廃酸廃アルカリ", "油水分離施設", "維持管理記録5年", "切断圧縮施設"]

  - id: "moe_facility_pcb_treatment"
    article: "環廃産発第050301003号"
    title: "低濃度ポリ塩化ビフェニル廃棄物の処理施設の整備について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成17年3月1日"
    content: |
      低濃度PCB廃棄物（PCB濃度が高濃度PCBの基準値未満のもの）の処理施設（無害化処理認定施設）の整備促進に関する通知。廃棄物処理法第15条の4の4の無害化処理認定制度（低濃度PCB廃棄物の処理に係る環境大臣認定）の概要。認定申請の要件（施設の構造・処理能力・PCB分解性能等）。低濃度PCB廃棄物の種類（PCB汚染変圧器・PCB汚染コンデンサ・PCB汚染安定器・PCB汚染塗料等）。高温熱分解・超臨界水酸化分解・水熱酸化分解等の処理技術の評価基準。認定施設への搬入手続き（事前予約・運搬委託契約・マニフェスト管理等）。
    keywords: ["低濃度PCB廃棄物処理施設", "無害化処理認定制度", "環境大臣認定", "高温熱分解", "超臨界水酸化分解", "PCB汚染変圧器", "PCB汚染安定器"]

  - id: "moe_facility_gasification_melting"
    article: "環廃産発第060331006号"
    title: "廃棄物ガス化溶融施設の技術指針について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成18年3月31日"
    content: |
      廃棄物ガス化溶融施設（廃棄物を高温でガス化・溶融処理する施設）の技術指針。ガス化溶融処理の原理（廃棄物を熱分解・ガス化し、高温で溶融して無機物をスラグ化・金属回収する方式）。ガス化溶融スラグの廃棄物非該当性の判断基準（品質基準：溶出基準・含有基準・外観・強度等を満たすものは廃棄物に該当しない）。スラグの再利用用途（路盤材・コンクリート骨材等）。廃棄物処理法上の施設許可区分（廃棄物の焼却施設・熔融処理施設）。排ガス・排水・スラグの管理基準。施設の廃止時の対応。
    keywords: ["ガス化溶融施設", "溶融スラグ廃棄物非該当性", "スラグ品質基準", "スラグ路盤材利用", "廃棄物ガス化処理", "熔融処理施設許可"]

  - id: "moe_facility_concrete_recycling"
    article: "環廃産発第090330005号"
    title: "コンクリートくず等の再生利用に係る廃棄物処理法の取扱いについて"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成21年3月30日"
    content: |
      建設工事から発生するコンクリートくず（コンクリート塊）の再生利用に係る廃棄物処理法の適用関係の整理。コンクリートくずを破砕して製造された再生砕石（RC-40等）の廃棄物非該当性の判断：一定の品質基準（粒度・強度・有害物質溶出等）を満たし、道路路盤材等の用途で実際に利用されるものは廃棄物に該当しない。再生砕石の製造（コンクリートくずの破砕処理）を行う施設の廃棄物処理業の許可の要否（産業廃棄物中間処理業の許可が必要）。再生砕石の製造・販売過程での廃棄物処理法とリサイクル関連法の関係。建設汚泥の再生品（改良土）との違い。
    keywords: ["コンクリートくず再生砕石", "RC-40", "廃棄物非該当性判断", "再生砕石品質基準", "再生砕石路盤材", "コンクリート破砕施設許可", "建設廃棄物再生利用"]

  - id: "moe_facility_waste_to_energy"
    article: "環廃産発第100331004号"
    title: "廃棄物からのエネルギー回収（廃棄物発電・RDF利用等）に関する廃棄物処理法上の取扱い"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成22年3月31日"
    content: |
      廃棄物からのエネルギー回収（廃棄物発電・熱回収・固形燃料化等）に係る廃棄物処理法上の位置付けと取扱いの整理。廃棄物発電（廃棄物焼却施設での発電）：焼却施設の許可を受けた上でエネルギー回収が可能。廃棄物焼却による熱回収（蒸気・温水等）も同様。廃棄物固形燃料（RDF・RPF）の製造：廃棄物処理業（処分業）の許可が必要。製造されたRDF・RPFが廃棄物に該当しなくなる条件（品質基準の達成・安定した利用用途の確保等）。セメント工場での廃棄物使用（廃棄物をセメント原料・熱エネルギーとして使用する場合の許可の取扱い）。
    keywords: ["廃棄物エネルギー回収", "廃棄物発電", "RDF製造許可", "RPF製造許可", "廃棄物セメント原料化", "廃棄物固形燃料化", "熱回収"]

  - id: "moe_facility_closed_mine"
    article: "環廃産発第110331001号"
    title: "鉱山廃水・坑廃水等の産業廃棄物処理法上の取扱いについて"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成23年3月31日"
    content: |
      鉱山から排出される廃水（坑廃水・選鉱廃水・尾鉱浸出水等）の廃棄物処理法上の取扱いに関する通知。鉱山廃水は廃棄物処理法上の産業廃棄物（廃酸・廃アルカリ・汚泥等）に該当する場合がある。廃鉱山からの廃水：廃鉱山においても事業者の廃棄物処理責任が継続する（廃業しても旧事業者の責任が消滅しない）。廃鉱山廃水に含まれる有害物質（重金属：カドミウム・鉛・ヒ素・水銀等）の管理基準。鉱山廃水処理施設（中和処理施設・沈殿池等）の廃棄物処理施設としての許可の要否。鉱業法・採石法との関係（廃棄物処理法と鉱業法の適用関係）。
    keywords: ["鉱山廃水", "坑廃水", "廃鉱山廃棄物責任", "選鉱廃水汚泥", "重金属廃水処理", "廃鉱山事業者責任継続", "鉱業法廃棄物処理法関係"]

  - id: "moe_facility_solar_panel"
    article: "環循適発第190328001号"
    title: "太陽光発電設備の廃棄等に係る廃棄物処理法上の取扱いについて"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和元年3月28日"
    content: |
      使用済み太陽光発電パネル（廃太陽電池モジュール）の廃棄物処理法上の取扱い。廃太陽電池モジュールは産業廃棄物（廃プラスチック類・ガラスくず・金属くず等の複合廃棄物）に該当する。鉛・カドミウム・セレン等の有害物質を含む太陽電池モジュール（薄膜太陽電池等）は特別管理産業廃棄物に該当する可能性がある。廃太陽電池モジュールの処理方法（分解・素材別リサイクル）。廃棄物処理業の許可（廃プラスチック類・ガラスくず・金属くずの収集運搬業・処分業）の確認。リユース・リサイクルを目的とした廃太陽電池モジュールの取扱い（廃棄物非該当の可能性）。再生可能エネルギー電気の調達に関する特別措置法との関係。
    keywords: ["廃太陽電池モジュール", "使用済み太陽光パネル", "廃棄物処理法適用", "鉛カドミウムセレン含有", "特別管理産業廃棄物該当性", "太陽光パネルリサイクル"]

  - id: "moe_facility_wind_turbine"
    article: "環循適発第210401003号"
    title: "風力発電設備の廃棄等に係る廃棄物処理法上の留意事項について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和3年4月1日"
    content: |
      使用済み風力発電設備（廃風力発電ブレード等）の廃棄物処理法上の取扱い。廃風力発電ブレードは繊維強化プラスチック（GFRP・CFRP）製であり、廃プラスチック類として産業廃棄物に該当する。廃ブレードの処理方法：①破砕後に管理型最終処分場で埋立②焼却処理（廃プラスチック類として）③セメントキルンでの燃料・原料利用④リサイクル技術（熱分解・溶剤分解等による繊維回収）の開発状況。廃風力発電ブレードの大きさ・重量（１枚50m超・重量数十トン）に起因する収集運搬・破砕処理上の課題。廃棄物処理業の許可区分（廃プラスチック類の収集運搬業・処分業）の確認。
    keywords: ["廃風力発電ブレード", "廃プラスチック類", "GFRP廃棄物", "CFRP廃棄物", "ブレード破砕処理", "セメントキルン利用", "繊維強化プラスチック廃棄"]

  - id: "moe_facility_battery"
    article: "環循適発第220301001号"
    title: "使用済みリチウムイオン電池等の廃棄物処理法上の取扱いについて"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和4年3月1日"
    content: |
      使用済みリチウムイオン電池（廃リチウムイオン電池）の廃棄物処理法上の取扱い。廃リチウムイオン電池は産業廃棄物（廃プラスチック類・金属くず等の複合廃棄物）に該当する。廃リチウムイオン電池の発火リスクへの対応（熱暴走・発火防止措置）と廃棄物処理施設での対応。電気自動車（EV）の廃バッテリーの取扱い（大型廃リチウムイオン電池）：残留電圧の放電処理後に廃棄物処理。廃リチウムイオン電池のリサイクル（コバルト・ニッケル・リチウム等の有価金属の回収）：リサイクル事業者への有価売却の場合は廃棄物に該当しない可能性。廃棄物収集運搬時の安全対策（絶縁・単独収納等）の徹底指示。
    keywords: ["廃リチウムイオン電池", "EV廃バッテリー", "廃棄物処理法適用", "発火リスク対応", "有価金属回収リサイクル", "廃電池収集運搬安全対策"]
