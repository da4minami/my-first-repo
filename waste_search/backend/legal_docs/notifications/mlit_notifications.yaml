title: "建設廃棄物行政に係る国土交通省通知集"
category: "国通知"
sections:
  - id: "mlit_h13_kensetsu_guideline"
    article: "国土交通省通知"
    title: "建設廃棄物処理指針（平成13年版）について"
    issued_by: "国土交通省大臣官房技術調査課"
    issued_date: "平成13年8月"
    content: |
      建設工事から発生する廃棄物（建設廃棄物）の適正処理を促進するための指針。建設廃棄物の種類（コンクリートくず・木くず・金属くず・廃プラスチック類・アスファルトコンクリートくず・混合廃棄物等）と処理ルートの解説。元請業者の責任（排出事業者責任）と下請業者の位置付け。建設廃棄物の分別収集の重要性と具体的な分別方法。マニフェストの適正管理（建設工事でのマニフェスト交付・管理方法）。建設汚泥・発生土の廃棄物該当性の判断（有効利用できる土砂は廃棄物に該当しない場合がある）。
    keywords: ["建設廃棄物処理指針", "国土交通省", "元請業者責任", "分別収集", "建設汚泥", "廃棄物該当性", "建設廃棄物の種類"]

  - id: "mlit_h19_kensetsu_guideline_rev"
    article: "国都街第190号、国総施第133号"
    title: "建設廃棄物処理指針（平成19年版）について"
    issued_by: "国土交通省都市・地域整備局・総合政策局"
    issued_date: "平成19年7月"
    content: |
      建設廃棄物処理指針の平成19年改訂版。主な改訂・追加内容：①建設リサイクル法に基づく分別解体・再資源化義務の徹底②石綿含有廃棄物に関する規定の大幅追加（解体工事前の石綿含有調査・飛散防止対策・廃棄物処理法上の取扱い）③建設汚泥の適正処理・有効利用の基準の明確化④混合廃棄物の処理方針（分別が困難な場合の取扱い）⑤公共工事における建設廃棄物の適正処理の徹底（発注者・元請業者・下請業者の役割分担）。建設工事における廃棄物処理費用の適正な計上の指示。
    keywords: ["建設廃棄物処理指針平成19年版", "建設リサイクル法遵守", "石綿含有廃棄物", "建設汚泥適正処理", "混合廃棄物", "廃棄物処理費用計上"]

  - id: "mlit_h14_kensetsu_doro"
    article: "国都街第64号"
    title: "建設工事から排出されるがれき類・アスファルトコンクリートの再資源化について"
    issued_by: "国土交通省都市・地域整備局"
    issued_date: "平成14年3月"
    content: |
      道路・建築物等の解体・改築工事から発生するコンクリート塊・アスファルトコンクリート塊の再資源化に関する通知。コンクリート塊（廃コンクリート）の再生砕石への利用・セメント原料化。アスファルトコンクリート塊（廃アスファルト混合物）の再生合材への利用。建設発生土（掘削残土）の有効利用促進（建設発生土情報交換システムの活用）。建設リサイクル法対象工事における再資源化目標（コンクリート塊・アスファルトコンクリート塊の再資源化率95%以上）の達成に向けた取組み指示。
    keywords: ["コンクリート塊再資源化", "アスファルトコンクリート再資源化", "建設発生土", "再生砕石", "再生合材", "再資源化率95%"]

  - id: "mlit_h18_doboku_waste"
    article: "国総施第26号"
    title: "建設工事から発生する木くず及びがれき類の取扱いについて"
    issued_by: "国土交通省総合政策局建設施工企画課"
    issued_date: "平成18年3月31日"
    content: |
      建設工事から発生する木くず（型枠材・足場材・梱包材等）及びがれき類の廃棄物処理法上の取扱いを明確化した通知。建設工事から発生する木くずは産業廃棄物（木くず）に該当し、廃棄物処理法に基づく適正処理が必要。ただし、有価物として有償売却される場合は廃棄物に該当しない。がれき類（コンクリート破片・レンガ等）も産業廃棄物（がれき類）として適正処理が必要。建設リサイクル法の対象工事では分別解体・再資源化義務がある。解体工事業者が木くず等の処分を行う場合の廃棄物処理業許可の要否。
    keywords: ["建設木くず", "型枠材", "足場材", "がれき類処理", "廃棄物処理業許可要否", "解体工事業者", "建設廃棄物有価物判断"]

  - id: "mlit_kensetsu_doro_asbestos"
    article: "国総施第142号"
    title: "建設工事における石綿（アスベスト）廃棄物の適正処理について"
    issued_by: "国土交通省総合政策局建設施工企画課"
    issued_date: "平成17年12月"
    content: |
      建設解体工事における石綿含有廃棄物の適正処理に関する国土交通省独自の通達。主な内容：①建設工事前の石綿使用有無の事前調査の徹底（設計図書・現地調査）②石綿含有建材（クリソタイル含有吹付け材・石綿含有断熱材・石綿含有成形板等）の種類と判別方法③廃石綿等（飛散性）の処理：飛散防止措置を施した後に特別管理産業廃棄物処理業者に委託④石綿含有廃棄物（非飛散性）：産業廃棄物処理業者に委託、管理型処分場での処理⑤解体工事費見積書への石綿廃棄物処理費の適正計上。
    keywords: ["建設工事石綿廃棄物", "国土交通省石綿対策", "石綿事前調査徹底", "廃石綿飛散性", "解体工事費石綿処理費", "石綿含有成形板"]

  - id: "mlit_kensetsu_dosha"
    article: "国総施第8号"
    title: "建設汚泥の再生利用に関する指針について"
    issued_by: "国土交通省総合政策局建設施工企画課"
    issued_date: "平成18年6月12日"
    content: |
      建設工事から排出される建設汚泥（掘削工事・シールドトンネル工事・橋梁基礎工事等から生じる汚泥）の再生利用指針。建設汚泥の廃棄物該当性の判断基準（産業廃棄物「汚泥」として廃棄物処理法が適用される）。建設汚泥の再生利用の方法：脱水・固化処理後の盛土材・裏込め材・埋立材等への利用。建設汚泥の再生品（改良土）が廃棄物に該当しなくなる条件（品質・用途・汚染物質含有量の基準を満たすこと）。建設汚泥の適正処理：廃棄物処理法に基づく産業廃棄物（汚泥）として処理業者に委託する場合の手続き。
    keywords: ["建設汚泥再生利用指針", "建設汚泥廃棄物該当性", "脱水固化処理", "改良土", "汚泥再生品の廃棄物非該当性", "盛土材利用"]

  - id: "mlit_kensetsu_mixing"
    article: "国総施第24号"
    title: "建設廃棄物の混合廃棄物の処理に関する指針について"
    issued_by: "国土交通省総合政策局建設施工企画課"
    issued_date: "平成20年3月31日"
    content: |
      建設工事から排出される混合廃棄物（種類の異なる建設廃棄物が分別されずに混合した廃棄物）の適正処理に関する指針。建設廃棄物の種類別分別の原則（コンクリートくず・木くず・金属くず・廃プラスチック類等を分別して排出）。混合廃棄物が生じる主な原因（内装解体工事・小規模改修工事等）。混合廃棄物の処理方法：①建設廃棄物処理業者による選別処理後の種類別処理②溶融処理（高温溶融により安定化）。混合廃棄物を受け入れる処理業の許可区分の整理。混合廃棄物の最終処分場（管理型処分場）での処理基準。
    keywords: ["建設混合廃棄物", "混合廃棄物処理指針", "建設廃棄物分別原則", "選別処理", "溶融処理", "内装解体廃棄物", "管理型処分場"]

  - id: "mlit_kensetsu_recycle_act"
    article: "国総施第15号"
    title: "建設工事に係る資材の再資源化等に関する法律（建設リサイクル法）の施行について"
    issued_by: "国土交通省総合政策局建設施工企画課"
    issued_date: "平成13年5月30日"
    content: |
      建設リサイクル法（平成13年5月施行）の施行に伴う国土交通省の運用指針。主な内容：①分別解体等の実施（対象建設工事：床面積80㎡以上の解体・500㎡以上の新築・請負代金1億円以上の修繕等）②事前届出（発注者又は自主施工者は工事着手7日前までに都道府県知事に届出）③再資源化等の義務（コンクリート塊・アスファルトコンクリート塊・木材・金属くず等の特定建設資材廃棄物の再資源化率目標）④解体工事業者の登録義務⑤発注者への説明義務（受注者は施工方法・再資源化等の措置・費用を書面で発注者に説明）。
    keywords: ["建設リサイクル法施行通知", "分別解体等義務", "事前届出義務", "7日前届出", "特定建設資材廃棄物", "解体工事業者登録", "発注者説明義務"]

  - id: "mlit_public_works_waste"
    article: "国総施第75号"
    title: "公共工事における建設廃棄物の適正な処理について"
    issued_by: "国土交通省総合政策局建設施工企画課"
    issued_date: "平成21年3月31日"
    content: |
      国土交通省が発注する公共工事における建設廃棄物の適正処理に関する通知。主な内容：①元請業者（排出事業者）の責任の明確化（下請業者に廃棄物処理を直接委託してはならない）②設計図書への廃棄物処理方法の明示（廃棄物の種類・数量・処理先の記載）③マニフェストの適正管理（工事完成までに全マニフェストの回収確認）④産業廃棄物処理費用の適正計上（廃棄物処理費をダンプ運搬費と混同しないこと）⑤建設廃棄物の不法投棄防止のための現場管理の徹底。公共工事の監督職員による施工管理の一環としての廃棄物管理の指示。
    keywords: ["公共工事建設廃棄物", "元請業者排出事業者責任", "下請直接委託禁止", "マニフェスト適正管理", "廃棄物処理費用計上", "現場管理徹底"]

  - id: "mlit_tunnel_excavation"
    article: "国総施第22号"
    title: "トンネル掘削工事から発生するずり（掘削ずり）の廃棄物該当性について"
    issued_by: "国土交通省総合政策局建設施工企画課"
    issued_date: "平成24年3月30日"
    content: |
      トンネル工事から発生する掘削ずり（岩盤・土砂等の掘削排出物）の廃棄物処理法上の取扱いに関する通知。掘削ずりは一般に「土砂」であり、有効利用できる場合は廃棄物に該当しない。ただし、土砂として有効利用できない場合（品質基準を満たさない、処分先がない等）は廃棄物（産業廃棄物の「がれき類」又は「汚泥」）として廃棄物処理法が適用される。有害物質（重金属等）に汚染された掘削ずりは産業廃棄物（汚泥）として適正処理が必要。不法投棄された場合は廃棄物処理法違反となる。各種判断フロー（有価物・廃棄物・土砂の判別基準）を図示。
    keywords: ["トンネル掘削ずり", "建設発生土廃棄物該当性", "土砂有効利用", "有害汚染土", "がれき類汚泥判断", "土砂廃棄物区別"]

  - id: "mlit_soil_contamination_waste"
    article: "国総施第93号"
    title: "建設工事から発生する汚染土壌の適正処理について"
    issued_by: "国土交通省総合政策局建設施工企画課"
    issued_date: "平成22年3月31日"
    content: |
      建設工事の掘削時に発見された汚染土壌（特定有害物質で汚染された土砂）の適正処理に関する通知。汚染土壌は廃棄物処理法上の産業廃棄物（汚泥）に該当し、廃棄物処理法に基づく処理が必要。土壌汚染対策法に基づく調査・措置との連携。汚染土壌の処理方法（封じ込め・不溶化・焼却・セメント固化・汚染除去処理等）と廃棄物処理法上の位置づけ。汚染土壌の収集運搬・処分に必要な廃棄物処理業の許可区分（汚泥収集運搬業・汚泥処分業）。浄化処理後の土壌の廃棄物非該当性の判断基準。
    keywords: ["汚染土壌処理", "建設工事汚染土", "廃棄物処理法適用", "土壌汚染対策法連携", "汚泥収集運搬業", "封じ込め", "不溶化処理"]

  - id: "mlit_small_construction"
    article: "国総施第11号"
    title: "小規模建設工事から排出される廃棄物の適正処理について"
    issued_by: "国土交通省総合政策局建設施工企画課"
    issued_date: "平成20年3月"
    content: |
      住宅の内装改修・小規模修繕等の小規模建設工事から発生する廃棄物の適正処理に関する通知。建設リサイクル法の対象外となる小規模工事（床面積80㎡未満の解体等）でも廃棄物処理法の適用があること。元請業者が排出事業者として廃棄物処理の責任を負うこと。小規模工事での分別・マニフェスト管理の徹底（廃棄物種類ごとの分別と適正な処理業者への委託）。廃棄物を不法投棄した場合の罰則（廃棄物処理法第16条）。一般廃棄物と産業廃棄物の区別（事業活動に伴って生じた廃棄物は産業廃棄物）。
    keywords: ["小規模建設工事廃棄物", "建設リサイクル法対象外工事", "元請業者責任", "内装改修廃棄物", "廃棄物分別マニフェスト", "産業廃棄物一般廃棄物区別"]

  - id: "mlit_kensetsu_cost"
    article: "国総施第66号"
    title: "建設工事における廃棄物処理に要する費用の適正な計上について"
    issued_by: "国土交通省総合政策局建設施工企画課"
    issued_date: "平成23年3月31日"
    content: |
      建設工事における廃棄物処理費用の適正な積算・計上に関する通知。廃棄物処理費用の過少積算が不法投棄等の不適正処理の原因となることを指摘。適正な廃棄物処理費用の構成（収集運搬費・処分費・マニフェスト発行費等）の解説。公共工事においては、設計段階から廃棄物の種類・数量を見積り、処理費用を適正に計上すること。元請業者が下請業者に廃棄物処理を違法に（費用負担なしで）行わせることの禁止（廃棄物処理法違反となる場合がある）。発注者・設計者・施工者それぞれの役割と費用負担の考え方。
    keywords: ["廃棄物処理費用計上", "建設工事廃棄物費用", "過少積算", "不法投棄原因", "公共工事設計積算", "元請下請費用負担"]
