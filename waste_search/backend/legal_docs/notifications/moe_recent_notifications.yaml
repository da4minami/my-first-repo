title: "産業廃棄物行政に係る環境省通知集（平成20年〜令和）"
category: "国通知"
sections:
  - id: "moe_h20_mercury"
    article: "環廃産発第080331001号"
    title: "廃水銀等の処理に関する技術的留意事項について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成20年3月31日"
    content: |
      廃水銀（廃水銀及び廃水銀化合物）の処理における技術的留意事項を示した通知。特別管理産業廃棄物である廃水銀等の保管方法（密封容器・施錠管理・転倒防止）、収集運搬方法（漏洩防止・密封容器）、処分方法（硫化・固化処理後の遮断型最終処分場での埋立）の詳細を示した。廃水銀を含む製品（蛍光灯・体温計・電池等）のリサイクル・処分方法の解説。水銀使用製品産業廃棄物（水銀廃棄物）の分類と処理方法。
    keywords: ["廃水銀", "廃水銀処理", "密封保管", "硫化処理", "遮断型処分場", "蛍光灯廃棄"]

  - id: "moe_h22_reform"
    article: "環廃対発第100331005号"
    title: "廃棄物の処理及び清掃に関する法律の一部改正（平成22年・産廃税・優良認定等）について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部"
    issued_date: "平成22年3月31日"
    content: |
      平成22年廃棄物処理法改正の施行通知。主な改正内容：①優良産廃処理業者認定制度の創設（遵法性・情報公開・環境配慮・電子マニフェスト・財務健全性の5基準を満たす者に許可有効期間7年の優遇）②産業廃棄物処理施設の廃止に伴う土地の形質変更の届出制度の創設③廃棄物処理業者の欠格要件の拡充（暴力団排除条項の追加）④廃棄物処理施設の技術管理者について環境大臣登録制度の整備⑤廃棄物の不法投棄等に係る産業廃棄物税（法定外目的税）との関係整理。
    keywords: ["平成22年改正", "優良産廃処理業者認定", "許可期間7年", "暴力団排除", "技術管理者", "産廃税"]

  - id: "moe_h23_waste_judgment_detail"
    article: "環廃産発第110204005号"
    title: "廃棄物の該当性の判断に係る専門家検討委員会報告書について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成23年2月4日"
    content: |
      廃棄物の該当性の判断基準を詳細に示した通知。有価物か廃棄物かの総合判断基準：①物の性状（利用用途に沿った品質があるか）②排出状況（分別・保管・品質管理がされているか）③通常の取扱い形態（有価物として流通する取引実態があるか）④取引価値の有無（実際に有償で売却されているか）⑤占有者の意思（廃棄・売却のいずれを意図しているか）。「専ら物」（専ら有価物として利用されるくず鉄・古紙・空き缶・くず繊維）については処理業の許可不要。名目上の有価物売却が廃棄物の不法処理の隠れ蓑となる場合の対処方針も示した。
    keywords: ["廃棄物該当性判断基準", "有価物か廃棄物か", "総合判断", "専ら物", "くず鉄", "古紙", "名目上有価物", "5つの判断基準"]

  - id: "moe_h23_tsunami"
    article: "環廃対発第110323004号"
    title: "東日本大震災に係る災害廃棄物の処理について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部廃棄物対策課"
    issued_date: "平成23年3月23日"
    content: |
      東日本大震災（平成23年3月11日）に係る災害廃棄物の処理に関する緊急通知。主な内容：①被災自治体における廃棄物処理施設の非常時稼働・能力外受入に係る廃棄物処理法の特例（許可不要での廃棄物受入）②がれき類（建設廃棄物）の広域処理に係る手続きの簡略化③産業廃棄物と一般廃棄物の混合廃棄物の処理方針④感染性廃棄物（遺体関連廃棄物）の緊急処理指針⑤石綿含有廃棄物の飛散防止対策の徹底。各都道府県・政令市への協力要請と国による支援方針の明示。
    keywords: ["東日本大震災", "災害廃棄物", "特例措置", "がれき広域処理", "廃棄物処理法特例", "感染性廃棄物緊急処理"]

  - id: "moe_h24_industrial_types"
    article: "環廃産発第120419009号"
    title: "産業廃棄物の種類の判断に係る疑義事例の整理について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成24年4月19日"
    content: |
      産業廃棄物20種類の判断に係る主要な疑義事例を整理した通知。主な判断事例：
      ①汚泥：下水汚泥・浄水場汚泥・建設汚泥・食品製造排水汚泥・研磨汚泥等いずれも「汚泥」に該当
      ②廃油：切削油・洗浄油・食品廃油・潤滑油等。不純物を含む廃食用油の判断基準
      ③木くず：建設工事由来（型枠・足場材等）・木製品製造廃材・梱包材。「紙くず」との区別
      ④繊維くず：天然繊維のみ（合成繊維は廃プラスチック類）
      ⑤動植物性残さ：食品製造業・医薬品製造業・香料製造業等からの事業系廃棄物
      ⑥ばいじん：焼却炉・ボイラー等の集じん装置で集められたものに限定される
      ⑦がれき類：工作物の解体・改築時のコンクリート片等。道路工事由来のアスファルト塊も含む
    keywords: ["産業廃棄物種類判断", "疑義事例", "汚泥の種類", "木くず", "繊維くず", "ばいじん", "がれき類", "動植物性残さ"]

  - id: "moe_h26_pcb_storage"
    article: "環廃産発第140331012号"
    title: "ポリ塩化ビフェニル廃棄物の保管状況の把握及び指導について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成26年3月31日"
    content: |
      PCB廃棄物の保管状況の把握・指導に関する通知。PCB廃棄物処理特別措置法に基づく年度届出（毎年6月末）の状況確認と未届者への指導方針。保管状況の実地確認（立入検査）の実施方針。PCB廃棄物の処分完了期限（高濃度PCB：令和3〜9年度、低濃度PCB：令和9年3月31日）に向けた計画的処分の促進。JESCO（日本環境安全事業株式会社）各事業所への搬入手続きの案内。期限内処分の達成困難な事業者への対応（措置命令の発動）。
    keywords: ["PCB廃棄物保管状況把握", "年度届出", "JESCO搬入", "処分期限", "措置命令", "立入検査"]

  - id: "moe_h27_recycle_designation"
    article: "環廃産発第150331001号"
    title: "廃棄物の再生利用に係る一般的な判断基準について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成27年3月31日"
    content: |
      廃棄物を再生利用する場合の廃棄物処理法上の位置づけに関する通知。廃棄物を再生利用して得られた物（再生品）の廃棄物該当性の判断基準。再生利用を目的とした廃棄物の保管・運搬の取扱い（廃棄物処理業の許可が必要かどうか）。廃棄物処理法第9条の2（一般廃棄物の広域再生利用）・第15条の4の2（産業廃棄物の広域再生利用）に基づく再生利用指定制度の解説。廃棄物から製造されたセメント・肥料・燃料（RPF等）の廃棄物非該当性の判断基準。
    keywords: ["廃棄物再生利用", "再生品廃棄物該当性", "広域再生利用指定", "RPF", "廃棄物から製品", "セメント原料化"]

  - id: "moe_h28_facility_maintenance"
    article: "環廃産発第160331001号"
    title: "産業廃棄物処理施設の維持管理に関する技術上の基準及び記録・閲覧制度の運用について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成28年3月31日"
    content: |
      産業廃棄物処理施設の維持管理に関する技術上の基準（廃棄物処理法施行規則）の解釈通知。焼却施設・最終処分場・中間処理施設の各施設種別の維持管理基準の詳細解説。維持管理記録の記載事項・記録頻度・保存期間（5年）。維持管理情報の閲覧制度：記録を施設敷地内の見やすい場所に掲示し、一般の閲覧に供すること。インターネットによる維持管理情報公表の推奨。施設の検査・測定（大気・水質・騒音等）の実施頻度・方法の解説。
    keywords: ["維持管理技術基準", "維持管理記録閲覧", "焼却施設維持管理", "最終処分場維持管理", "5年保存", "情報公表"]

  - id: "moe_h29_asbestos_revised"
    article: "環循適発第170406001号"
    title: "石綿含有廃棄物等処理マニュアル（第2版）について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成29年4月6日"
    content: |
      石綿含有廃棄物等処理マニュアルの第2版（改訂版）。主な改訂内容：①石綿含有建材の判別方法の最新化（現行のJIS・規格との整合）②廃石綿等と石綿含有廃棄物の区分の明確化（飛散性の判断基準）③石綿含有廃棄物の処分先（溶融施設・管理型最終処分場）の選定方法④石綿含有廃棄物の梱包・ラベル表示の基準⑤解体工事における石綿飛散防止対策の徹底（大気汚染防止法との連携）⑥石綿を含む産業廃棄物の収集運搬業・処分業の許可区分の整理。
    keywords: ["石綿含有廃棄物処理マニュアル第2版", "飛散性判断基準", "石綿含有建材判別", "溶融施設", "梱包ラベル表示", "大気汚染防止法連携"]

  - id: "moe_h30_mercury_products"
    article: "環循適発第180330001号"
    title: "水銀廃棄物ガイドライン（第2版）について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成30年3月30日"
    content: |
      水銀に関する水俣条約及び廃棄物処理法に基づく水銀廃棄物の適正処理ガイドライン（第2版）。水銀廃棄物の種類：廃水銀等（特別管理産業廃棄物）・水銀使用製品廃棄物（蛍光灯・乾電池・温度計等）・水銀含有廃棄物（汚泥等）。各種類の処理方法の詳細：廃水銀等は硫化処理後に遮断型処分場で埋立、蛍光灯等の水銀使用製品はリサイクル施設での回収・再生処理。事業者と一般家庭での排出区分の違い（産業廃棄物か一般廃棄物か）の判断基準。
    keywords: ["水銀廃棄物ガイドライン", "水俣条約", "廃水銀", "蛍光灯廃棄処理", "水銀使用製品廃棄物", "硫化処理", "水銀リサイクル"]

  - id: "moe_r1_disaster"
    article: "環循適発第190913001号"
    title: "令和元年台風・豪雨に係る災害廃棄物の処理について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和元年9月13日"
    content: |
      令和元年台風15号・19号等に伴う災害廃棄物の処理に関する緊急通知。主な内容：①災害廃棄物（災害等廃棄物処理事業）の適用手続き（環境省への申請・補助金）②産業廃棄物と一般廃棄物の混合廃棄物の処理方針（一般廃棄物として処理可能とする特例の確認）③がれき類・廃家電等の種類別処理フロー④石綿含有廃棄物の飛散防止措置の徹底⑤仮置き場の設置・管理基準（浸出水対策・悪臭対策）。長野県含む被災都県への処理支援体制。
    keywords: ["令和元年台風災害廃棄物", "災害廃棄物処理", "がれき", "仮置き場", "廃棄物処理法特例", "石綿飛散防止", "長野県被災"]

  - id: "moe_r2_covid_waste"
    article: "環循適発第200320001号"
    title: "新型コロナウイルス感染症に係る廃棄物の処理について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和2年3月20日"
    content: |
      新型コロナウイルス感染症（COVID-19）に係る廃棄物の適正処理について。主な内容：①一般廃棄物としての家庭からのマスク・ティッシュ等の処理（通常の可燃ごみとして処理可能）②感染症患者由来の廃棄物（医療機関から排出される感染性廃棄物）の処理：廃棄物処理法の特別管理廃棄物（感染性廃棄物）の規定に基づき処理③隔離施設・ホテル等での廃棄物の処理方針④PCR検査廃棄物の取扱い（廃試薬・廃検体等の感染性廃棄物としての処理）。処理業者・収集作業員の感染防止対策の徹底指示。
    keywords: ["新型コロナウイルス", "感染症廃棄物", "マスク廃棄", "PCR検査廃棄物", "感染性廃棄物COVID", "感染防止対策"]

  - id: "moe_r2_reform_export"
    article: "環循適発第200331001号"
    title: "廃棄物の処理及び清掃に関する法律の改正（廃棄物の輸出規制強化）について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和2年3月31日"
    content: |
      廃棄物の輸出規制に係る廃棄物処理法改正（令和2年）の施行通知。主な改正内容：①廃棄物の輸出に関する確認制度の厳格化（環境大臣の確認に加え、処分国の同意要件の明確化）②不正な廃棄物輸出（リサイクル名目での廃棄物輸出）の取締り強化③廃プラスチック類の輸出に関するバーゼル条約改正（平成31年）への対応（廃プラスチックの輸出に際して相手国の同意を必要とする規制の追加）④廃棄物の国内循環処理の促進。
    keywords: ["廃棄物輸出規制強化", "廃プラスチック輸出", "バーゼル条約改正", "輸出確認制度", "廃棄物輸出規制令和2年"]

  - id: "moe_r3_reform_asbestos"
    article: "環循適発第210331001号"
    title: "大気汚染防止法の改正（石綿に係る規制強化）と廃棄物処理法上の留意事項について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和3年3月31日"
    content: |
      令和3年大気汚染防止法改正（石綿規制強化）に係る廃棄物処理法上の留意事項。主な内容：①解体等工事における石綿含有の事前調査義務の拡大（全解体工事・大規模修繕工事での義務化）②事前調査結果の都道府県知事への届出義務の新設（解体工事の場合）③事前調査を行う者の資格要件の整備（石綿調査者資格制度の創設）④廃石綿等（飛散性）の処理に関する廃棄物処理法との連携⑤石綿含有廃棄物の発生量・処理状況の報告体制の整備。廃棄物対策担当部局と大気環境担当部局の連携強化。
    keywords: ["令和3年大気汚染防止法改正", "石綿事前調査義務", "石綿調査者資格", "事前調査届出義務", "廃石綿処理連携"]

  - id: "moe_r3_reform_waste"
    article: "環循適発第210401001号"
    title: "廃棄物の処理及び清掃に関する法律の一部改正（令和3年改正・プラスチック関連）について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和3年4月1日"
    content: |
      令和3年廃棄物処理法改正の施行通知。主な改正内容：①プラスチック資源循環促進法（令和3年制定）の制定に伴う廃プラスチック類の処理に係る規定の整備②産業廃棄物の積替え保管（収集運搬業者の保管施設）に関する基準の強化③廃棄物処理施設の廃止後の残留汚染に係る土地の形質変更の届出制度の整備（廃棄物処理施設を廃止した土地での掘削工事等に際しての届出）④多量排出事業者の産業廃棄物処理計画の内容充実（再生利用率の目標設定等）。
    keywords: ["令和3年廃棄物処理法改正", "プラスチック資源循環", "廃プラスチック", "積替え保管基準強化", "施設廃止後残留汚染", "多量排出事業者処理計画"]

  - id: "moe_r4_reform"
    article: "環循適発第220401001号"
    title: "廃棄物の処理及び清掃に関する法律の一部改正（令和4年）について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和4年4月1日"
    content: |
      令和4年廃棄物処理法改正の施行通知。主な改正内容：①産業廃棄物の種類の政令改正（廃棄物の範囲の明確化）②廃棄物処理業の許可申請書類の電子化（オンライン申請の整備）③廃棄物処理施設の維持管理情報のデジタル化促進④廃棄物処理法上の「みなし許可」（更新申請中の許可期間延長）の取扱いの明確化⑤廃棄物の広域処理に係る認定制度（広域認定）の運用改善。
    keywords: ["令和4年廃棄物処理法改正", "廃棄物処理業許可電子化", "オンライン申請", "みなし許可明確化", "広域認定制度改善"]

  - id: "moe_r5_plastics"
    article: "環循適発第230331001号"
    title: "プラスチックに係る資源循環の促進等に関する法律の施行と産業廃棄物処理の関係について"
    issued_by: "環境省環境再生・資源循環局"
    issued_date: "令和5年3月31日"
    content: |
      プラスチック資源循環促進法（令和3年制定、令和4年4月施行）と廃棄物処理法の関係を整理した通知。主な内容：①特定プラスチック使用製品（フォーク・スプーン・マドラー等12品目）の提供削減義務②プラスチック廃棄物の分別収集・自主回収・再生利用の促進③事業者によるプラスチック廃棄物の自主回収・再生利用に係る認定制度④廃プラスチック類（産業廃棄物）の再生処理業の実態と適正処理の徹底⑤廃棄物処理法のマニフェスト義務とプラスチック資源循環法の関係整理。
    keywords: ["プラスチック資源循環法", "廃プラスチック類再生利用", "特定プラスチック使用製品", "自主回収認定制度", "マニフェスト適用関係"]

  - id: "moe_koiki_nintei"
    article: "環廃産発第140331008号"
    title: "廃棄物の処理及び清掃に関する法律に基づく広域認定制度の運用について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推진課"
    issued_date: "平成26年3月31日（最終改定）"
    content: |
      廃棄物処理法第9条の9（一般廃棄物）・第15条の4の3（産業廃棄物）に基づく広域認定制度の運用指針。広域認定制度は、製品の製造・加工・販売等を行う者が、自ら製造等した製品が廃棄物となったものを広域的に収集運搬・処分する場合に、都道府県知事の個別許可を受けずに環境大臣の認定を受けることで処理できる制度。認定対象となる廃棄物：自動車・家電等の製品廃棄物、感熱紙・インクリボン等の特定の廃棄物。認定申請書類・認定基準・認定期間（5年）・認定の更新・変更に係る手続きの詳細。
    keywords: ["広域認定制度", "環境大臣認定", "製造業者廃棄物広域処理", "都道府県許可不要", "製品廃棄物", "認定申請"]

  - id: "moe_saisho_shobun"
    article: "環廃産発第040331031号"
    title: "産業廃棄物の最終処分に係る廃棄物処理法上の規制と指導方針について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成16年3月31日"
    content: |
      産業廃棄物の最終処分（埋立処分）に関する法令解釈と指導方針。主な内容：①安定型処分場・管理型処分場・遮断型処分場の判別基準と設計要件②展開検査（安定型処分場への搬入廃棄物の展開・目視確認）の実施方法・記録方法③最終処分場の浸出水水質検査（測定頻度・項目・基準値）④最終処分場の廃止基準（安定化の確認・浸出水水質基準の達成）⑤廃止後の土地の形質変更の制限と都道府県への届出⑥維持管理積立金制度（処分業者が廃止後の維持管理費用を積み立てる義務）。
    keywords: ["最終処分規制", "展開検査", "安定型処分場管理", "浸出水水質検査", "廃止基準", "維持管理積立金", "廃止後管理"]

  - id: "moe_technical_manager"
    article: "環廃産発第030331021号"
    title: "廃棄物処理施設技術管理者の資格に係る講習会について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成15年3月31日"
    content: |
      廃棄物処理施設の技術管理者（廃棄物処理法第21条に基づく設置義務）の資格要件と講習会に関する通知。技術管理者の資格：①廃棄物処理施設技術管理者資格認定講習会修了者（一般財団法人日本環境衛生センターが実施）②技術士（衛生工学・化学等の部門）③大学の工学・理学・農学等の課程を修めた者で一定の実務経験を有するもの。講習会の種類：施設の種類（焼却・最終処分場・汚泥再生処理・その他中間処理）に応じた講習会の修了が必要。技術管理者の職務（施設の維持管理・記録・報告等）の解説。
    keywords: ["廃棄物処理施設技術管理者", "技術管理者資格", "技術管理者講習会", "日本環境衛生センター", "焼却施設技術管理", "最終処分場技術管理"]
