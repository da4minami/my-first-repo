title: "産業廃棄物行政に係る環境省通知集（第2集）"
category: "国通知"
sections:
  - id: "moe_stable_type_qa"
    article: "環廃産発通知（安定型処分場）"
    title: "安定型最終処分場に係る廃棄物の種類の判断について（Q&A）"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "随時更新"
    content: |
      Q: 廃プラスチック類が汚水に汚染されている場合でも安定型処分場に埋立できるか？
      A: 安定型処分場への埋立ができるのは「安定型産業廃棄物」のみ（廃プラスチック類、ゴムくず、金属くず、ガラスくず・コンクリートくず・陶磁器くず、がれき類）であるが、これらが有害物質や有機物等に汚染されている場合は安定型処分場への搬入は認められない。展開検査により汚染の有無を確認する必要がある。

      Q: 安定型処分場とは別に、安定型産業廃棄物を管理型処分場に埋立てることはできるか？
      A: 安定型産業廃棄物を管理型最終処分場に埋立てることは可能である。ただし、管理型処分場の許可条件を満たす必要がある。

      Q: 廃スプリングマットレス（金属くず＋繊維くず）の最終処分場の種類は？
      A: 廃スプリングマットレスは安定型産業廃棄物（金属くず）と管理型産業廃棄物（繊維くず）の混合物であるため、そのまま安定型処分場への搬入はできない。分別するか、管理型処分場での処理が必要。
    keywords: ["安定型処分場Q&A", "展開検査", "汚染廃棄物", "安定型産業廃棄物の判断"]

  - id: "moe_waste_judgment"
    article: "環廃産発第110204005号"
    title: "廃棄物の該当性の判断について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成23年"
    content: |
      廃棄物に該当するかどうかの判断基準を示した通知。廃棄物の該当性は客観的に判断されるものであり、不要物性（当該物の占有者が自ら利用し、又は他人に有償で売却することができないために不要となった物）が基準となる。有価物（専ら資源として有価で取引される物）は廃棄物に該当しない。しかし、名目的に有価物とされていても実態が廃棄物の場合は廃棄物処理法が適用される。「専ら物」（専ら資源として有価で取引される古紙・くず鉄・空き缶・くず繊維）については許可不要となる場合がある。
    keywords: ["廃棄物の該当性", "不要物性", "有価物", "専ら物", "無許可業者", "古紙・くず鉄"]

  - id: "moe_industrial_waste_types"
    article: "環廃産発第120419009号"
    title: "産業廃棄物の種類の判断に関する通知"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成24年"
    content: |
      産業廃棄物の種類の判断に係る疑義事例を整理した通知。主な事例：
      ・下水汚泥は下水道事業から生じる汚泥として産業廃棄物に該当する
      ・建設工事から生じた木くず（型枠廃材、木製梱包材等）は産業廃棄物の木くずに該当する
      ・食品製造業から生じた食品廃棄物は動植物性残さとして産業廃棄物に該当する（ただし事業規模による）
      ・複合廃棄物（複数の廃棄物が混合したもの）の種類の判断は主たる性状による
      ・建設汚泥（掘削工事から生じた汚泥）は産業廃棄物の汚泥に該当する
    keywords: ["産業廃棄物の種類判断", "下水汚泥", "建設木くず", "動植物性残さ", "建設汚泥", "複合廃棄物"]

  - id: "moe_manifest_electronic"
    article: "環廃産発第190329005号"
    title: "電子マニフェスト制度の運用について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和元年"
    content: |
      電子マニフェスト（JWNET：公益財団法人日本産業廃棄物処理振興センターが運営）の運用に関する通知。電子マニフェスト義務化対象：特別管理産業廃棄物を排出する事業者であって、前年度の特別管理産業廃棄物の排出量が50トン以上のもの。電子マニフェストでは、①登録（運搬開始時）②終了報告（運搬終了・処分終了時）の二段階で情報入力を行う。紙マニフェストと同様に、処分終了報告が90日（最終処分の場合は180日）以内にされない場合は都道府県知事へ報告義務が生じる。
    keywords: ["電子マニフェスト運用", "JWNET", "50トン", "義務化対象", "登録手順", "90日180日報告"]

  - id: "moe_illegal_dumping_countermeasure"
    article: "環廃産発第210329号"
    title: "産業廃棄物の不法投棄等の未然防止・早期発見・早期対応について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和3年"
    content: |
      不法投棄の未然防止と早期対応のための行政の取組指針。主な内容：
      ①排出事業者へのマニフェスト制度の適正運用指導（写しの確認、返送期限管理）
      ②許可業者の実地確認・立入検査の実施
      ③無許可業者の廃棄物引き受け事案の早期発見（インターネット広告等の監視）
      ④不法投棄発見時の対応手順（原因者特定→措置命令→代執行）
      ⑤都道府県・市町村・警察・環境省の連携体制の強化
    keywords: ["不法投棄未然防止", "立入検査", "無許可業者監視", "代執行", "連携体制", "インターネット監視"]

  - id: "moe_preferential_treatment"
    article: "環廃産発第110204004号"
    title: "廃棄物処理法に基づく優良産廃処理業者認定制度について"
    issued_by: "環境省"
    issued_date: "平成23年"
    content: |
      優良産廃処理業者認定制度（エコアクション21との連携も含む）の創設に関する通知。認定基準は、①遵法性（直近3年間に廃棄物処理法の規定に違反していない）②情報公開（経理状況・処理実績等をウェブサイトで公開）③環境配慮の取組（ISOや独自の環境保全指針等）④電子マニフェストの使用（特別管理産業廃棄物収集運搬業者は必須）⑤財務体質の健全性。認定業者は許可の有効期間が5年から7年に延長される優遇措置がある。
    keywords: ["優良産廃処理業者認定", "認定基準", "情報公開", "電子マニフェスト", "許可期間7年"]

  - id: "moe_flow_charted_storage"
    article: "環廃産発第140331009号"
    title: "産業廃棄物の保管に係る技術上の基準の解釈について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成26年"
    content: |
      産業廃棄物の保管基準（廃棄物処理法施行令第3条・施行規則第1条の2）の技術的解釈。主な内容：
      ①掲示板の記載事項（保管する産業廃棄物の種類、最大保管量、排出事業者の氏名・名称・連絡先等）
      ②囲いの設置（高さ制限：囲いの高さに応じた積み上げ量の上限）
      ③汚水処理（汚水が生ずるおそれのある廃棄物の保管には底面を不透水性材料で覆う等）
      ④飛散・流出防止措置（覆い・飛散防止ネット等の設置）
      保管上限量の計算方法：収集運搬車両1台分×14日分が上限（産廃収集運搬業者の積替え保管施設の場合）。
    keywords: ["保管基準解釈", "掲示板記載事項", "囲い高さ", "汚水防止", "飛散防止", "保管上限量"]

  - id: "moe_medical_waste"
    article: "環循適発第170323001号"
    title: "感染性廃棄物処理マニュアルの改定について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成29年"
    content: |
      感染性廃棄物処理マニュアル（改定版）の主な内容：
      ①感染性廃棄物の定義：医療機関等から生じた廃棄物のうち、感染性病原体が含まれ、若しくは付着しているおそれのある廃棄物（血液・体液付着物、鋭利なもの、病理廃棄物、培養等廃棄物等）
      ②処理フロー：感染性産業廃棄物として特別管理産業廃棄物管理責任者を置き、密封容器（バイオハザードマーク表示）に収納→特別管理産業廃棄物収集運搬業者へ委託→特別管理産業廃棄物処分業者による処分（焼却又は高圧蒸気滅菌等）
      ③小規模診療所等の特例：同じ市区町村内の医療機関間での廃棄物の一元管理が認められる場合がある
      ④在宅医療廃棄物の取扱い：患者が在宅で使用した注射針等は一般廃棄物として処理する（ただし市町村によって異なる場合がある）
    keywords: ["感染性廃棄物マニュアル", "バイオハザードマーク", "密封容器", "管理責任者", "在宅医療廃棄物", "小規模診療所"]
