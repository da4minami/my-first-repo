title: "産業廃棄物行政に係る横断的テーマ別環境省通知集"
category: "国通知"
sections:
  - id: "moe_cross_subcontracting"
    article: "環廃産発第040120002号"
    title: "建設工事の下請業者による産業廃棄物収集運搬の取扱いについて"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成16年1月20日"
    content: |
      建設工事において下請業者が産業廃棄物を運搬する場合の廃棄物処理法上の取扱い。
      【排出事業者の特定】建設工事から生じる産業廃棄物の排出事業者は「元請業者」である（発注者・下請業者ではない）。廃棄物処理法第21条の3の規定による。下請業者は「元請業者から委託を受けた廃棄物処理業者」と位置付けられる。
      【下請業者が廃棄物を運搬する場合】元請業者は、廃棄物を運搬する下請業者が産業廃棄物収集運搬業の許可を有することを確認しなければならない。下請業者が許可を持たずに廃棄物を運搬することは廃棄物処理法違反（無許可営業）となり、元請業者も委託基準違反となる。
      【マニフェストの交付】元請業者が排出事業者としてマニフェストを交付する義務を負う。下請業者に交付させることは不可。
      【現場内の移動】工事現場内での廃棄物の移動（同一敷地内）は収集運搬に該当しないため許可不要。ただし、現場外への持出しには許可が必要。
    keywords: ["建設工事下請業者廃棄物運搬", "元請業者排出事業者", "廃棄物処理法第21条の3", "下請業者収集運搬許可", "マニフェスト交付義務元請", "現場内移動許可不要"]

  - id: "moe_cross_self_processing"
    article: "環廃産発第040120003号"
    title: "事業者が自ら産業廃棄物を運搬・処分する場合の廃棄物処理業許可の要否について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成16年1月20日"
    content: |
      排出事業者が自ら産業廃棄物を運搬・処分する場合（自己処理）の廃棄物処理業の許可の要否に関する通知。
      【自社運搬（許可不要）の要件】①自ら発生させた廃棄物であること②自社の車両を使用すること③廃棄物を他者に引き渡す（売却・処分委託）ことを目的としないこと。
      【グループ会社間の廃棄物移動】親会社・子会社等グループ会社間での廃棄物の移動は「他者への委託」に該当し、収集運搬業の許可が必要となる場合がある（例外：完全子会社等で実質的に同一の事業者と見なせる場合の扱い）。
      【自社処理施設】自社で発生した廃棄物のみを処理する施設（自社処理施設）は、廃棄物処理業の許可は不要だが、処理施設の設置許可（廃棄物処理法第15条）は必要となる場合がある。
      【混在の問題】複数の取引先の廃棄物を混載して運搬する場合は収集運搬業の許可が必要。
    keywords: ["自社運搬許可不要要件", "自己処理廃棄物", "グループ会社廃棄物移動", "自社処理施設許可", "廃棄物混載収集運搬許可", "排出事業者自己処理"]

  - id: "moe_cross_joint_venture"
    article: "環廃産発第050131001号"
    title: "共同企業体（JV）等が排出する産業廃棄物の取扱いについて"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成17年1月31日"
    content: |
      共同企業体（ジョイントベンチャー・JV）や特定目的会社（SPC）が建設工事を施工する場合の産業廃棄物の排出事業者の特定方法。共同企業体全体が排出事業者となる（代表企業が排出事業者を代表して手続きを行うことが認められる）。マニフェストの排出事業者名はJVの名称を記載することが可能。JVが解散した後の廃棄物処理責任は構成各社が連帯して負う。不法投棄等が生じた場合の各構成員の責任の分担。廃棄物処理委託契約の締結方法（JVと処理業者の間で締結する場合の記載方法）。
    keywords: ["共同企業体JV廃棄物処理", "JV排出事業者", "マニフェストJV名称", "JV解散後廃棄物責任", "構成員連帯責任", "特定目的会社SPC廃棄物"]

  - id: "moe_cross_npo_nonprofit"
    article: "環廃産発第060228002号"
    title: "NPO法人等による廃棄物の回収・リサイクル活動と廃棄物処理業許可について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成18年2月28日"
    content: |
      NPO法人・ボランティア団体等による廃棄物の回収・リサイクル活動に係る廃棄物処理業許可の要否に関する通知。非営利活動であっても廃棄物の収集・運搬を「業として」行う場合は廃棄物処理業の許可が必要。「業として」の判断基準：反復継続性・社会性（不特定多数から回収等）があれば許可が必要。ただし、地域住民が自発的に参加するクリーン活動（ボランティア清掃）等は「業として」に該当しない場合がある。リサイクル活動（古紙・古着・廃家電等の回収）が廃棄物処理法の適用を受ける場合の許可取得指導。有価物（古紙等）の回収活動は廃棄物処理法が適用されない（廃棄物に非該当）。
    keywords: ["NPO法人廃棄物処理許可", "ボランティア廃棄物回収", "業として許可必要", "反復継続性社会性", "地域清掃活動許可不要", "古紙回収廃棄物非該当"]

  - id: "moe_cross_overseas"
    article: "環廃産発第120301001号"
    title: "海外から輸入された廃棄物の国内処理に係る廃棄物処理法の適用について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成24年3月1日"
    content: |
      外国から日本に輸入された廃棄物の国内での処理に係る廃棄物処理法の適用関係。外国から輸入された廃棄物も日本国内では廃棄物処理法が適用される。バーゼル条約・バーゼル法に基づく廃棄物輸入規制との関係（特定有害廃棄物等の輸入には環境大臣・経済産業大臣の確認が必要）。輸入廃棄物の通関・保税区域での一時保管に係る廃棄物処理法の適用（保税区域内にある間は廃棄物処理法の適用はない場合もある）。輸入廃棄物の処分に係る廃棄物処理業の許可（国内廃棄物と同様に処分業の許可が必要）。外国籍船舶から陸揚げされた廃棄物の取扱い（船舶起源の廃棄物）。
    keywords: ["輸入廃棄物廃棄物処理法適用", "バーゼル法廃棄物輸入", "保税区域廃棄物", "外国廃棄物国内処理", "輸入廃棄物処分業許可", "船舶廃棄物"]

  - id: "moe_cross_digital_transformation"
    article: "環循適発第230328001号"
    title: "廃棄物処理に係る各種申請・届出のデジタル化（電子申請）の促進について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和5年3月28日"
    content: |
      廃棄物処理法に基づく許可申請・各種届出・報告のデジタル化（電子申請・オンライン手続き）の促進に関する通知。デジタル手続き法（情報通信技術を活用した行政の推進等に関する法律）に基づく電子申請の整備状況と活用促進。電子申請が可能な手続き：許可申請・変更届出・廃業届出・多量排出事業者の処理計画・維持管理情報の公表等。添付書類の電子化（PDF・JPEGでの添付）。電子マニフェスト（JWNET）との連携。電子申請手続きを提供する都道府県・政令市の状況と今後の整備計画。行政のDX（デジタルトランスフォーメーション）と廃棄物行政の効率化。
    keywords: ["廃棄物処理電子申請", "デジタル化手続き", "オンライン申請廃棄物", "廃棄物処理DX", "JWNET連携", "許可申請電子化", "廃棄物行政デジタルトランスフォーメーション"]

  - id: "moe_cross_contract_standard"
    article: "環廃産発第120119001号"
    title: "産業廃棄物の処理委託に係る標準契約書について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成24年1月19日"
    content: |
      産業廃棄物の処理委託契約書の標準様式と記載事項の解説。廃棄物処理法施行規則第8条の4の規定に基づく委託契約書の法定記載事項：①委託する廃棄物の種類・数量②収集運搬業者の場合：運搬先（処分先）の住所・名称・許可番号③処分業者の場合：処分方法・処分先（最終処分先含む）④委託料金⑤有効期間⑥契約不適合（廃棄物の性状等と実際が異なる場合の対処）。標準契約書の活用推奨（廃棄物処理委託に係る三者間契約・二者間契約の様式例）。契約書の保存義務（終了後5年間）。電子契約（電子署名）による委託契約の有効性の確認。
    keywords: ["産業廃棄物委託契約標準様式", "委託契約書法定記載事項", "三者間契約二者間契約", "委託料金記載", "最終処分先記載義務", "委託契約書5年保存", "電子契約廃棄物"]

  - id: "moe_cross_environment_assessment"
    article: "環廃産発第030331004号"
    title: "産業廃棄物処理施設の設置許可に係る生活環境影響調査の内容について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成15年3月31日"
    content: |
      廃棄物処理法第15条の2の2に規定する生活環境影響調査（廃棄物処理施設の設置許可申請時に義務付けられる環境調査）の実施方法の詳細。生活環境影響調査の対象施設：焼却施設（廃棄物処理能力3トン/日以上）・最終処分場（面積1,000㎡以上）・その他政令で定める施設。調査項目：大気質（臭気含む）・騒音・振動・水質（地下水含む）・土壌・その他。調査方法：既存資料調査・現地調査（気象・水文・地形・地質等）・予測・評価の順序。調査書の作成方法・記載事項。審査時の技術的審査方法・住民意見の反映。調査書の縦覧方法（申請書と同時に縦覧）。
    keywords: ["生活環境影響調査方法", "廃棄物処理施設設置許可", "3トン日以上焼却施設", "調査項目大気騒音振動水質", "現地調査方法", "調査書縦覧", "住民意見反映"]
