title: "産業廃棄物行政に係る業種別環境省通知集"
category: "国通知"
sections:
  - id: "moe_industry_medical"
    article: "環循適発第200330001号"
    title: "医療関係機関等から排出される感染性廃棄物処理マニュアル（令和2年版）"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和2年3月30日"
    content: |
      医療機関等から発生する感染性廃棄物の処理マニュアルの最新版（令和2年版）。
      【感染性廃棄物の定義・判定基準】形状基準（鋭利なもの：注射針・メス・ガラス器具等）・性状基準（血液等が付着・感染力のある病原体を含む可能性）・排出場所基準（感染症病床・ICU・手術室等の特定施設から排出）のいずれかに該当するもの。
      【非感染性廃棄物との区別】紙おむつ・包帯・ガーゼ等で感染性病原体が付着していないと判断できるものは感染性廃棄物に非該当。ただし判断が困難な場合は感染性廃棄物として処理。
      【処理フロー】専用容器（硬質容器・プラスチック袋の二重梱包）へ収納→バイオハザードマーク表示→施設内一時保管→特別管理産業廃棄物収集運搬業者への引渡し→特別管理産業廃棄物処分業者による処分（高温焼却・高圧蒸気滅菌後処分等）。
      【特別管理産業廃棄物管理責任者】医療機関では医師・看護師等の医療系資格者が資格要件を充足。
      【在宅医療廃棄物】患者が自宅で使用した注射針等は一般廃棄物として処理（市町村の定める方法による）。透析患者の自己注射針の処理に関する通知との関係。
    keywords: ["感染性廃棄物処理マニュアル令和2年版", "感染性廃棄物判定基準", "形状基準性状基準排出場所基準", "バイオハザードマーク表示", "医療機関廃棄物処理", "在宅医療廃棄物", "二重梱包"]

  - id: "moe_industry_dialysis"
    article: "環循適発第180401001号"
    title: "在宅医療廃棄物（自己注射針等）の処理に係る市町村の対応について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成30年4月1日"
    content: |
      在宅医療（自己注射・在宅輸液・在宅透析等）で発生する廃棄物（使用済み注射針・注射筒・輸液バッグ・カテーテル等）の処理に関する通知。在宅医療廃棄物は一般廃棄物として市町村が処理する（医療機関外で発生するため産業廃棄物に非該当）。市町村は在宅医療廃棄物の適切な回収・処理方法を定める必要がある（市町村の処理基準の整備）。使用済み注射針の安全な処理方法（専用廃棄容器の配布・薬局・医療機関での回収協力体制の構築）。医療機関から患者宅に持ち帰った場合の処理区分（医療機関が引き取る場合は医療廃棄物として処理、市町村回収の場合は一般廃棄物）。
    keywords: ["在宅医療廃棄物", "自己注射針処理", "使用済み注射針一般廃棄物", "市町村処理責任", "在宅透析廃棄物", "薬局回収", "医療機関引取り"]

  - id: "moe_industry_food_processing"
    article: "環廃産発第050331001号"
    title: "食品廃棄物等の処理に係る廃棄物処理法の適用について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成17年3月31日"
    content: |
      食品製造業・飲食業等から発生する食品廃棄物（動植物性残さ）の廃棄物処理法上の取扱い。食品製造業（食品加工場）から発生する食品残さ・廃液等は産業廃棄物（動植物性残さ・汚泥等）に該当。小規模飲食業（居酒屋・食堂等）から発生する食品廃棄物：原則として産業廃棄物（動植物性残さ）だが、廃油（揚げ油の残さ）も含まれる。食品廃棄物の肥料化・飼料化等のリサイクル：食品リサイクル法との関係（廃棄物処理法の処理委託と食品リサイクル法の再生利用義務の両立）。廃食用油の有価売却（バイオディーゼル燃料原料等）：有価物として廃棄物に該当しない場合がある。食品廃棄物の不正転売事件（廃棄品の横流し）への対策（廃棄証明・マニフェスト確認等）。
    keywords: ["食品廃棄物産業廃棄物", "動植物性残さ", "食品製造業廃棄物", "廃食用油有価物", "食品リサイクル法との関係", "廃棄品横流し対策", "廃棄証明"]

  - id: "moe_industry_agriculture"
    article: "環廃産発第030331010号"
    title: "農業系廃棄物の処理に係る廃棄物処理法の適用について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成15年3月31日"
    content: |
      農業（農家・農業法人等）から発生する廃棄物の廃棄物処理法上の取扱い。農業廃棄物の産業廃棄物・一般廃棄物の区分：農家（個人）が農業活動で排出する廃棄物→一般廃棄物として市町村が処理、農業法人（会社等）が農業活動で排出する廃棄物→産業廃棄物として廃棄物処理法が適用。農薬容器・農業用ビニール（廃プラスチック類）・廃農機（金属くず）等の処理。農業廃棄物の野外焼却（農業上やむを得ない焼却として認められる例外）の範囲と条件（廃棄物処理法第16条の2第1号）。畜産廃棄物（家畜のふん尿・動物の死体等）の廃棄物処理法上の取扱い（産業廃棄物の場合と家畜排せつ物法の関係）。
    keywords: ["農業廃棄物", "農家一般廃棄物", "農業法人産業廃棄物", "農薬容器廃棄", "農業用ビニール廃プラスチック", "農業上やむを得ない焼却", "畜産廃棄物", "家畜排せつ物法"]

  - id: "moe_industry_power_plant"
    article: "環廃産発第040928001号"
    title: "石炭火力発電所から発生する石炭灰の廃棄物処理法上の取扱いについて"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成16年9月28日"
    content: |
      石炭火力発電所から発生する石炭灰（フライアッシュ・クリンカーアッシュ・脱硫石こう等）の廃棄物処理法上の取扱い。石炭灰（燃え殻・ばいじん）は産業廃棄物（燃え殻・ばいじん）に該当。ただし、一定の品質基準（品質・有害物質溶出・放射線量等）を満たすものはセメント原料・路盤材・コンクリート混和材等として有価物として流通する（廃棄物に該当しない場合がある）。フライアッシュの有価物判断基準（JIS規格適合品等）。脱硫石こうは石こう製品の原料として有価取引される場合は廃棄物非該当。ばいじんは特別管理産業廃棄物に該当する場合がある（有害物質含有濃度による）。
    keywords: ["石炭灰廃棄物処理", "フライアッシュ廃棄物該当性", "燃え殻ばいじん産業廃棄物", "石炭灰セメント原料", "フライアッシュJIS規格", "脱硫石こう有価物", "特別管理産業廃棄物ばいじん"]

  - id: "moe_industry_chemical"
    article: "環廃産発第060228001号"
    title: "化学工業から排出される廃棄物の適正処理について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成18年2月28日"
    content: |
      化学工場・石油精製工場等から発生する廃棄物の処理に係る指導方針。廃酸・廃アルカリ（特別管理産業廃棄物）の保管基準（専用の密閉容器・耐食性材料・遮光措置等）。廃有機溶剤（廃プラスチック原料・廃油等）の特別管理産業廃棄物該当性の判断（有機ハロゲン化物を含む場合等）。廃触媒（白金族金属等を含む場合は有価物として有価売却可能）の廃棄物該当性。化学工場廃水（廃酸・廃アルカリ・汚泥等）の処理基準と排水基準（水質汚濁防止法との関係）。廃棄物の混合禁止（廃酸と廃アルカリの混合禁止・廃シアン化合物と酸の混合禁止等）。廃棄物処理法上の廃農薬・廃農薬原料の取扱い。
    keywords: ["化学工場廃棄物", "廃酸廃アルカリ保管基準", "廃有機溶剤特別管理産業廃棄物", "廃触媒有価物判断", "廃棄物混合禁止", "廃農薬処理", "有機ハロゲン化物"]

  - id: "moe_industry_semiconductor"
    article: "環廃産発第090202003号"
    title: "半導体・電子部品製造業から発生する廃棄物の適正処理について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成21年2月2日"
    content: |
      半導体・電子部品製造工場から発生する特殊な廃棄物の取扱いに関する通知。廃フッ酸（廃棄物処理法上の廃酸：pHによって特別管理産業廃棄物に該当する場合）の適正処理（中和処理後に廃アルカリ・汚泥として処理）。廃有機溶剤（フォトレジスト廃液・洗浄溶剤廃液等）の処理：廃棄物処理法上の廃油・廃酸・廃アルカリ等に区分して処理。重金属を含む廃棄物（廃ヒ素化合物・廃六価クロム含有廃棄物等）の特別管理産業廃棄物としての処理。廃基板（廃プリント基板）の有価物判断（金・銀・パラジウム等の有価金属含有量による判断）。半導体製造排水（超純水製造排水・エッチング排水等）の処理。
    keywords: ["半導体製造廃棄物", "廃フッ酸処理", "廃有機溶剤フォトレジスト", "廃ヒ素化合物", "廃プリント基板有価物", "金銀パラジウム回収", "超純水製造排水"]

  - id: "moe_industry_auto_manufacturing"
    article: "環廃産発第070331001号"
    title: "自動車製造業・自動車修理業から発生する廃棄物の適正処理について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成19年3月31日"
    content: |
      自動車製造工場・自動車整備工場から発生する廃棄物の適正処理に関する通知。廃塗料・廃シンナー（廃油・廃酸・廃アルカリ等）の取扱い：廃塗料は廃プラスチック類又は廃油に区分、廃シンナーは廃油（引火点未満の場合は特別管理産業廃棄物）に区分。廃バッテリー（廃鉛蓄電池）：産業廃棄物（廃酸と金属くず等の複合廃棄物）として適正処理。ただし有価物として有価売却される場合は廃棄物非該当。廃タイヤ：産業廃棄物（ゴムくず）として適正処理（廃タイヤの不法投棄防止）。廃潤滑油・廃エンジンオイル：廃油として処理、リサイクルの促進。廃フロン（カーエアコンのフロン冷媒）：フロン排出抑制法に基づく回収義務との関係。
    keywords: ["自動車製造廃棄物", "廃塗料廃シンナー", "廃バッテリー廃鉛蓄電池", "廃タイヤゴムくず", "廃潤滑油エンジンオイル", "廃フロン回収", "自動車整備廃棄物"]

  - id: "moe_industry_printing"
    article: "環廃産発第060131001号"
    title: "印刷業・写真業から発生する廃棄物（廃現像液等）の適正処理について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成18年1月31日"
    content: |
      印刷業・写真処理業（DPE店等）から発生する廃液の廃棄物処理法上の取扱い。廃現像液・廃定着液は廃棄物処理法上の廃アルカリ（現像液）・廃酸（定着液）又は廃油に区分。これらには銀が含まれる場合があり、銀含有量が高い場合は有価物として有価回収業者に有償売却できる場合がある（廃棄物非該当の可能性）。廃印刷インク・廃溶剤：廃油又は廃プラスチック類として処理。廃フィルム・廃印刷版：廃プラスチック類・金属くずとして処理。下水道への廃現像液・廃定着液の違法排水の防止（下水道法・水質汚濁防止法との関係）。デジタル化に伴う廃写真フィルム等の処理。
    keywords: ["廃現像液廃定着液", "廃アルカリ廃酸区分", "銀含有廃液有価物", "印刷業廃棄物", "廃インク廃溶剤", "廃フィルム廃プラスチック", "下水道違法排水防止"]

  - id: "moe_industry_hospital_bio"
    article: "環循適発第211101001号"
    title: "臨床研究機関・バイオ研究施設から排出される廃棄物の適正処理について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "令和3年11月1日"
    content: |
      大学・研究機関・バイオテクノロジー企業から排出される特殊な廃棄物の取扱い。遺伝子組換え生物を含む廃棄物：カルタヘナ法（遺伝子組換え生物等の使用等の規制による生物の多様性の確保に関する法律）に基づく滅菌処理後に感染性廃棄物として処理。動物実験廃棄物（実験動物の死体・組織等）：感染性産業廃棄物に準じた管理が必要な場合がある。廃試薬（有機溶剤・有害化学物質等）：廃油・廃酸・廃アルカリ・特別管理産業廃棄物等に区分して処理。廃試験管・廃注射器等の鋭利な物：感染性廃棄物の処理基準に準じた処理推奨。廃棄物処理業者と研究機関の連携（廃棄物の種類の適切な申告）。
    keywords: ["臨床研究廃棄物", "遺伝子組換え生物廃棄物", "カルタヘナ法", "動物実験廃棄物", "廃試薬処理", "研究機関廃棄物適正処理", "バイオテクノロジー廃棄物"]

  - id: "moe_industry_hotel_commercial"
    article: "環廃産発第050128001号"
    title: "ホテル・旅館業・興行場等から発生する廃棄物の適正処理について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成17年1月28日"
    content: |
      ホテル・旅館・興行場（劇場・遊園地等）・スーパーマーケット等から発生する廃棄物の廃棄物処理法上の取扱い。事業活動から発生する廃棄物は産業廃棄物に該当する（ただし廃棄物処理法第2条第4項第2号により、事務所・店舗から発生する廃棄物のうち廃プラスチック類・金属くず・ガラスくず等以外は一般廃棄物）。ホテル等から発生する主な産業廃棄物：廃プラスチック類（使用済みアメニティ包装等）・廃油（フライヤー廃油等）・金属くず・ガラスくず。主な一般廃棄物（市町村収集対象）：食品廃棄物・紙くず（量の少ないもの）・普通ゴミ。廃棄物の産廃・一廃区分の実務的判断。大規模ホテルの多量排出事業者該当可能性。
    keywords: ["ホテル旅館廃棄物", "商業施設廃棄物", "産業廃棄物一般廃棄物区分", "廃プラスチック類事務所", "廃油フライヤー", "廃棄物第2条4項2号", "大規模ホテル多量排出"]
