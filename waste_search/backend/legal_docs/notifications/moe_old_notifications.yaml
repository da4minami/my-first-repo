title: "産業廃棄物行政に係る旧厚生省・環境省通知集（昭和・平成初期）"
category: "国通知"
sections:
  - id: "moe_old_s46_kankyou14"
    article: "環整第14号"
    title: "廃棄物の処理及び清掃に関する法律の施行について"
    issued_by: "厚生省環境衛生局長"
    issued_date: "昭和46年10月16日"
    content: |
      廃棄物処理法（昭和46年10月施行）の施行にあたり、法の趣旨・構成・各規定の運用方針を示した最初の施行通知。産業廃棄物の種類・定義の解説、事業者の自己処理原則、都道府県の監督権限等を解説。特に「廃棄物」の概念を「占有者が自ら利用せず、かつ他人に有償で売却できないために不要となった物」と解釈する考え方を示した。この考え方は以後の廃棄物該当性の判断基準の基礎となっている。
    keywords: ["廃棄物処理法施行通知", "廃棄物の定義", "不要物性", "自己処理原則", "昭和46年施行"]

  - id: "moe_old_s46_eisankaku54"
    article: "衛産第54号"
    title: "産業廃棄物の処理基準等について"
    issued_by: "厚生省環境衛生局水道環境部長"
    issued_date: "昭和46年10月16日"
    content: |
      産業廃棄物の収集・運搬・処分の技術上の基準を解説した通知。保管基準（囲い・掲示板の設置）、収集運搬基準（飛散・流出・悪臭防止）、処分基準（埋立・焼却の条件）の各詳細を示した。特に汚泥・廃油・廃酸・廃アルカリの処理に際しての留意事項、また産業廃棄物の最終処分場（当時は「埋立地」）の設置・構造・管理の考え方が示された。
    keywords: ["産業廃棄物処理基準", "保管基準", "収集運搬基準", "処分基準", "昭和46年"]

  - id: "moe_old_s52_kankyou"
    article: "環産第16号"
    title: "廃棄物の処理及び清掃に関する法律の一部を改正する法律の施行について"
    issued_by: "厚生省環境衛生局長"
    issued_date: "昭和52年3月24日"
    content: |
      昭和52年廃棄物処理法改正（産業廃棄物処理業の許可制度の整備・強化）の施行通知。改正の主な内容：産業廃棄物収集運搬業・処分業の許可制度の整備、産業廃棄物処理施設の設置許可制度の創設（第15条の新設）、マニフェスト（廃棄物管理票）の前身となる運搬票制度の整備。産業廃棄物処理業の許可基準（施設要件・人的要件・財的要件）の解説。
    keywords: ["昭和52年改正", "処理業許可制度", "施設設置許可", "運搬票制度", "許可基準"]

  - id: "moe_old_s59_kankyou"
    article: "衛産第39号"
    title: "廃棄物の処理及び清掃に関する法律の改正について"
    issued_by: "厚生省生活衛生局長"
    issued_date: "昭和59年12月17日"
    content: |
      昭和59年廃棄物処理法改正の施行通知。主な改正内容：産業廃棄物の中間処理施設・最終処分場についての技術基準の強化、産業廃棄物処理委託基準の整備（書面による委託契約の義務化）、マニフェスト（産業廃棄物管理票）の義務付けの拡大。また、廃棄物処理施設の設置許可に係る住民説明・都道府県審議会への諮問の手続き整備が行われた。
    keywords: ["昭和59年改正", "委託基準書面化", "マニフェスト義務化", "施設技術基準強化", "審議会諮問"]

  - id: "moe_old_h2_kankyou"
    article: "衛環第233号"
    title: "廃棄物の処理及び清掃に関する法律の一部を改正する法律の施行について"
    issued_by: "厚生省生活衛生局長"
    issued_date: "平成2年10月8日"
    content: |
      平成2年廃棄物処理法改正の施行通知。主な改正内容：特別管理廃棄物制度の創設（感染性廃棄物・廃PCB・廃油（引火点70度未満）・廃酸（pH2以下）・廃アルカリ（pH12.5以上）等を特別管理廃棄物に指定）、特別管理産業廃棄物管理責任者の設置義務付け、特別管理産業廃棄物処理業の許可制度の新設、特別管理産業廃棄物のマニフェスト全面義務化。感染性廃棄物の定義・判定基準（形状基準・性状基準）の解説。
    keywords: ["平成2年改正", "特別管理廃棄物創設", "感染性廃棄物", "廃PCB", "管理責任者", "特別管理産業廃棄物マニフェスト"]

  - id: "moe_old_h4_kankyou"
    article: "衛環第228号"
    title: "廃棄物の処理及び清掃に関する法律の一部改正について（廃棄物処理施設整備関係）"
    issued_by: "厚生省生活衛生局長"
    issued_date: "平成4年7月3日"
    content: |
      平成4年廃棄物処理法改正（廃棄物処理施設の整備・技術基準の強化）の施行通知。主な改正内容：産業廃棄物処理施設（管理型最終処分場・遮断型最終処分場）の技術基準の大幅強化（遮水工・浸出水処理設備等）、廃棄物処理センター制度の整備、最終処分場の廃止・跡地管理に係る規定の整備（廃止後の維持管理積立金制度）。廃棄物処理施設の設置許可申請書の記載事項・添付書類の詳細解説。
    keywords: ["平成4年改正", "最終処分場技術基準強化", "遮水工", "廃棄物処理センター", "廃止後跡地管理", "維持管理積立金"]

  - id: "moe_old_h6_kankyou"
    article: "衛環第95号"
    title: "廃棄物の処理及び清掃に関する法律の一部を改正する法律の施行について（不法投棄対策強化）"
    issued_by: "厚生省生活衛生局長"
    issued_date: "平成6年8月22日"
    content: |
      平成6年廃棄物処理法改正（不法投棄対策の強化）の施行通知。主な改正内容：不法投棄に係る罰則の大幅強化（5年以下の懲役または1000万円以下の罰金へ引き上げ）、不法投棄業者への措置命令の強化、都道府県による代執行（原状回復）制度の整備、廃棄物処理業者の欠格要件の追加（禁錮以上の刑に処せられた者）、廃棄物処理施設設置者への改善命令の整備。排出事業者の委託処理に係る指導の強化。
    keywords: ["平成6年改正", "不法投棄罰則強化", "罰金1000万円", "代執行制度", "欠格要件追加", "改善命令"]

  - id: "moe_old_h9_kankyou"
    article: "衛環第40号"
    title: "廃棄物の処理及び清掃に関する法律の一部改正（マニフェスト全面義務化）について"
    issued_by: "厚生省生活衛生局長"
    issued_date: "平成9年12月5日"
    content: |
      平成9年廃棄物処理法改正（産業廃棄物マニフェスト全面義務化）の施行通知。全品目の産業廃棄物についてマニフェスト（産業廃棄物管理票）の交付義務化（従来は特別管理産業廃棄物のみ義務）。マニフェストの標準様式（A票〜E票の7票様式）の制定・解説。マニフェストの交付・送付・写しの保存に係る義務の詳細解説。電子マニフェスト（情報処理センター制度）の創設（任意参加）。マニフェストの記載事項の詳細解説。
    keywords: ["平成9年改正", "マニフェスト全面義務化", "7票様式", "電子マニフェスト創設", "情報処理センター"]

  - id: "moe_h10_eisankaku685"
    article: "衛環第685号"
    title: "廃棄物の処理及び清掃に関する法律の一部を改正する法律の施行について（平成10年）"
    issued_by: "厚生省生活衛生局長"
    issued_date: "平成10年5月7日"
    content: |
      平成10年廃棄物処理法改正の施行通知。主な改正内容：廃棄物処理業の許可申請書類の整備（事業計画書・施設の構造図等）、廃棄物処理施設の設置許可申請に係る生活環境影響調査（いわゆる「ミニアセス」）の義務化、産業廃棄物処理業の欠格要件の整備（組織的犯罪の防止に関する法律違反等の追加）、産業廃棄物処理業者の定期的な報告義務の整備。廃棄物処理施設整備計画（国の計画）との整合性の確保。
    keywords: ["平成10年改正", "生活環境影響調査", "ミニアセス", "欠格要件整備", "定期報告"]

  - id: "moe_h12_kankyou"
    article: "衛環第28号"
    title: "廃棄物の処理及び清掃に関する法律の一部改正について（平成12年・廃棄物処理業の適正化）"
    issued_by: "環境省（旧厚生省）"
    issued_date: "平成12年6月1日"
    content: |
      平成12年廃棄物処理法改正の施行通知。主な改正内容：産業廃棄物処理業の許可取消要件の整備（欠格要件の拡充・明確化）、廃棄物処理施設の設置者の変更許可制度の整備、廃棄物処理業者の変更届出制度の整備（軽微な変更と許可変更の区別）、産業廃棄物処理施設における維持管理情報の公表義務（記録閲覧制度の整備）。廃棄物処理業者の実地確認の徹底に関する指示。
    keywords: ["平成12年改正", "許可取消要件整備", "欠格要件拡充", "変更届出", "維持管理情報公表", "記録閲覧"]

  - id: "moe_h14_kankyou"
    article: "環廃対発第020801002号"
    title: "廃棄物の処理及び清掃に関する法律の一部改正（不法投棄対策・広域認定制度）について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部廃棄物対策課"
    issued_date: "平成14年8月1日"
    content: |
      平成14年廃棄物処理法改正の施行通知。主な改正内容：①廃棄物の広域的処理に係る特例制度の創設（広域認定制度：製品の製造業者等が自ら製造した製品の廃棄物を広域的に収集運搬・処分する場合に都道府県知事の個別許可なく行える制度）②廃棄物の広域処理計画の作成③廃棄物処理業者の行政処分情報の公開義務化④産業廃棄物の不法投棄等の未然防止のための環境省の役割強化⑤廃棄物処理法違反業者に係る情報提供制度の整備。
    keywords: ["平成14年改正", "広域認定制度", "製造業者廃棄物", "行政処分情報公開", "不法投棄未然防止"]

  - id: "moe_h15_kankyou"
    article: "環廃産発第031031001号"
    title: "産業廃棄物の処理に係る特定有害産業廃棄物について"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成15年10月31日"
    content: |
      特定有害産業廃棄物（廃棄物処理法施行令第2条の4第5号に掲げる廃棄物）の範囲と取扱いに関する通知。特定有害産業廃棄物として指定されているもの：廃酸・廃アルカリのうちアルキル水銀化合物を含むもの、ポリ塩化ビフェニルを含む廃油、廃石綿等（石綿（吹付け）、石綿含有断熱材等）、廃水銀等（廃水銀・廃水銀化合物）、カドミウム又はその化合物を含む廃棄物。それぞれの判定基準・処理方法・埋立基準（溶出基準）の詳細解説。
    keywords: ["特定有害産業廃棄物", "廃水銀", "廃石綿等", "カドミウム含有廃棄物", "廃PCB含有廃油", "溶出基準"]

  - id: "moe_h17_asbestos"
    article: "環廃産発第050819002号"
    title: "石綿含有廃棄物等処理マニュアルについて"
    issued_by: "環境省環境再生・資源循環局廃棄物適正処理推進課"
    issued_date: "平成17年8月19日"
    content: |
      石綿（アスベスト）含有廃棄物の処理マニュアルの策定・通知。主な内容：廃石綿等（飛散性）と石綿含有廃棄物（非飛散性）の区別、廃石綿等（特別管理産業廃棄物）の処理基準（二重梱包・密封・湿潤化等）、石綿含有廃棄物（非飛散性）の処理基準（破砕禁止・溶融又は管理型処分場での埋立）、石綿含有廃棄物の収集運搬・処分に必要な許可の種類（廃石綿等は特別管理産業廃棄物処理業の許可、石綿含有廃棄物は産業廃棄物処理業の許可）。建設解体工事における石綿含有建材の判別方法の解説。
    keywords: ["石綿含有廃棄物処理マニュアル", "廃石綿等", "飛散性", "非飛散性", "二重梱包", "湿潤化", "破砕禁止", "石綿含有建材判別"]

  - id: "moe_h18_manifest_expand"
    article: "環廃産発第060331005号"
    title: "廃棄物の処理及び清掃に関する法律の一部改正（産業廃棄物マニフェスト制度の見直し）について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成18年3月31日"
    content: |
      平成18年廃棄物処理法改正（マニフェスト制度の電子化促進・制度強化）の施行通知。主な改正内容：①電子マニフェストの普及促進（情報処理センターの公益法人化、JWNETへの移行）②紙マニフェストの様式の改正（廃棄物の数量単位の追加等）③マニフェストの写しの保存期間の確認④マニフェスト未返送時の都道府県知事への報告義務の明確化⑤中間処理業者（再生処理業者含む）からの二次マニフェストの交付義務の明確化。
    keywords: ["平成18年改正", "電子マニフェスト促進", "JWNET", "中間処理二次マニフェスト", "マニフェスト様式改正"]

  - id: "moe_h19_facility"
    article: "環廃産発第071001003号"
    title: "産業廃棄物処理施設の設置許可申請に係る生活環境影響調査について"
    issued_by: "環境省大臣官房廃棄物・リサイクル対策部産業廃棄物課"
    issued_date: "平成19年10月1日"
    content: |
      産業廃棄物処理施設の設置許可申請に際して義務付けられた生活環境影響調査（ミニアセス）の実施指針。主な内容：生活環境影響調査の対象施設（廃棄物処理法施行令第7条の施設許可対象施設）、調査項目（大気質・水質・騒音・振動・悪臭・地下水等）、調査方法、調査書の記載事項、審査の方法（技術的審査・住民意見の反映）。都道府県が審査に当たっての留意点。生活環境影響調査の免除・簡略化が認められる場合。
    keywords: ["生活環境影響調査", "ミニアセス", "施設設置許可", "調査項目", "大気質", "水質", "騒音", "地下水"]
