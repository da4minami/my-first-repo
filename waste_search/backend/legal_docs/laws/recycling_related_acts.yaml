title: "資源有効利用促進法・各リサイクル法（概要）"
short_title: "リサイクル関連法"
law_number: "複数法律"
category: "法律"
sections:
  - id: "recycle_promotion"
    article: "資源有効利用促進法（平成3年法律第48号）"
    title: "資源の有効な利用の促進に関する法律"
    content: |
      事業者に対し、製品の省資源化・長寿命化、再生資源・再生部品の利用、廃棄物発生の抑制等を求める法律。廃棄物処理法と相互補完的に機能する。指定省資源化製品・指定再利用促進製品・指定表示製品等について特定の義務を課す。産業廃棄物として処理される前の段階（副産物・有価物等）の取扱いに関連する。
    keywords: ["資源有効利用促進法", "省資源化", "再生資源", "副産物", "有価物"]

  - id: "container_recycle"
    article: "容器包装リサイクル法（平成7年法律第112号）"
    title: "容器包装に係る分別収集及び再商品化の促進等に関する法律"
    content: |
      消費者・市町村・事業者（製造・利用・販売業者）が役割分担してリサイクルを推進する法律。対象容器包装（ガラス瓶、PETボトル、紙製・プラスチック製容器包装等）を製造・利用する特定事業者は再商品化義務を負う。市町村は分別収集計画を策定し収集した容器包装を指定法人（公益財団法人日本容器包装リサイクル協会）に引き渡す。
    keywords: ["容器包装リサイクル法", "PETボトル", "ガラス瓶", "再商品化義務", "特定事業者"]

  - id: "home_appliance_recycle"
    article: "家電リサイクル法（平成10年法律第97号）"
    title: "特定家庭用機器再商品化法"
    content: |
      エアコン、テレビ（ブラウン管・液晶・プラズマ）、冷蔵庫・冷凍庫、洗濯機・衣類乾燥機の4品目を対象とする。小売業者は引取義務、製造業者等は再商品化義務を負う。消費者は収集・運搬料金（リサイクル料金）を負担する。不法投棄防止の観点から廃棄物処理法と連携して運用される。
    keywords: ["家電リサイクル法", "エアコン", "テレビ", "冷蔵庫", "洗濯機", "リサイクル料金", "引取義務"]

  - id: "food_recycle"
    article: "食品リサイクル法（平成12年法律第116号）"
    title: "食品循環資源の再生利用等の促進に関する法律"
    content: |
      食品の製造・流通・消費の各段階で発生する食品廃棄物等の再生利用等を促進する法律。食品関連事業者（製造業者・流通業者・外食産業等）は、食品廃棄物等の発生抑制・再生利用・減量についての基準（発生抑制の目標値）の達成に努めなければならない。再生利用の優先順位：飼料化＞肥料化＞油脂化等＞熱回収＞焼却・埋立。食品廃棄物（動植物性残さ）は産業廃棄物の一種（動植物性残さ）に該当し、廃棄物処理法も適用される。
    keywords: ["食品リサイクル法", "食品廃棄物", "動植物性残さ", "飼料化", "肥料化", "食品関連事業者"]

  - id: "automobile_recycle"
    article: "自動車リサイクル法（平成14年法律第87号）"
    title: "使用済自動車の再資源化等に関する法律"
    content: |
      使用済自動車（廃車）のリサイクル・適正処理を促進する法律。自動車メーカー等が引取義務・再資源化義務を負う。フロン類・エアバッグ類・シュレッダーダスト（ASR）の3種類を特定重要部品として適正処理を義務付ける。廃車は産業廃棄物の一種ではなく（非事業活動の場合は一般廃棄物相当）、本法に基づく独自の処理ルートで処理される。
    keywords: ["自動車リサイクル法", "廃車", "フロン類回収", "エアバッグ", "シュレッダーダスト", "ASR"]

  - id: "small_appliance_recycle"
    article: "小型家電リサイクル法（平成24年法律第57号）"
    title: "使用済小型電子機器等の再資源化の促進に関する法律"
    content: |
      携帯電話・デジタルカメラ・携帯音楽プレーヤー等の小型電子機器を対象とする。市町村が使用済小型家電の回収拠点を設置し、認定事業者が再資源化を行う任意参加型の制度。対象品目は環境省令で定める28品目群。事業所から排出される小型家電は産業廃棄物として廃棄物処理法が適用される場合があるが、有価物として売却する場合は廃棄物に該当しない。
    keywords: ["小型家電リサイクル法", "携帯電話", "デジタルカメラ", "認定事業者", "28品目群"]
