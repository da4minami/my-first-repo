title: "廃棄物の処理及び清掃に関する法律（続編）"
short_title: "廃棄物処理法（第2部）"
law_number: "昭和45年法律第137号"
last_amended: "令和4年法律第68号"
category: "法律"
sections:
  - id: "law_4"
    article: "第4条"
    title: "市町村の責務"
    content: |
      第4条 市町村は、その区域内における一般廃棄物の生活環境の保全上支障のない処理を確保するよう努めるとともに、一般廃棄物の処理に関する事業の実施に当たっては、その能率的な運営に努めなければならない。
      2 市町村は、一般廃棄物の処理に関する計画（以下「一般廃棄物処理計画」という。）を定めなければならない。
      3 一般廃棄物処理計画には、次に掲げる事項を記載しなければならない。
      一 一般廃棄物の発生量及び処理量の見込み
      二 一般廃棄物の排出の抑制のための方策に関する事項
      三 分別して収集するものとした一般廃棄物の種類及び分別の区分
      四 一般廃棄物の適正な処理及びこれを実施する者に関する基本的事項
      五 一般廃棄物の処理施設の整備に関する事項
    keywords: ["市町村責務", "一般廃棄物処理計画", "処理計画策定義務"]

  - id: "law_5"
    article: "第5条"
    title: "都道府県の責務"
    content: |
      第5条 都道府県は、市町村に対し、前条第一項に規定する責務が十分に果たされるように必要な技術的援助を与えることに努めるとともに、産業廃棄物の適正な処理が行われるように必要な措置を講ずることに努めなければならない。
      2 都道府県は、産業廃棄物の処理に関する計画（以下「産業廃棄物処理計画」という。）を定めなければならない。
    keywords: ["都道府県責務", "産業廃棄物処理計画", "技術的援助"]

  - id: "law_7_2"
    article: "第7条の2"
    title: "一般廃棄物処理業の許可の特例"
    content: |
      第7条の2 一般廃棄物処理業の許可を受けた者（以下「一般廃棄物処理業者」という。）は、当該許可に係る一般廃棄物の処理を適正に行うことが困難となった場合には、速やかにその旨を市町村長に届け出なければならない。
    keywords: ["一般廃棄物処理業", "許可の特例", "届出"]

  - id: "law_9_3"
    article: "第9条の3"
    title: "一般廃棄物処理施設の廃止"
    content: |
      第9条の3 一般廃棄物処理施設の設置者は、当該一般廃棄物処理施設を廃止しようとするときは、その廃止の日の60日前までに、環境省令で定めるところにより、その旨を市町村長に届け出なければならない。ただし、廃棄物の処理を継続した場合には、生活環境の保全上支障が生ずるおそれがある場合は、市町村長は当該施設の設置者に対し、廃止についての条件を付することができる。
    keywords: ["処理施設廃止", "60日前届出", "市町村長"]

  - id: "law_12_2"
    article: "第12条の2"
    title: "特別管理産業廃棄物の処理基準"
    content: |
      第12条の2 事業者は、その特別管理産業廃棄物が運搬されるまでの間、環境省令で定める技術上の基準（以下「特別管理産業廃棄物保管基準」という。）に従い、生活環境の保全上支障のないようにこれを保管しなければならない。
      2 事業者は、特別管理産業廃棄物の処分を他人に委託する場合には、その処分を委託しようとする者が特別管理産業廃棄物収集運搬業又は特別管理産業廃棄物処分業の許可を受けた者であることを確認しなければならない。
      3 事業者は、特別管理産業廃棄物の管理の責任者として、当該事業場ごとに「特別管理産業廃棄物管理責任者」を置かなければならない。
    keywords: ["特別管理産業廃棄物", "保管基準", "管理責任者", "委託確認"]

  - id: "law_12_4"
    article: "第12条の4"
    title: "特別管理産業廃棄物管理票（マニフェスト）"
    content: |
      第12条の4 事業者は、特別管理産業廃棄物の運搬又は処分を他人に委託する場合には、環境省令で定めるところにより、当該委託に係る特別管理産業廃棄物の引渡しと同時に当該特別管理産業廃棄物の運搬を受託した者に対し特別管理産業廃棄物管理票を交付しなければならない。
    keywords: ["特別管理産業廃棄物管理票", "マニフェスト", "委託", "交付義務"]

  - id: "law_12_5"
    article: "第12条の5"
    title: "電子マニフェスト"
    content: |
      第12条の5 電子情報処理組織（以下「電子マニフェストシステム」という。）を使用して産業廃棄物管理票に係る情報の伝達を行う場合には、産業廃棄物管理票の交付及び写しの送付に代えて、電子マニフェストシステムを使用した情報の登録及び通知により行うことができる。
      2 特別管理産業廃棄物を排出する事業者であって、前年度の特別管理産業廃棄物の排出量が環境省令で定める量以上のものは、電子マニフェストを使用しなければならない。
    keywords: ["電子マニフェスト", "JWNET", "多量排出事業者", "義務使用", "50トン"]

  - id: "law_13"
    article: "第13条"
    title: "産業廃棄物の輸出入の制限"
    content: |
      第13条 産業廃棄物の輸出は、輸出しようとする者が、あらかじめ環境大臣の確認を受けなければならない。
      2 環境大臣は、前項の確認の申請があった場合において、当該産業廃棄物の輸出が国際的な協力の確保及び生活環境の保全上支障がないと認められるときは、その確認をするものとする。
    keywords: ["廃棄物輸出", "環境大臣確認", "国際移動"]

  - id: "law_14_2"
    article: "第14条の2"
    title: "産業廃棄物処理業の欠格要件"
    content: |
      第14条の2 次の各号のいずれかに該当する者は、第14条第1項又は第4項の許可を受けることができない。
      一 心身の故障によりその業務を適切に行うことができない者として環境省令で定めるもの
      二 破産手続開始の決定を受けて復権を得ない者
      三 禁錮以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなった日から5年を経過しない者
      四 廃棄物処理法、浄化槽法、大気汚染防止法、騒音規制法、悪臭防止法、水質汚濁防止法若しくは土壌汚染対策法の規定に違反し、罰金の刑に処せられ、その執行を終わり、又は執行を受けることがなくなった日から5年を経過しない者
      五 第14条第6項の規定により許可を取り消され、その取消しの日から5年を経過しない者
      六 法人であって、その業務を行う役員のうちに上記各号に該当する者がいるもの
      七 暴力団員等がその事業活動を支配する者
    keywords: ["欠格要件", "許可取消", "5年経過", "暴力団排除", "罰金刑"]

  - id: "law_14_6"
    article: "第14条第6項"
    title: "産業廃棄物処理業許可の取消し"
    content: |
      第14条第6項 都道府県知事は、産業廃棄物収集運搬業者若しくは産業廃棄物処分業者が次の各号のいずれかに該当するときは、その許可を取り消し、又は期間を定めてその事業の全部若しくは一部の停止を命ずることができる。
      一 不正の手段により許可を受けたとき
      二 第14条の2各号の欠格要件に該当することとなったとき
      三 産業廃棄物の処理基準に従わないで産業廃棄物の収集若しくは運搬又は処分を行ったとき
      四 その事業の用に供する施設又はその処理の方法が第14条第5項の基準に適合しなくなったとき
      五 この法律若しくはこの法律に基づく命令の規定に違反したとき
    keywords: ["許可取消", "事業停止命令", "不正取得", "処理基準違反"]

  - id: "law_15_2"
    article: "第15条の2"
    title: "産業廃棄物処理施設の許可基準"
    content: |
      第15条の2 都道府県知事は、第15条第1項の許可の申請が次の各号のいずれかに該当するときは、その許可をしてはならない。
      一 その申請の内容が、環境省令で定める技術上の基準に適合しないと認められるとき
      二 その申請者が廃棄物処理法等の規定による許可を取り消されてから5年を経過しない者であるとき
      三 その申請者が設置しようとする産業廃棄物処理施設が、産業廃棄物処理計画の実施に支障を及ぼすと認められるとき
    keywords: ["処理施設許可基準", "技術基準", "拒否要件"]

  - id: "law_15_7"
    article: "第15条の7"
    title: "産業廃棄物処理施設の維持管理"
    content: |
      第15条の7 産業廃棄物処理施設の設置者は、当該産業廃棄物処理施設について、環境省令で定める維持管理の基準に従い、その維持管理をしなければならない。
      2 産業廃棄物処理施設の設置者は、当該産業廃棄物処理施設に係る維持管理に関する記録を作成し、これを閲覧に供しなければならない。
    keywords: ["維持管理基準", "記録作成", "閲覧義務", "処理施設"]

  - id: "law_18"
    article: "第18条"
    title: "報告の徴収"
    content: |
      第18条 都道府県知事は、この法律の施行に必要な限度において、産業廃棄物を生ずる事業を行う者、産業廃棄物処理業者、産業廃棄物処理施設の設置者その他の関係者に対し、廃棄物の処理状況その他必要な事項の報告を求めることができる。
    keywords: ["報告徴収", "都道府県知事権限", "廃棄物処理状況"]

  - id: "law_19"
    article: "第19条"
    title: "立入検査"
    content: |
      第19条 都道府県知事は、この法律の施行に必要な限度において、その職員に、産業廃棄物を生ずる事業場その他の場所に立ち入り、廃棄物の処理状況、帳簿書類その他の物件を検査させ、又は廃棄物の処理に関係のある者に質問させることができる。
      2 前項の規定により立入検査をする職員は、その身分を示す証明書を携帯し、関係者の請求があったときは、これを提示しなければならない。
    keywords: ["立入検査", "都道府県職員", "帳簿検査", "身分証明書"]

  - id: "law_19_3"
    article: "第19条の3"
    title: "改善命令"
    content: |
      第19条の3 都道府県知事は、産業廃棄物処理業者が産業廃棄物の処理基準（特別管理産業廃棄物にあっては、特別管理産業廃棄物処理基準）に従わないで産業廃棄物の収集、運搬又は処分を行ったときは、その者に対し、期限を定めて、その改善を命じ、又はその事業の全部若しくは一部の停止を命ずることができる。
    keywords: ["改善命令", "事業停止命令", "処理基準違反", "都道府県知事"]

  - id: "law_19_6"
    article: "第19条の6"
    title: "都道府県による代執行"
    content: |
      第19条の6 都道府県知事は、第19条の5第1項の規定により措置を命じようとする場合において、過失がなくて当該措置を命ずべき者を確知することができないとき（過失がなくてその者の所在を確知することができないときを含む。）は、その者の負担において、その支障の除去等の措置を自ら行い、又はその命じた者若しくは委任した者に行わせることができる。
    keywords: ["代執行", "措置命令", "所在不明", "費用負担"]

  - id: "law_19_8"
    article: "第19条の8"
    title: "生活環境支障除去のための措置"
    content: |
      第19条の8 都道府県知事は、産業廃棄物処理基準に適合しない方法で廃棄物が処理された場合において、生活環境の保全上支障が生じ、又は生ずるおそれがあり、かつ、第19条の5の規定に基づく措置命令だけでは生活環境の保全上の支障を除去するに不十分と認めるときは、排出事業者、処理受託者等に対し、その支障を除去するために必要な措置を採るよう指示することができる。
    keywords: ["生活環境支障除去", "指示", "排出事業者", "措置命令の補完"]

  - id: "law_21"
    article: "第21条の2"
    title: "産業廃棄物処理業者等の廃業等の届出"
    content: |
      第21条の2 産業廃棄物収集運搬業者又は産業廃棄物処分業者は、次の各号のいずれかに該当することとなったときは、その日から30日以内に、その旨を都道府県知事に届け出なければならない。
      一 その事業を廃止したとき
      二 その事業を休止したとき
      三 その事業を再開したとき
      四 許可証に記載された事項に変更があったとき（軽微な変更を除く。）
    keywords: ["廃業届出", "休止届出", "変更届出", "30日以内", "都道府県知事"]

  - id: "law_24"
    article: "第24条の2"
    title: "国及び地方公共団体の援助"
    content: |
      第24条の2 国及び地方公共団体は、廃棄物処理業者の廃棄物処理施設の整備及びこれに要する資金の確保に関し、必要な援助を与えることに努めるものとする。
    keywords: ["国の援助", "施設整備", "資金確保"]

  - id: "law_25_2"
    article: "第25条第2項"
    title: "罰則（未遂・法人）"
    content: |
      法人の代表者又は法人若しくは人の代理人、使用人その他の従業者が、その法人又は人の業務に関し、第25条から第32条までの違反行為をしたときは、その行為者を罰するほか、その法人又は人に対して、各本条の罰金刑を科する（両罰規定）。
    keywords: ["両罰規定", "法人処罰", "代表者責任", "罰金"]

  - id: "law_26"
    article: "第26条"
    title: "罰則（3年以下懲役・300万円以下罰金）"
    content: |
      第26条 次の各号のいずれかに該当する者は、3年以下の懲役若しくは300万円以下の罰金に処し、又はこれを併科する。
      一 第14条第6項の規定による事業の停止の命令に違反した者
      二 第19条の3の規定による事業の停止の命令に違反した者
    keywords: ["事業停止命令違反", "懲役3年", "罰金300万円"]

  - id: "law_27"
    article: "第27条の2"
    title: "罰則（30万円以下の罰金）"
    content: |
      第27条の2 次の各号のいずれかに該当する者は、30万円以下の罰金に処する。
      一 第12条の3第1項（又は第12条の4第1項）の規定に違反して管理票を交付しなかった者（マニフェスト不交付）
      二 第12条の3第5項（又は第12条の4第5項）の規定に違反して帳簿を作成せず、虚偽の帳簿を作成し、又は帳簿を保存しなかった者
    keywords: ["マニフェスト不交付罰則", "帳簿不作成", "罰金30万円"]
