title: "廃棄物処理に関連する大気・水質汚染規制法"
short_title: "大気・水質汚染規制関連法"
law_number: "複数法律"
category: "法律"
sections:
  - id: "air_pollution"
    article: "大気汚染防止法（昭和43年法律第97号）第18条の22以下"
    title: "石綿（アスベスト）に係る大気汚染防止法規制"
    content: |
      特定粉じん（石綿）を発生させる特定粉じん排出等作業（吹付け石綿、断熱材等が使用されている建築物の解体等）を行う際には、施工者は事前に都道府県知事等への届出が必要（平成18年大気汚染防止法改正）。石綿含有廃棄物の処理は廃棄物処理法の特別管理産業廃棄物の規定が適用される。石綿は飛散防止対策が必要で、解体時に石綿が含有されていないかの事前調査（分析調査又は設計図書確認等）が義務付けられている（令和3年法改正）。
    keywords: ["石綿", "アスベスト", "大気汚染防止法", "解体工事", "事前調査義務", "特定粉じん排出等作業届出"]

  - id: "asbestos_disposal"
    article: "石綿廃棄物の廃棄物処理法上の取扱い"
    title: "石綿含有廃棄物の処理基準"
    content: |
      石綿含有廃棄物（石綿が含有されている廃棄物）は、廃棄物処理法上の産業廃棄物（ガラスくず・コンクリートくず・陶磁器くず、廃プラスチック類等）として処理する。特別管理産業廃棄物である廃石綿等（飛散性）とは区別される。廃石綿等（吹付け石綿、石綿含有断熱材等で飛散性のもの）は特別管理産業廃棄物として厳重な処理が必要。石綿含有廃棄物（成形板等の非飛散性）は一般の産業廃棄物だが、破砕禁止・溶融処理か管理型最終処分場への埋立が必要。
    keywords: ["石綿含有廃棄物", "廃石綿等", "飛散性", "非飛散性", "特別管理産業廃棄物", "管理型最終処分場"]

  - id: "water_pollution"
    article: "水質汚濁防止法（昭和45年法律第138号）"
    title: "廃棄物処理施設に係る水質汚濁防止法規制"
    content: |
      産業廃棄物処理施設が特定施設（汚水・廃液を排出する施設）に該当する場合、排出水が排水基準（水質汚濁防止法施行規則別表第1）に適合しなければならない。産業廃棄物の最終処分場（管理型・遮断型）は水質汚濁防止法の特定施設に該当し、浸出水の水質測定義務・排水基準遵守義務がある。有害物質（鉛・六価クロム・カドミウム等）の排出基準は一律基準（廃液・排出水問わず適用）として設定されている。
    keywords: ["水質汚濁防止法", "特定施設", "排水基準", "最終処分場浸出水", "有害物質排出基準"]

  - id: "dioxin"
    article: "ダイオキシン類対策特別措置法（平成11年法律第105号）"
    title: "廃棄物焼却炉に係るダイオキシン類対策"
    content: |
      廃棄物焼却炉はダイオキシン類対策特別措置法の「特定施設」に該当し、ダイオキシン類の排出基準（排出ガス基準・排出水基準・ばいじん処理基準）が適用される。廃棄物処理法の施設許可を受けた産業廃棄物焼却施設は、ダイオキシン類の排出基準（燃焼条件：炉内温度800度以上、ガス滞留時間2秒以上等）を遵守しなければならない。毎年1回以上の排出ガス測定が義務付けられている。
    keywords: ["ダイオキシン類対策特別措置法", "廃棄物焼却炉", "排出基準", "燃焼温度800度", "排出ガス測定"]
