title: "廃棄物の処理及び清掃に関する法律施行規則"
short_title: "廃棄物処理法施行規則"
law_number: "昭和46年厚生省令第35号"
last_amended: "令和4年環境省令第33号"
category: "省令"
sections:
  - id: "rule_1_2"
    article: "第1条の2"
    title: "産業廃棄物の保管基準"
    content: |
      法第12条第1項の産業廃棄物保管基準は、次のとおりとする。
      一 保管は、次に掲げる要件を満たす場所で行うこと。
        イ 周囲に囲いが設けられていること。
        ロ 見やすい箇所に産業廃棄物の保管の場所である旨その他環境省令で定める事項を表示した掲示板が設けられていること。
      二 産業廃棄物が飛散し、及び流出しないようにすること。
      三 悪臭が発散しないようにすること。
      四 ねずみが生息し、及び蚊、はえその他の害虫が発生しないようにすること。
      五 汚水が生じるおそれのある産業廃棄物の保管は、次に掲げる要件を満たす場所で行うこと。
        イ 底面を不透水性の材料で覆われていること。
        ロ 保管の場所から汚水が排出されないように、排水溝その他の設備が設けられていること。
    keywords: ["保管基準", "囲い", "掲示板", "飛散防止", "汚水対策"]

  - id: "rule_2_2"
    article: "第2条の2"
    title: "委託基準"
    content: |
      法第12条第2項の産業廃棄物処理委託基準は、次のとおりとする。
      一 産業廃棄物の収集又は運搬の委託は、次に掲げる要件を満たす者に対して行うこと。
        イ 委託しようとする産業廃棄物の収集又は運搬を業として行うことができる者であること。
        ロ 委託しようとする産業廃棄物の収集又は運搬に必要な許可証の写しを有していること。
      二 産業廃棄物の処分の委託は、次に掲げる要件を満たす者に対して行うこと。
        イ 委託しようとする産業廃棄物の処分を業として行うことができる者であること。
      三 委託契約は、書面により行い、当該委託契約書には、次に掲げる事項を含むこと。
        イ 委託する産業廃棄物の種類及び数量
        ロ 産業廃棄物の運搬を委託するときは、運搬の最終目的地の所在地
        ハ 産業廃棄物の処分を委託するときは、その処分の場所の所在地、その処分の方法及びその処分に係る施設の処理能力
        ニ 産業廃棄物の処分（最終処分を除く。）を委託するときは、当該産業廃棄物に係る最終処分の場所の所在地、最終処分の方法及び最終処分に係る施設の処理能力
        ホ 委託契約の有効期間
        ヘ 委託者が受託者に支払う料金
      四 委託契約書及びその写しを、当該契約の終了の日から5年間保存すること。
    keywords: ["委託基準", "委託契約書", "書面", "5年保存", "許可業者確認"]

  - id: "rule_7_1"
    article: "第7条の1"
    title: "マニフェスト（産業廃棄物管理票）の記載事項"
    content: |
      産業廃棄物管理票には、次に掲げる事項を記載しなければならない。
      一 交付年月日
      二 交付担当者の氏名
      三 交付番号
      四 事業場の名称、所在地及び電話番号並びに排出事業者の氏名又は名称
      五 産業廃棄物の種類（特別管理産業廃棄物にあってはその旨）
      六 産業廃棄物の数量
      七 運搬受託者の氏名又は名称及び住所
      八 運搬の目的地の所在地
      九 処分受託者の氏名又は名称及び住所
      十 処分の場所の所在地
    keywords: ["マニフェスト記載事項", "管理票", "交付番号", "数量", "種類"]

  - id: "rule_8_13"
    article: "第8条の13"
    title: "マニフェストの保存"
    content: |
      排出事業者は、産業廃棄物管理票の写しを当該産業廃棄物の処分が終了した日から5年間保存しなければならない。産業廃棄物処理業者は、交付を受けた管理票の写しを5年間保存しなければならない。
    keywords: ["マニフェスト保存", "5年保存", "写し"]

  - id: "rule_9_7"
    article: "第9条の7"
    title: "産業廃棄物処理業の許可申請"
    content: |
      産業廃棄物収集運搬業又は産業廃棄物処分業の許可の申請は、次に掲げる書類を都道府県知事に提出して行う。
      一 申請書
      二 事業計画書
      三 申請者の住民票の写し又は登記事項証明書
      四 申請者が法人である場合、定款又は寄附行為の写し
      五 事業に供する施設の構造を明らかにする書類及び図面
      六 最終処分場については、埋立処分を行う区域の図面及び埋立計画の概要を記載した書類
      七 申請者の経理的基礎を明らかにする書類
    keywords: ["許可申請", "申請書類", "収集運搬業", "処分業", "申請手続"]
