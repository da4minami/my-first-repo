title: "廃棄物の処理及び清掃に関する法律施行規則（続編）"
short_title: "廃棄物処理法施行規則（第2部）"
law_number: "昭和46年厚生省令第35号"
last_amended: "令和4年環境省令第33号"
category: "省令"
sections:
  - id: "rule_2_4"
    article: "第2条の4"
    title: "産業廃棄物の収集・運搬時の車両表示"
    content: |
      産業廃棄物の収集又は運搬を業として行う者は、その収集又は運搬の用に供する車両に、次に掲げる事項を見やすいように記載した書面を備え付けなければならない。
      一 産業廃棄物の収集又は運搬を業として行う者である旨
      二 当該業者の氏名又は名称
      三 許可番号
      また、積荷の産業廃棄物が他者の目から見て廃棄物であることが明らかになるよう表示すること。
    keywords: ["車両表示義務", "許可番号表示", "収集運搬業者", "書面備付け"]

  - id: "rule_3"
    article: "第3条"
    title: "特別管理産業廃棄物管理責任者の資格"
    content: |
      廃棄物処理法第12条の2第8項の特別管理産業廃棄物管理責任者は、次のいずれかに該当する者でなければならない。
      一 医師、歯科医師、薬剤師、獣医師、保健師、助産師、看護師、臨床検査技師、衛生検査技師又は歯科衛生士（感染性産業廃棄物の場合）
      二 廃棄物の処理及び清掃に関し2年以上実務経験を有する者で、環境大臣が定める者が行う講習会の修了者
      三 大学で理学・工学・農学・医学・獣医学・歯学・薬学・保健学・衛生学の課程を修め卒業した者で、産業廃棄物処理に1年以上実務経験を有するもの
      四 高等学校で理学・工学・農学系課程を修め卒業した者で、産業廃棄物処理に3年以上実務経験を有するもの
    keywords: ["特別管理産業廃棄物管理責任者資格", "医師", "看護師", "講習会修了", "2年実務経験"]

  - id: "rule_4_2"
    article: "第4条の2"
    title: "産業廃棄物収集運搬業・処分業の更新申請"
    content: |
      産業廃棄物収集運搬業又は産業廃棄物処分業の許可の更新の申請は、有効期間の満了の日の2月前までに、次の書類を添えて、都道府県知事に提出して行う。
      一 更新申請書
      二 直前3年間のマニフェスト交付・受領の状況（収集運搬業者の場合）又は処分実績（処分業者の場合）を記載した書類
      三 欠格要件に該当しないことを証する書類（誓約書等）
      四 事業計画書
      五 許可証の写し
    keywords: ["更新申請", "2か月前", "マニフェスト交付状況", "処分実績", "欠格要件誓約書"]

  - id: "rule_5"
    article: "第5条"
    title: "帳簿の記載事項"
    content: |
      産業廃棄物処理業者は、次の事項を帳簿に記載しなければならない。
      一 収集した産業廃棄物の種類及び数量
      二 収集した産業廃棄物の引渡しを受けた者の氏名又は名称並びにその収集の場所（排出事業場）
      三 運搬した産業廃棄物の種類及び数量
      四 運搬した産業廃棄物の引渡しを受けた者の氏名又は名称及び引渡しの場所（処分先）
      五 マニフェストの番号
      帳簿は、事業場ごとに備え付け、月ごとに記載し、その月の末日から翌月末日までに当該月の記載をするものとする。記録後5年間保存する義務がある。
    keywords: ["帳簿記載義務", "帳簿保存5年", "月次記録", "収集運搬実績", "処分業帳簿"]

  - id: "rule_6"
    article: "第6条"
    title: "産業廃棄物処理施設の維持管理記録"
    content: |
      産業廃棄物処理施設の設置者は、次の事項を記録した書面を施設内に備え付けなければならない。
      一 処理した産業廃棄物の種類及び数量
      二 処理した産業廃棄物の性状及び性状の変化
      三 施設の設備の点検及び修繕の状況
      四 施設の設備の異常の有無及びその概要
      五 施設に係る検査の結果
      これらの記録は、施設の敷地内の見やすい場所に閲覧できる状態で保管し、一般の閲覧に供しなければならない（閲覧義務）。
    keywords: ["維持管理記録", "閲覧義務", "点検記録", "処理実績記録", "処理施設"]

  - id: "rule_8_2"
    article: "第8条の2"
    title: "マニフェストのE票未返送時の報告義務"
    content: |
      排出事業者は、産業廃棄物の処分が終了したことの確認を行うため、次の期間内に管理票の写し（D票・E票）の送付を受けない場合には、速やかに都道府県知事に報告しなければならない。
      一 最終処分以外の処分（中間処理）：処分終了後90日以内にD票又はE票が返送されない場合
      二 最終処分：処分終了後180日以内にE票が返送されない場合
      この場合、都道府県知事は調査を行い、不適正処理が疑われる場合は立入検査・指導を行う。
    keywords: ["E票未返送報告義務", "90日", "180日", "都道府県知事報告", "最終処分確認"]

  - id: "rule_12_2"
    article: "第12条の2"
    title: "産業廃棄物処理業の許可証記載事項"
    content: |
      産業廃棄物収集運搬業（又は処分業）の許可証には、次の事項が記載される。
      一 許可の番号
      二 許可の有効期間
      三 氏名又は名称及び住所
      四 取り扱うことができる産業廃棄物の種類
      五 収集若しくは運搬を行うことができる区域（積替え保管を含む場合はその旨）
      六 許可の条件（条件付許可の場合）
      許可証は業務の遂行に際して携帯又は事務所に備え付けることが義務付けられ、更新・変更の際は旧許可証の返還が必要。
    keywords: ["許可証記載事項", "許可番号", "有効期間", "廃棄物種類", "区域", "条件付許可"]
