title: "廃棄物の処理及び清掃に関する法律施行令（続編）"
short_title: "廃棄物処理法施行令（第2部）"
law_number: "昭和46年政令第300号"
last_amended: "令和4年政令第247号"
category: "政令"
sections:
  - id: "ord_4_1"
    article: "第4条の1"
    title: "産業廃棄物の中間処理の方法"
    content: |
      産業廃棄物の中間処理の方法は次のとおりとする。
      一 焼却（廃プラスチック類、木くず、紙くず、繊維くず、動植物性残さ、動物系固形不要物、動物のふん尿、動物の死体等）
      二 溶融（廃プラスチック類、がれき類、ばいじん等）
      三 脱水（汚泥等）
      四 乾燥（汚泥等）
      五 油水分離（廃油等）
      六 中和（廃酸、廃アルカリ等）
      七 破砕・切断（廃プラスチック類、木くず、金属くず、ガラスくず、がれき類等）
      八 圧縮・梱包（廃プラスチック類、金属くず等）
      九 選別（混合廃棄物の分別）
    keywords: ["中間処理方法", "焼却", "溶融", "脱水", "破砕", "中和", "油水分離"]

  - id: "ord_4_2"
    article: "第4条の2"
    title: "産業廃棄物の最終処分の方法"
    content: |
      産業廃棄物の最終処分の方法は次のとおりとする。
      一 埋立処分（安定型最終処分場、管理型最終処分場又は遮断型最終処分場での埋立て）
      二 海洋投入処分（廃棄物の海洋投棄の規制に関する条約の規定に基づき認められる場合に限る）
      安定型最終処分場に埋立可能な廃棄物：安定型産業廃棄物（廃プラスチック類、ゴムくず、金属くず、ガラスくず・コンクリートくず・陶磁器くず、がれき類）のみ。
      管理型最終処分場に埋立可能な廃棄物：安定型以外の産業廃棄物（汚泥、廃油、廃酸、廃アルカリ、木くず等）。
    keywords: ["最終処分方法", "埋立処分", "安定型", "管理型", "安定型産業廃棄物"]

  - id: "ord_5"
    article: "第5条"
    title: "産業廃棄物の収集・運搬基準"
    content: |
      産業廃棄物の収集又は運搬の基準は、次のとおりとする。
      一 収集又は運搬に当たっては、産業廃棄物が飛散し、及び流出し、並びに悪臭が漏れないようにすること。
      二 収集又は運搬に当たっては、密閉された運搬容器に収納するか、又は覆いをすること。
      三 車両を用いて運搬する場合には、環境省令で定めるところにより、当該車両に産業廃棄物収集運搬業者である旨及び許可番号を表示すること。
      四 産業廃棄物の積替えを行う場合には、積替えを行う場所において産業廃棄物の保管基準に適合するようにすること。
    keywords: ["収集運搬基準", "飛散防止", "密閉容器", "車両表示", "許可番号表示", "積替え保管"]

  - id: "ord_5_2"
    article: "第5条の2"
    title: "特別管理産業廃棄物の収集・運搬基準"
    content: |
      特別管理産業廃棄物の収集又は運搬の基準は、廃棄物の種類に応じて通常の産業廃棄物の基準に加えて次のとおりとする。
      一 廃油（引火点70度未満）：火気を遠ざけること、密封容器での運搬
      二 廃酸・廃アルカリ：耐食性容器での運搬
      三 感染性産業廃棄物：密封容器に収納し、バイオハザードマークを表示すること
      四 廃PCB等：PCBが漏出しないよう密封した容器での運搬
    keywords: ["特別管理産業廃棄物収集運搬基準", "廃油引火点", "感染性廃棄物", "バイオハザードマーク", "廃PCB運搬"]

  - id: "ord_6_2"
    article: "第6条の2"
    title: "埋立処分の基準"
    content: |
      産業廃棄物の埋立処分の基準は次のとおりとする。
      一 安定型産業廃棄物以外のものを安定型最終処分場において処分しないこと。
      二 安定型最終処分場においては、廃棄物の展開検査を行い、安定型産業廃棄物以外のものが混入していないことを確認すること。
      三 管理型最終処分場においては、廃棄物の埋立地からの浸出液による公共水域及び地下水の汚染を防止するため、遮水工を設け、浸出液処理設備を設置すること。
      四 遮断型最終処分場においては、外部の水が廃棄物に接触しないよう、かつ廃棄物が外部に流出しないよう設計されていること。
    keywords: ["埋立処分基準", "展開検査", "安定型", "管理型", "遮水工", "浸出液処理"]

  - id: "ord_8_4_1"
    article: "第8条の4の1"
    title: "多量排出事業者の処理計画"
    content: |
      前年度の産業廃棄物の発生量が1000トン以上（特別管理産業廃棄物にあっては50トン以上）の事業場を設置している事業者（多量排出事業者）は、当該事業場に係る産業廃棄物の減量その他その処理に関する計画（産業廃棄物処理計画）を作成し、都道府県知事に提出しなければならない。また、その実施状況を毎年度都道府県知事に報告しなければならない。
    keywords: ["多量排出事業者", "産業廃棄物処理計画", "1000トン以上", "50トン以上", "年度報告"]
