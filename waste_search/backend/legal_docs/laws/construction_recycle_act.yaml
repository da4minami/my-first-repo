title: "建設工事に係る資材の再資源化等に関する法律"
short_title: "建設リサイクル法"
law_number: "平成12年法律第104号"
last_amended: "令和4年法律第68号"
category: "法律"
sections:
  - id: "constr_1"
    article: "第1条"
    title: "目的"
    content: |
      この法律は、特定の建設資材について、その分別解体等及び再資源化等を促進するための措置を講ずるとともに、解体工事業者について登録制度を実施すること等により、再生資源の十分な利用及び廃棄物の減量等を通じて、資源の有効な利用の確保及び廃棄物の適正な処理を図り、もって生活環境の保全及び国民経済の健全な発展に寄与することを目的とする。
    keywords: ["建設リサイクル法", "目的", "分別解体", "再資源化"]

  - id: "constr_2"
    article: "第2条"
    title: "定義（特定建設資材）"
    content: |
      この法律において「特定建設資材」とは、コンクリート、コンクリート及び鉄から成る建設資材、木材、アスファルト・コンクリートをいう。
      「分別解体等」とは、建築物等に用いられた建設資材に係る建設廃棄物を、その種類に従い分別しつつ、建築物等を解体する作業及びその他の作業をいう。
    keywords: ["特定建設資材", "コンクリート", "木材", "アスファルトコンクリート", "分別解体"]

  - id: "constr_9"
    article: "第9条"
    title: "分別解体等の実施義務（対象建設工事）"
    content: |
      対象建設工事（特定建設資材を用いた建築物等に係る解体工事で政令で定める規模のもの）の受注者又は自主施工者は、正当な理由がある場合を除き、分別解体等をしなければならない。
      対象建設工事の規模基準：
      一 建築物の解体工事：床面積80平方メートル以上
      二 建築物の新築・増築工事：床面積500平方メートル以上
      三 建築物の修繕・模様替等の工事（リフォーム等）：請負代金1億円以上
      四 建築物以外のものの解体工事・新築工事等：請負代金500万円以上
    keywords: ["分別解体義務", "対象建設工事", "規模基準", "80平方メートル", "500平方メートル"]

  - id: "constr_10"
    article: "第10条"
    title: "工事の事前届出"
    content: |
      対象建設工事の発注者又は自主施工者は、工事に着手する日の7日前までに、次に掲げる事項を都道府県知事に届け出なければならない。
      一 工事の種別
      二 工事に係る建築物等の構造
      三 工事着手の時期及び工程の概要
      四 分別解体等の計画
      五 解体工事に用いる機械の種類及び能力
    keywords: ["事前届出", "7日前", "都道府県知事", "分別解体計画"]

  - id: "constr_16"
    article: "第16条"
    title: "再資源化等の義務"
    content: |
      対象建設工事の受注者は、分別解体等をして生じた特定建設資材廃棄物について、再資源化をしなければならない。ただし、特定建設資材廃棄物の再資源化に要する費用が、特定建設資材廃棄物を再資源化することによって得られる収益から当該費用を控除した額が零を下回る場合においては、縮減すれば足りる。
    keywords: ["再資源化義務", "特定建設資材廃棄物", "縮減"]

  - id: "constr_21"
    article: "第21条"
    title: "解体工事業者の登録"
    content: |
      建設業法第3条第1項の許可を受けた建設業者（建設業許可業者）でない者は、解体工事業を営もうとするときは、その解体工事を施工しようとする区域を管轄する都道府県知事の登録を受けなければならない。
    keywords: ["解体工事業者登録", "都道府県知事", "建設業許可との関係"]
