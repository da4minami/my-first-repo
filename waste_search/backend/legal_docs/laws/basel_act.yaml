title: "特定有害廃棄物等の輸出入等の規制に関する法律"
short_title: "バーゼル法"
law_number: "平成4年法律第108号"
last_amended: "令和4年法律第68号"
category: "法律"
sections:
  - id: "basel_1"
    article: "第1条"
    title: "目的"
    content: |
      この法律は、有害廃棄物の国境を越える移動及びその処分の規制に関するバーゼル条約の的確な実施を確保するため、特定有害廃棄物等の輸出入及び国内における移動等について規制を設けることにより、特定有害廃棄物等による環境の汚染を防止し、もって人の健康の保護及び生活環境の保全に資することを目的とする。
    keywords: ["バーゼル法", "バーゼル条約", "有害廃棄物国際移動", "輸出入規制"]

  - id: "basel_4"
    article: "第4条"
    title: "特定有害廃棄物等の輸出の規制"
    content: |
      特定有害廃棄物等を輸出しようとする者は、経済産業大臣及び環境大臣の確認を受けなければならない。確認申請には、輸出先国の同意書、廃棄物の種類・数量・処理方法等を記載した書類が必要である。また、輸出先国の国内法令で禁止されている場合は輸出できない。
    keywords: ["特定有害廃棄物輸出", "経済産業大臣確認", "環境大臣確認", "輸出先国同意"]

  - id: "basel_5"
    article: "第5条"
    title: "特定有害廃棄物等の輸入の規制"
    content: |
      特定有害廃棄物等を輸入しようとする者は、経済産業大臣及び環境大臣の確認を受けなければならない。外国から輸入された廃棄物の国内処理には廃棄物処理法が適用される。
    keywords: ["特定有害廃棄物輸入", "確認申請", "廃棄物処理法適用"]

  - id: "basel_toxic_list"
    article: "政令別表"
    title: "特定有害廃棄物等の種類"
    content: |
      バーゼル法の規制対象となる特定有害廃棄物等の主な種類：
      一 廃シアン化合物
      二 廃石綿（アスベスト）
      三 廃水銀及びその化合物
      四 廃ポリ塩化ビフェニル（廃PCB）
      五 廃有機ハロゲン化合物（廃農薬等含む）
      六 廃油（特定のもの）
      七 廃酸・廃アルカリ（特定のもの）
      八 セレン化合物を含む廃棄物
      九 カドミウム化合物を含む廃棄物
      十 テルル化合物を含む廃棄物
    keywords: ["特定有害廃棄物の種類", "廃石綿", "廃PCB", "廃水銀", "廃農薬", "カドミウム"]
