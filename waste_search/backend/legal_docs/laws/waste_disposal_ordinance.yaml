title: "廃棄物の処理及び清掃に関する法律施行令"
short_title: "廃棄物処理法施行令"
law_number: "昭和46年政令第300号"
last_amended: "令和4年政令第247号"
category: "政令"
sections:
  - id: "ord_2"
    article: "第2条"
    title: "産業廃棄物の種類（法第2条第4項第1号）"
    content: |
      法第2条第4項第一号の政令で定める廃棄物は、次のとおりとする。
      一 燃え殻
      二 汚泥
      三 廃油（廃ポリ塩化ビフェニル等を除く。）
      四 廃酸
      五 廃アルカリ
      六 廃プラスチック類（合成繊維くずを含む。）
      七 ゴムくず
      八 金属くず
      九 ガラスくず、コンクリートくず（工作物の新築、改築又は除去に伴って生じたものを除く。）及び陶磁器くず
      十 鉱さい
      十一 がれき類（工作物の新築、改築又は除去に伴って生じたコンクリートの破片その他これに類する不要物をいう。）
      十二 ばいじん（大気汚染防止法第2条第2項に規定するばい煙発生施設において発生するばいじんであって、集じん施設によって集められたものをいう。）
      十三 第1号から第12号まで及び次号に掲げる廃棄物（特別管理産業廃棄物であるものを除く。）を処分するために処理したものであって、これらに該当しないもの
      十四 輸入された廃棄物
      十五 木くず
      十六 繊維くず
      十七 動植物性残さ
      十八 動物系固形不要物
      十九 動物のふん尿
      二十 動物の死体
      二十一 政令で定める産業廃棄物（産業廃棄物の種類のまとめ）
    keywords: ["産業廃棄物の種類", "燃え殻", "汚泥", "廃油", "廃酸", "廃アルカリ", "廃プラスチック", "ゴムくず", "金属くず", "ガラスくず", "鉱さい", "がれき類", "ばいじん", "木くず", "繊維くず", "動植物性残さ"]

  - id: "ord_2_4"
    article: "第2条の4"
    title: "特別管理産業廃棄物の種類"
    content: |
      法第2条第5項の政令で定める産業廃棄物は、次のとおりとする。
      一 廃油（廃ポリ塩化ビフェニル等、廃油（揮発油類、灯油類及び軽油類に限る。次号において同じ。）及びその他の廃油（引火点が70度未満のものに限る。）
      二 廃酸（pHが2.0以下のもの）
      三 廃アルカリ（pHが12.5以上のもの）
      四 感染性産業廃棄物（医療機関等から生ずる廃棄物のうち感染性病原体が含まれ、若しくは付着しているおそれのあるもの）
      五 廃ポリ塩化ビフェニル等（廃PCB及びPCBを含む廃油）
      六 ポリ塩化ビフェニル汚染物（PCBが染み込んだもの又は付着したもの）
      七 ポリ塩化ビフェニル処理物
      八 廃水銀等（廃水銀及び廃水銀化合物）
      九 特定有害産業廃棄物（指定廃棄物等）
    keywords: ["特別管理産業廃棄物", "感染性廃棄物", "PCB", "廃水銀", "廃油引火点"]

  - id: "ord_6"
    article: "第6条"
    title: "産業廃棄物処理施設（法第15条）"
    content: |
      法第15条第1項の政令で定める産業廃棄物処理施設は、次のとおりとする。
      一 汚泥の脱水施設であって、一日当たりの処理能力が10立方メートルを超えるもの
      二 汚泥の乾燥施設であって、一日当たりの処理能力が10立方メートル（天日乾燥施設にあっては、100立方メートル）を超えるもの
      三 汚泥の焼却施設
      四 廃油の油水分離施設であって、一日当たりの処理能力が10立方メートルを超えるもの
      五 廃油の焼却施設
      六 廃酸又は廃アルカリの中和施設であって、一日当たりの処理能力が50立方メートルを超えるもの
      七 廃プラスチック類の破砕施設であって、一日当たりの処理能力が5トンを超えるもの
      八 廃プラスチック類の焼却施設
      九 木くず又はがれき類の破砕施設であって、一日当たりの処理能力が5トンを超えるもの
      十 産業廃棄物の焼却施設（第3号、第5号及び第8号に掲げるものを除く。）
      十一 産業廃棄物の最終処分場
    keywords: ["処理施設", "設置許可対象", "汚泥脱水", "焼却施設", "最終処分場", "処理能力"]

  - id: "ord_7"
    article: "第7条"
    title: "特定施設"
    content: |
      産業廃棄物の最終処分場の種類は次のとおりとする。
      一 安定型処分場（廃プラスチック類、ゴムくず、金属くず、ガラスくず・コンクリートくず・陶磁器くず、がれき類のみを埋立）
      二 管理型処分場（安定型処分場に持ち込めない産業廃棄物を埋立）
      三 遮断型処分場（有害物質を含む産業廃棄物を埋立）
    keywords: ["最終処分場", "安定型", "管理型", "遮断型", "埋立"]
