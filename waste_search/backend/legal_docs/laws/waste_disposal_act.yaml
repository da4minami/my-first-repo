title: "廃棄物の処理及び清掃に関する法律"
short_title: "廃棄物処理法"
law_number: "昭和45年法律第137号"
last_amended: "令和4年法律第68号"
category: "法律"
sections:
  - id: "law_1_1"
    article: "第1条"
    title: "目的"
    content: |
      この法律は、廃棄物の排出を抑制し、及び廃棄物の適正な分別、保管、収集、運搬、再生、処分等の処理をし、並びに生活環境を清潔にすることにより、生活環境の保全及び公衆衛生の向上を図ることを目的とする。
    keywords: ["目的", "廃棄物処理", "生活環境", "公衆衛生"]

  - id: "law_1_2"
    article: "第2条"
    title: "定義"
    content: |
      第2条 この法律において「廃棄物」とは、ごみ、粗大ごみ、燃え殻、汚泥、ふん尿、廃油、廃酸、廃アルカリ、動物の死体その他の汚物又は不要物であって、固形状又は液状のもの（放射性物質及びこれによって汚染された物を除く。）をいう。
      2 この法律において「一般廃棄物」とは、産業廃棄物以外の廃棄物をいう。
      3 この法律において「特別管理一般廃棄物」とは、一般廃棄物のうち、爆発性、毒性、感染性その他の人の健康又は生活環境に係る被害を生ずるおそれがある性状を有するものとして政令で定めるものをいう。
      4 この法律において「産業廃棄物」とは、次に掲げる廃棄物をいう。
      一 事業活動に伴って生じた廃棄物のうち、燃え殻、汚泥、廃油、廃酸、廃アルカリ、廃プラスチック類その他政令で定める廃棄物
      二 輸入された廃棄物（前号に掲げる廃棄物、船舶及び航空機の航行に伴い生ずる廃棄物（政令で定めるものに限る。第15条の4の5第1項において「航行廃棄物」という。）並びに本邦に入国する者が携帯する廃棄物を除く。）
      5 この法律において「特別管理産業廃棄物」とは、産業廃棄物のうち、爆発性、毒性、感染性その他の人の健康又は生活環境に係る被害を生ずるおそれがある性状を有するものとして政令で定めるものをいう。
      6 この法律において「電子マニフェスト」とは、第12条の5第1項に規定する電子情報処理組織をいう。
    keywords: ["廃棄物の定義", "一般廃棄物", "産業廃棄物", "特別管理廃棄物", "定義"]

  - id: "law_3"
    article: "第3条"
    title: "事業者の責務"
    content: |
      第3条 事業者は、その事業活動に伴って生じた廃棄物を自らの責任において適正に処理しなければならない。
      2 事業者は、その事業活動に伴って生じた廃棄物の再生利用等を行うことによりその減量に努めるとともに、物の製造、加工、販売等に際して、その製品、容器等が廃棄物となった場合における処理の困難性についてあらかじめ自ら評価し、適正な処理が困難にならないような製品、容器等の開発を行うこと、その製品、容器等に係る廃棄物の適正な処理の方法についての情報を提供すること等により、その製品、容器等が廃棄物となった場合においてその適正な処理が確保されるように努めなければならない。
      3 事業者は、前二項に定めるもののほか、廃棄物の減量その他その適正な処理の実施に関し国及び地方公共団体の施策に協力しなければならない。
    keywords: ["事業者責務", "適正処理", "排出事業者責任"]

  - id: "law_11"
    article: "第11条"
    title: "産業廃棄物の処理"
    content: |
      第11条 事業者は、その産業廃棄物を自ら処理しなければならない。
      2 都道府県は、産業廃棄物の適正な処理を確保するため必要があると認めるときは、当該産業廃棄物を処理することができる。
      3 市町村は、単独に又は共同して、一般廃棄物とあわせて処理することができる産業廃棄物その他市町村が処理することが適当であると認める産業廃棄物を処理することができる。
    keywords: ["産業廃棄物処理", "自己処理", "事業者責任"]

  - id: "law_12"
    article: "第12条"
    title: "産業廃棄物の保管・処理基準"
    content: |
      第12条 事業者は、その産業廃棄物が運搬されるまでの間、環境省令で定める技術上の基準（以下「産業廃棄物保管基準」という。）に従い、生活環境の保全上支障のないようにこれを保管しなければならない。
      2 事業者は、その産業廃棄物を処分するために産業廃棄物処理業者その他環境省令で定める者に委託する場合には、環境省令で定める基準（以下「産業廃棄物処理委託基準」という。）に従わなければならない。
      3 事業者は、産業廃棄物の処分を他人に委託する場合には、産業廃棄物の収集又は運搬を業として行う者（以下「産業廃棄物収集運搬業者」という。）に対し、収集又は運搬に係る産業廃棄物の種類及び数量、収集又は運搬の方法その他の事項を書面又は電磁的方法により通知しなければならない。
      4 事業者は、その産業廃棄物の処理を他人に委託する場合には、その処理が適正に行われるために必要な措置を講ずるよう努めなければならない。
    keywords: ["保管基準", "委託基準", "委託処理", "マニフェスト"]

  - id: "law_12_3"
    article: "第12条の3"
    title: "産業廃棄物管理票（マニフェスト）"
    content: |
      第12条の3 事業者（中間処理業者を含む。以下この条及び次条において同じ。）は、産業廃棄物（特別管理産業廃棄物を除く。以下この条において同じ。）の運搬又は処分を他人に委託する場合には、環境省令で定めるところにより、当該委託に係る産業廃棄物の引渡しと同時に当該産業廃棄物の運搬を受託した者（以下「受託運搬者」という。）に対し産業廃棄物管理票（以下「管理票」という。）を交付しなければならない。
      2 産業廃棄物の収集若しくは運搬又は処分を業として行う者は、前項の規定により管理票の交付を受けたときは、環境省令で定めるところにより、当該管理票に必要事項を記載した後、環境省令で定める期間内に、当該管理票の写しを当該管理票を交付した者（以下「交付者」という。）に送付しなければならない。
    keywords: ["マニフェスト", "産業廃棄物管理票", "委託", "交付"]

  - id: "law_14"
    article: "第14条"
    title: "産業廃棄物処理業の許可"
    content: |
      第14条 産業廃棄物（特別管理産業廃棄物を除く。以下この条から第14条の3の3まで、第25条第1項第六号及び第七号、第26条第三号、第31条第一号並びに別表第二において同じ。）の収集又は運搬を業として行おうとする者は、当該業を行おうとする区域（運搬のみを業として行う場合にあっては、産業廃棄物の積卸しを行う区域に限る。）を管轄する都道府県知事の許可を受けなければならない。ただし、事業者（自らその産業廃棄物を運搬する場合に限る。）、専ら資源として有価で取引される物のみの収集又は運搬を業として行う者その他環境省令で定める者については、この限りでない。
      2 前項の許可は、五年ごとにその更新を受けなければ、その効力を失う。
      4 産業廃棄物の処分（再生を含む。以下この条において同じ。）を業として行おうとする者は、その処分を行う事業場の所在地を管轄する都道府県知事の許可を受けなければならない。ただし、事業者（自らその産業廃棄物を処分する場合に限る。）、専ら資源として有価で取引される物のみの処分を業として行う者その他環境省令で定める者については、この限りでない。
    keywords: ["許可", "産業廃棄物処理業", "収集運搬業", "処分業", "都道府県知事"]

  - id: "law_14_4"
    article: "第14条の4"
    title: "特別管理産業廃棄物処理業の許可"
    content: |
      第14条の4 特別管理産業廃棄物の収集又は運搬を業として行おうとする者は、当該業を行おうとする区域（運搬のみを業として行う場合にあっては、特別管理産業廃棄物の積卸しを行う区域に限る。）を管轄する都道府県知事の許可を受けなければならない。
    keywords: ["特別管理産業廃棄物", "許可", "収集運搬業", "処分業"]

  - id: "law_15"
    article: "第15条"
    title: "産業廃棄物処理施設の設置許可"
    content: |
      第15条 産業廃棄物処理施設（廃プラスチック類処理施設、産業廃棄物の最終処分場その他の産業廃棄物の処理施設で政令で定めるものをいう。以下同じ。）を設置しようとする者は、当該産業廃棄物処理施設を設置しようとする地を管轄する都道府県知事の許可を受けなければならない。
    keywords: ["処理施設", "設置許可", "最終処分場", "都道府県知事"]

  - id: "law_16"
    article: "第16条"
    title: "廃棄物の投棄禁止"
    content: |
      第16条 何人も、みだりに廃棄物を捨ててはならない。
    keywords: ["不法投棄", "投棄禁止", "廃棄物"]

  - id: "law_19_5"
    article: "第19条の5"
    title: "措置命令"
    content: |
      第19条の5 産業廃棄物処理基準（特別管理産業廃棄物にあっては、特別管理産業廃棄物処理基準）に適合しない産業廃棄物の処分（略）が行われた場合において、生活環境の保全上支障が生じ、又は生ずるおそれがあると認められるときは、都道府県知事は、必要な限度において、次に掲げる者に対し、期限を定めて、その支障の除去等の措置を講ずることを命ずることができる。
      一 当該処分を行った者
      二 当該処分を他人に委託した事業者
      三 当該処分に係る産業廃棄物を他人に処分させた産業廃棄物処理業者
    keywords: ["措置命令", "行政処分", "支障除去", "不法投棄対策"]

  - id: "law_25"
    article: "第25条"
    title: "罰則"
    content: |
      第25条 次の各号のいずれかに該当する者は、五年以下の懲役若しくは千万円以下の罰金に処し、又はこれを併科する。
      一 第六条の二第一項若しくは第二項の規定に違反して一般廃棄物を捨てた者
      二 第六条の二第一項の規定に違反して一般廃棄物処理施設を設置した者
      四 第12条第1項の産業廃棄物保管基準に違反して産業廃棄物を保管した者
      六 第14条第1項の許可を受けないで、産業廃棄物の収集若しくは運搬又は処分を業として行った者
      七 第14条の4第1項の許可を受けないで、特別管理産業廃棄物の収集若しくは運搬又は処分を業として行った者
      十四 第16条の規定に違反して廃棄物を捨てた者
    keywords: ["罰則", "懲役", "罰金", "不法投棄", "無許可業者"]
