title: "土壌汚染対策法"
short_title: "土壌汚染対策法"
law_number: "平成14年法律第53号"
last_amended: "令和4年法律第68号"
category: "法律"
sections:
  - id: "soil_1"
    article: "第1条"
    title: "目的"
    content: |
      この法律は、土壌の特定有害物質による汚染の状況の把握に関する措置及びその汚染による人の健康に係る被害の防止に関する措置を定めること等により、土壌汚染対策の実施を図り、もって国民の健康を保護することを目的とする。
    keywords: ["土壌汚染対策法", "目的", "特定有害物質", "健康保護"]

  - id: "soil_2"
    article: "第2条"
    title: "定義（特定有害物質）"
    content: |
      この法律において「特定有害物質」とは、鉛、砒素、トリクロロエチレンその他の物質（放射性物質を除く。）であって、それが土壌に含まれることに起因して人の健康に係る被害を生ずるおそれがあるものとして政令で定めるものをいう。
      特定有害物質には、第一種（揮発性有機化合物、クロロエチレン等）、第二種（重金属等、鉛・砒素・六価クロム等）、第三種（農薬等、シマジン・チウラム等）がある。
    keywords: ["特定有害物質", "鉛", "砒素", "トリクロロエチレン", "重金属", "揮発性有機化合物"]

  - id: "soil_3"
    article: "第3条"
    title: "土壌汚染状況調査（形質変更時要届出区域指定前）"
    content: |
      有害物質使用特定施設（水質汚濁防止法に基づく届出施設）の廃止時には、土地の所有者等は、都道府県知事に土壌汚染状況調査の結果を報告しなければならない。
      また、一定面積（3,000平方メートル）以上の土地の形質変更（掘削等）を行う際も、都道府県知事への届出が必要であり、知事は土壌汚染のおそれが高いと認める場合は調査を命じることができる。
    keywords: ["土壌汚染調査", "有害物質使用特定施設", "廃止時調査", "形質変更", "3000平方メートル"]

  - id: "soil_6"
    article: "第6条"
    title: "要措置区域・形質変更時要届出区域"
    content: |
      都道府県知事は、土壌の汚染状態が環境省令で定める基準に適合しないと認める場合には、当該土地を「要措置区域」（汚染による健康被害が生ずるおそれがある区域）又は「形質変更時要届出区域」（健康被害が生ずるおそれがない区域）として指定する。
      要措置区域の所有者等は、知事から期限を定めて汚染の除去等の措置を命じられる場合がある。
    keywords: ["要措置区域", "形質変更時要届出区域", "指定", "汚染除去命令"]

  - id: "soil_11"
    article: "第11条"
    title: "形質変更の届出"
    content: |
      形質変更時要届出区域内において土地の形質の変更をしようとする者は、当該形質の変更に係る工事に着手しようとする日の14日前までに、都道府県知事に届け出なければならない。
    keywords: ["形質変更届出", "14日前", "都道府県知事", "形質変更時要届出区域"]

  - id: "soil_waste_relation"
    article: "廃棄物処理法との関係"
    title: "土壌汚染対策法と廃棄物処理法の関係"
    content: |
      廃棄物処理法違反（不法投棄等）により土壌が汚染された場合、土壌汚染対策法も同時に適用される場合がある。廃棄物の不適正処理が原因で特定有害物質が土壌に浸透した場合、廃棄物処理法に基づく措置命令（第19条の5）に加えて、土壌汚染対策法に基づく調査命令・措置命令が発令される場合がある。
    keywords: ["廃棄物処理法との関係", "不法投棄", "土壌汚染", "措置命令"]
