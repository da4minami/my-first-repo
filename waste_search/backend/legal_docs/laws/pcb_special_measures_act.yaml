title: "ポリ塩化ビフェニル廃棄物の適正な処理の推進に関する特別措置法"
short_title: "PCB廃棄物処理特別措置法"
law_number: "平成13年法律第65号"
last_amended: "令和4年法律第68号"
category: "法律"
sections:
  - id: "pcb_1"
    article: "第1条"
    title: "目的"
    content: |
      この法律は、PCB廃棄物の保管及び処分の状況等に関する情報を把握するとともに、PCB廃棄物の確実かつ適正な処理を推進するために必要な措置を講じ、もってPCBによる環境の汚染を防止し、及び国民の健康の保護等を図ることを目的とする。
    keywords: ["PCB廃棄物", "目的", "適正処理", "環境汚染防止"]

  - id: "pcb_2"
    article: "第2条"
    title: "定義"
    content: |
      この法律において「PCB廃棄物」とは、廃棄物の処理及び清掃に関する法律第2条第5項の特別管理産業廃棄物のうち、廃ポリ塩化ビフェニル等及びポリ塩化ビフェニル汚染物をいう。
      「高濃度PCB廃棄物」とは、PCB廃棄物のうち廃PCBその他PCBの濃度が環境省令で定める値以上であるもの（政令で定めるものを除く。）をいう。
      「低濃度PCB廃棄物」とは、PCB廃棄物のうち高濃度PCB廃棄物以外のものをいう。
    keywords: ["PCB廃棄物の定義", "高濃度PCB", "低濃度PCB", "廃ポリ塩化ビフェニル"]

  - id: "pcb_8"
    article: "第8条"
    title: "PCB廃棄物の保管・処分状況の届出"
    content: |
      PCB廃棄物を保管する事業者及びPCB廃棄物の処分を業として行う者は、毎年度、当該PCB廃棄物の保管の状況及び当該PCB廃棄物の処分の状況に関し、環境省令で定めるところにより、都道府県知事に届け出なければならない。
    keywords: ["PCB届出義務", "保管状況届出", "年度報告", "都道府県知事"]

  - id: "pcb_10"
    article: "第10条"
    title: "処分期限"
    content: |
      PCB廃棄物の保管事業者は、その保管するPCB廃棄物を、廃棄物の処理及び清掃に関する法律第15条の4の4第1項に規定する無害化処理認定施設において処分しなければならない。高濃度PCB廃棄物については、令和9年3月31日（変圧器・コンデンサ等）、低濃度PCB廃棄物については、令和9年3月31日までに処分しなければならない。
    keywords: ["PCB処分期限", "令和9年3月31日", "高濃度PCB", "低濃度PCB", "JESCO"]

  - id: "pcb_13"
    article: "第13条"
    title: "PCB廃棄物処分等措置命令"
    content: |
      都道府県知事は、PCB廃棄物の保管事業者が処分期限を経過した後においてもPCB廃棄物を保管しているときは、その者に対し、期限を定めて、当該PCB廃棄物の処分その他の必要な措置をとることを命じなければならない。
    keywords: ["PCB措置命令", "処分期限超過", "都道府県知事命令"]
