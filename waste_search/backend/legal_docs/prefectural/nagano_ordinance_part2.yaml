title: "長野県廃棄物の処理及び清掃に関する条例（続編）"
short_title: "長野県廃棄物処理条例（第2部）"
law_number: "昭和47年長野県条例第31号"
last_amended: "令和4年長野県条例第44号"
category: "条例"
prefecture: "長野県"
sections:
  - id: "nag_ord_5"
    article: "第5条"
    title: "一般廃棄物の処理の基準"
    content: |
      長野県内の市町村は、廃棄物処理法第6条の2第2項に規定する一般廃棄物処理基準に従い、一般廃棄物の収集・運搬・処分を行わなければならない。市町村は、一般廃棄物処理計画を3年ごとに見直し、必要な改定を行うものとする。
    keywords: ["一般廃棄物処理基準", "市町村責務", "長野県", "処理計画見直し"]

  - id: "nag_ord_8"
    article: "第8条"
    title: "適正処理困難物の指定"
    content: |
      長野県知事は、廃棄物処理法第6条の3の規定に基づき、適正処理困難物を指定し、その処理に関する基準を定めることができる。指定された適正処理困難物については、その製造・販売業者等は当該物の回収及び処理に協力しなければならない。
    keywords: ["適正処理困難物", "長野県知事指定", "製造業者回収協力"]

  - id: "nag_ord_12"
    article: "第12条"
    title: "多量排出事業者に対する指導"
    content: |
      長野県知事は、産業廃棄物の発生量が政令で定める量以上の事業場を設置する事業者（多量排出事業者）に対し、産業廃棄物処理計画の作成・実施及び報告を求めるとともに、必要に応じてその改善について指導・助言を行う。多量排出事業者は、発生量の削減及び再生利用の促進について目標を定め、その達成に努めなければならない。
    keywords: ["多量排出事業者指導", "長野県", "処理計画", "削減目標"]

  - id: "nag_ord_13"
    article: "第13条"
    title: "産業廃棄物処理業者への指導・監督"
    content: |
      知事は、産業廃棄物処理業者の許可の更新時における審査において、過去の処理実績・マニフェストの管理状況・施設の維持管理状況等を総合的に審査し、適正な処理が行われていないと認められる者については、条件を付した許可又は許可の更新拒否を行うことができる。
    keywords: ["処理業者指導", "許可更新審査", "条件付許可", "更新拒否", "長野県"]

  - id: "nag_ord_16"
    article: "第16条"
    title: "産業廃棄物処理施設の設置に係る住民への周知"
    content: |
      産業廃棄物処理施設の設置を計画する者は、設置許可申請前に次の措置を講じなければならない。
      一 施設の設置に関する計画書を市町村及び周辺住民に配布し、計画の概要を説明すること
      二 説明会を開催し、周辺住民等の意見を聞くこと
      三 意見に対する回答書を作成し、申請書に添付すること
      知事は、説明会の実施状況及び意見への対応が不十分と認めるときは、再度の説明会の開催を求めることができる。
    keywords: ["住民への周知義務", "説明会開催", "長野県", "施設設置", "意見聴取"]

  - id: "nag_ord_18"
    article: "第18条"
    title: "不適正処理に係る排出事業者への指導"
    content: |
      知事は、排出事業者が廃棄物処理法の委託基準に違反して産業廃棄物の処理を委託し、その結果として不適正処理が生じたと認められるときは、当該排出事業者に対して改善指導を行い、必要に応じて廃棄物処理法第19条の5に基づく措置命令を発する。また、排出事業者責任を明確にするため、再発防止策の提出を求める。
    keywords: ["排出事業者指導", "委託基準違反", "措置命令", "再発防止策", "長野県"]

  - id: "nag_ord_22"
    article: "第22条"
    title: "廃棄物の野外焼却の禁止"
    content: |
      廃棄物処理法第16条の2の規定に基づき、廃棄物を焼却炉以外の施設で焼却すること（野外焼却・露天焼却・いわゆる「野焼き」）は原則として禁止される。ただし、次に掲げる場合は例外として認められる。
      一 農業者が行う農業上やむを得ない焼却（刈り草、わら等の焼却）
      二 たき火その他日常生活を営む上で通常行われる焼却（焚き火等）で軽微なもの
      三 落ち葉・草木の焼却で風習上行われてきたもの
      ただし、長野県内においては煙による周辺生活環境への影響が懸念される場合には、地域の実情に応じて市町村が独自に規制を行うことができる。
    keywords: ["野外焼却禁止", "野焼き禁止", "例外事項", "農業上焼却", "長野県"]

  - id: "nag_ord_27"
    article: "第27条"
    title: "長野県廃棄物審議会"
    content: |
      知事の附属機関として長野県廃棄物審議会を設置し、廃棄物の処理に関する重要事項について調査・審議を行う。審議会は委員（学識経験者・事業者代表・住民代表等）で構成される。主要な産業廃棄物処理施設の設置許可に際しては審議会の意見を聴くものとする。
    keywords: ["廃棄物審議会", "長野県附属機関", "学識経験者", "施設設置許可審議"]
