title: "長野県廃棄物の処理及び清掃に関する条例"
short_title: "長野県廃棄物処理条例"
law_number: "昭和47年長野県条例第31号"
last_amended: "令和4年長野県条例第44号"
category: "条例"
prefecture: "長野県"
sections:
  - id: "nag_ord_1"
    article: "第1条"
    title: "目的"
    content: |
      この条例は、廃棄物の処理及び清掃に関する法律（昭和45年法律第137号。以下「法」という。）の施行に関し必要な事項を定めるとともに、廃棄物の発生の抑制及び廃棄物の適正な処理を推進することにより、生活環境の保全及び公衆衛生の向上に資することを目的とする。
    keywords: ["目的", "長野県", "廃棄物処理条例"]

  - id: "nag_ord_3"
    article: "第3条"
    title: "県民・事業者の責務"
    content: |
      県民は、廃棄物の発生を抑制し、廃棄物を自ら適正に処理するよう努めなければならない。
      2 事業者は、その事業活動に伴って生じた廃棄物を自らの責任において適正に処理しなければならない。また、再生利用等による廃棄物の減量化に積極的に取り組まなければならない。
      3 事業者は、製品、容器等が廃棄物となった場合の処理の困難性の自己評価及び適正な処理の方法の情報提供に努めなければならない。
    keywords: ["事業者責務", "県民責務", "適正処理", "長野県"]

  - id: "nag_ord_10"
    article: "第10条"
    title: "産業廃棄物処理業者の遵守事項"
    content: |
      産業廃棄物収集運搬業者及び産業廃棄物処分業者（以下「産業廃棄物処理業者」という。）は、次に掲げる事項を遵守しなければならない。
      一 許可の内容に従って事業を行うこと。
      二 処理基準に適合した処理を行うこと。
      三 収集した産業廃棄物の種類及び数量を記録し、3年間保存すること。
      四 事業の廃止、休止、再開の際は速やかに届け出ること。
      五 その他知事が必要と認める事項。
    keywords: ["処理業者遵守事項", "記録保存", "届出", "長野県"]

  - id: "nag_ord_15"
    article: "第15条"
    title: "産業廃棄物処理施設の設置の事前相談"
    content: |
      産業廃棄物処理施設を設置しようとする者は、その設置を計画する段階において、あらかじめ知事に相談するものとする。
      2 知事は、前項の相談を受けたときは、設置に関して必要な事項について助言するものとする。
      3 産業廃棄物処理施設を設置しようとする者は、施設の設置に係る許可申請書の提出に先立ち、周辺住民及び関係市町村に対して計画の概要を説明しなければならない。
    keywords: ["施設設置", "事前相談", "住民説明", "長野県"]

  - id: "nag_ord_20"
    article: "第20条"
    title: "不適正処理に係る措置"
    content: |
      知事は、産業廃棄物の処理基準に違反する処理が行われ、生活環境の保全上支障が生じ、又は生ずるおそれがあると認めるときは、当該違反行為をした者に対して、必要な措置を命ずることができる。
      2 前項の措置を命ずるに当たっては、当該措置の内容、履行期限その他必要な事項を書面により通知しなければならない。
    keywords: ["措置命令", "長野県", "不適正処理", "行政処分"]

  - id: "nag_ord_25"
    article: "第25条"
    title: "報告及び立入検査"
    content: |
      知事は、廃棄物の適正な処理を確保するため必要があると認めるときは、産業廃棄物処理業者その他関係者に対して、廃棄物の処理状況等に関して報告を求め、又はその職員に立入検査を行わせることができる。
    keywords: ["立入検査", "報告徴収", "長野県", "産業廃棄物"]
