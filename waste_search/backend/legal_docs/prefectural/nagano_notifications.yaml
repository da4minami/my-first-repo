title: "長野県産業廃棄物行政に係る通知・通達集"
category: "県通知"
prefecture: "長野県"
sections:
  - id: "nag_not_001"
    article: "長野県環境部廃棄物対策課通知"
    title: "産業廃棄物処理業の許可申請に関する取扱いについて"
    issued_by: "長野県環境部廃棄物対策課"
    issued_date: "令和2年"
    content: |
      長野県における産業廃棄物処理業の許可申請の手続きについて。収集運搬業及び処分業の申請に必要な書類、申請手数料、審査期間の目安が示された。長野県では申請書の提出先は廃棄物対策課（松本市の環境部）となる。許可証の更新は有効期限の概ね2ヶ月前までに申請すること。また、申請者が欠格要件に該当しないことを証明する書類の提出が求められる。
    keywords: ["許可申請", "長野県", "収集運搬業", "処分業", "申請手続", "廃棄物対策課"]

  - id: "nag_not_002"
    article: "長野県環境部廃棄物対策課通知"
    title: "産業廃棄物の保管に関する指導基準について"
    issued_by: "長野県環境部廃棄物対策課"
    issued_date: "令和3年"
    content: |
      長野県における産業廃棄物の保管に関する指導の基準。法令上の保管基準に加え、長野県独自の指導として、積み上げ高さの制限（壁面からの距離と高さの比の遵守）、掲示板の設置要件の細目、汚水排水の浸透対策について示された。また、大量保管事業者に対する定期報告の要請についても言及されている。
    keywords: ["保管基準", "長野県指導", "積み上げ高さ", "掲示板", "汚水対策"]

  - id: "nag_not_003"
    article: "長野県環境部廃棄物対策課通知"
    title: "廃棄物の不法投棄防止対策について"
    issued_by: "長野県環境部廃棄物対策課"
    issued_date: "令和4年"
    content: |
      長野県における不法投棄防止のための対策について。不法投棄を発見した場合の通報窓口（長野県不法投棄110番）の設置、市町村・警察・環境省との連携体制が示された。発見された不法投棄について、排出者が特定された場合は措置命令を発する。排出者が不明の場合は、廃棄物処理法第19条の5の規定により、処理業者等に対して措置命令を発することを検討する。
    keywords: ["不法投棄", "長野県", "通報窓口", "措置命令", "不法投棄110番"]

  - id: "nag_not_004"
    article: "長野県環境部廃棄物対策課通知"
    title: "産業廃棄物処理施設の設置許可申請に係る取扱いについて"
    issued_by: "長野県環境部廃棄物対策課"
    issued_date: "令和元年"
    content: |
      長野県における産業廃棄物処理施設（焼却施設、最終処分場等）の設置許可申請に関する手続き。事前相談（条例第15条）から申請書提出、審査、許可証交付までの流れ。環境影響評価が必要な施設規模、住民説明会の開催方法、周辺自治体への意見照会の手続き等が示された。
    keywords: ["施設設置許可", "長野県", "事前相談", "環境影響評価", "住民説明会", "手続き"]

  - id: "nag_not_005"
    article: "長野県環境部廃棄物対策課通知"
    title: "電子マニフェストの導入促進について"
    issued_by: "長野県環境部廃棄物対策課"
    issued_date: "令和2年"
    content: |
      電子マニフェスト（JWNET）の導入促進について。多量排出事業者（前年度排出量50トン以上の特別管理産業廃棄物排出事業者）は電子マニフェストの使用が義務付けられていることを周知。長野県内の排出事業者・処理業者の電子マニフェスト普及促進のため、JWNET加入の手続き案内、操作説明会の開催情報が示された。
    keywords: ["電子マニフェスト", "JWNET", "長野県", "多量排出事業者", "導入促進"]

  - id: "nag_not_006"
    article: "長野県環境部廃棄物対策課通知"
    title: "産業廃棄物収集運搬業の更新許可申請の取扱いについて"
    issued_by: "長野県環境部廃棄物対策課"
    issued_date: "令和3年"
    content: |
      産業廃棄物収集運搬業の更新許可申請の手続きについて。有効期間（5年）満了前に更新申請が必要であること、更新申請を怠った場合は許可の失効により無許可業者となること、また、更新申請を行っている間は有効期間が経過しても許可の効力が継続する（みなし許可）ことが説明された。
    keywords: ["更新許可", "有効期間", "5年", "みなし許可", "長野県", "収集運搬業"]
