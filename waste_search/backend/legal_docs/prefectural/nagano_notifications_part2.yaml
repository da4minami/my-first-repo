title: "長野県産業廃棄物行政に係る通知・通達集（第2集）"
category: "県通知"
prefecture: "長野県"
sections:
  - id: "nag_not_007"
    article: "長野県環境部廃棄物対策課通知"
    title: "建設廃棄物の適正処理に係る指導について"
    issued_by: "長野県環境部廃棄物対策課"
    issued_date: "令和3年"
    content: |
      長野県内の建設工事から発生する廃棄物（建設廃棄物）の適正処理について。主な内容：建設リサイクル法に基づく事前届出の徹底（対象建設工事については7日前までの届出）、分別解体の実施、マニフェストの適正交付・管理（建設工事1件ごとにマニフェストを交付し、排出事業者（元請業者）が管理）。建設廃棄物の種類別処理フロー（コンクリート塊・アスファルトコンクリート塊はリサイクル優先、混合廃棄物は分別後処理）。
    keywords: ["建設廃棄物", "長野県指導", "建設リサイクル法", "事前届出", "分別解体", "元請業者責任"]

  - id: "nag_not_008"
    article: "長野県環境部廃棄物対策課通知"
    title: "産業廃棄物の自社運搬（自ら運搬）に係る取扱いについて"
    issued_by: "長野県環境部廃棄物対策課"
    issued_date: "令和2年"
    content: |
      事業者が自らの産業廃棄物を自社の車両で運搬する場合（自社運搬・自己運搬）は、産業廃棄物収集運搬業の許可は不要である。ただし、以下の基準を遵守する必要がある。①産業廃棄物保管基準を遵守して運搬すること（飛散・流出・悪臭防止）②産業廃棄物である旨の表示（車両への表示義務は自社運搬には適用されないが、長野県指導として任意で表示することを推奨）③マニフェストは自社運搬の場合でも、他者に処分を委託する際には必要。なお、複数の事業場の廃棄物を一括して運搬する場合や、グループ会社の廃棄物を運搬する場合は許可が必要になる場合がある。
    keywords: ["自社運搬", "自己運搬", "許可不要", "長野県", "マニフェスト要否", "グループ会社"]

  - id: "nag_not_009"
    article: "長野県環境部廃棄物対策課通知"
    title: "PCB廃棄物の保管・処分状況の届出について（長野県）"
    issued_by: "長野県環境部廃棄物対策課"
    issued_date: "令和4年"
    content: |
      長野県内のPCB廃棄物保管事業者に対する届出指導。PCB廃棄物処理特別措置法第8条に基づき、毎年6月末までに前年度末時点の保管状況を長野県知事に届け出る義務がある。未処理のPCB廃棄物（変圧器・コンデンサ等高濃度PCB廃棄物）については令和9年3月31日までに日本環境安全事業株式会社（JESCO）の北海道事業所・東京事業所・豊田事業所・大阪事業所・北九州事業所のいずれかで処分する必要がある。長野県内の高濃度PCB廃棄物については北海道事業所（室蘭）が担当エリアとなる場合が多い。長野県では無届のPCB廃棄物保管者の把握に取り組んでいる。
    keywords: ["PCB廃棄物届出", "長野県", "毎年6月末", "JESCO", "高濃度PCB処分期限", "令和9年3月31日"]

  - id: "nag_not_010"
    article: "長野県環境部廃棄物対策課通知"
    title: "産業廃棄物処理業者の変更届出に係る取扱いについて"
    issued_by: "長野県環境部廃棄物対策課"
    issued_date: "令和3年"
    content: |
      産業廃棄物処理業者が以下の変更を行う場合の届出手続きを示した通知。①軽微な変更（届出で足りるもの）：役員の変更、事務所の住所変更（事業範囲・処理内容に変更なし）、車両の追加（同種の廃棄物を同じ許可範囲で収集運搬する場合）②許可の変更申請が必要なもの：取り扱う廃棄物の種類の追加、運搬先の追加（積替え保管施設の変更等）、施設の構造・能力の変更。変更届出期限：軽微な変更は変更後30日以内に届出。許可の変更は変更前に申請し許可を受けること。
    keywords: ["変更届出", "軽微な変更", "許可変更申請", "長野県", "30日以内", "役員変更", "車両追加"]

  - id: "nag_not_011"
    article: "長野県環境部廃棄物対策課通知"
    title: "石綿含有廃棄物の適正処理に係る指導について（長野県）"
    issued_by: "長野県環境部廃棄物対策課"
    issued_date: "令和4年"
    content: |
      長野県内における石綿含有廃棄物（アスベスト廃棄物）の適正処理について。大気汚染防止法改正（令和3年4月施行）により、解体等工事を行う前に石綿含有の有無を事前調査し、その結果を都道府県知事（長野県）及び労働基準監督署に届け出る義務がある。長野県内での石綿含有建材の解体作業を行う場合は長野県環境部への届出が必要。石綿含有廃棄物の運搬・処分には廃棄物処理法上の許可が必要であり、管理型又は遮断型最終処分場での処理となる。廃石綿等（飛散性）は特別管理産業廃棄物として特別管理産業廃棄物処分業の許可が必要。
    keywords: ["石綿含有廃棄物", "アスベスト", "長野県", "事前調査届出義務", "令和3年改正", "廃石綿等処理"]

  - id: "nag_not_012"
    article: "長野県環境部廃棄物対策課通知"
    title: "廃棄物処理法に係る行政指導・行政処分の運用方針（長野県）"
    issued_by: "長野県環境部廃棄物対策課"
    issued_date: "令和2年"
    content: |
      長野県における廃棄物処理法違反に対する行政指導・行政処分の運用方針。軽微な違反（初回・是正済み）については改善指導・改善報告徴収が基本。繰り返し違反・悪質な違反については改善命令・事業停止命令・許可取消を段階的に実施。不法投棄については証拠収集の上で刑事告発を含む厳正な対処を行う。排出事業者に対しても、委託基準違反の場合は措置命令の対象となること、排出者責任の徹底を図る。立入検査は定期検査（年1回以上）と不定期検査（苦情・通報等に基づく随時検査）を実施する。
    keywords: ["行政処分運用方針", "長野県", "段階的処分", "刑事告発", "立入検査", "是正指導"]
