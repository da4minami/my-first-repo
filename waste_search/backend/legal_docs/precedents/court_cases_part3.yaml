title: "産業廃棄物行政に係る判例集（第3集）"
category: "判例"
sections:
  - id: "case_012"
    court: "最高裁判所"
    date: "平成18年2月7日"
    case_number: "平成17年（あ）第2251号"
    title: "産業廃棄物の委託基準違反と排出事業者の刑事責任（廃棄物処理法違反）"
    content: |
      【事案】大手食品メーカーが廃棄食品の処分を廃棄物処理業者に委託したところ、当該業者が廃棄食品を第三者に横流し（転売）していたことが発覚した。メーカー側は適法な処分業者に委託していたと主張したが、検察はメーカーの担当者が横流しを黙認・放置していたとして廃棄物処理法違反で起訴した。
      【判旨】最高裁は「排出事業者は廃棄物が適正に処理されているかを確認する責任を負う。委託先処理業者の処理実態について、占有者として相当の注意を払わなかった場合には、廃棄物処理法違反の不作為による共犯が成立し得る」と判示。担当者に有罪判決が確定した。
      【ポイント】排出事業者は委託先の処理が適正に行われているかを確認する義務がある。廃棄物の横流しを知りながら放置した場合は刑事責任を負う。
    keywords: ["廃棄食品横流し", "排出事業者確認義務", "不作為共犯", "廃棄物委託処理監視義務", "食品廃棄物転売", "最高裁平成18年"]

  - id: "case_013"
    court: "最高裁判所"
    date: "平成15年4月11日"
    case_number: "平成14年（オ）第3019号"
    title: "産業廃棄物最終処分場の設置許可処分の取消し（周辺住民の原告適格）"
    content: |
      【事案】都道府県知事が産業廃棄物最終処分場の設置許可を行ったことに対し、処分場から1km以内に居住する周辺住民が許可処分の取消しを求める行政訴訟を提起した。原告（周辺住民）に行政訴訟を提起する資格（原告適格）があるかどうかが争点となった。
      【判旨】最高裁は「廃棄物処理法は、最終処分場の周辺に居住する者の生活環境上の利益を個別的に保護する趣旨を含んでおり、処分場設置許可から生じる騒音・振動・悪臭・地下水汚染等による被害のおそれがある範囲内に居住する者は、許可処分の取消しを求める原告適格を有する」と判示した。
      【ポイント】最終処分場設置許可に対する周辺住民の原告適格を認めた重要判例。許可の合理的な距離内の住民は行政訴訟を提起できる。
    keywords: ["最終処分場設置許可取消", "周辺住民原告適格", "行政訴訟廃棄物処理", "生活環境利益個別保護", "最高裁平成15年", "行政訴訟原告適格"]

  - id: "case_014"
    court: "大阪高等裁判所"
    date: "令和2年11月19日"
    case_number: "令和2年（行コ）第44号"
    title: "優良産廃処理業者認定の取消しの適法性"
    content: |
      【事案】廃棄物処理業者が優良産廃処理業者（廃棄物処理法第14条第13項）の認定を受けていたところ、都道府県知事が認定基準（遵法性）への不適合を理由に認定を取り消した。業者は軽微な違反であり取消しは裁量権の逸脱であると主張して取消処分の取消しを求めた。
      【判旨】裁判所は「優良産廃処理業者の認定は廃棄物処理業者に対する信頼性の認証であり、認定基準への不適合があれば取消しは適法である。認定基準の遵法性要件（直近3年間の違反なし）は画一的・形式的に適用される基準であり、違反の軽微性は認定の維持の理由にはならない」と判示し、取消処分を適法とした。
      【ポイント】優良認定の遵法性要件は軽微違反でも適用される。一度でも行政処分を受けると認定取消し対象となる。
    keywords: ["優良産廃処理業者認定取消", "遵法性要件", "軽微違反認定取消", "行政裁量廃棄物処理", "大阪高裁令和2年"]

  - id: "case_015"
    court: "東京地方裁判所"
    date: "令和3年9月30日"
    case_number: "令和2年（行ウ）第358号"
    title: "産業廃棄物収集運搬業許可申請の不許可処分（欠格要件の解釈）"
    content: |
      【事案】法人が産業廃棄物収集運搬業の許可申請を行ったところ、都道府県知事が法人の役員の一人が過去に廃棄物処理法違反で罰金刑を受けた（5年を経過していない）として欠格要件に該当すると判断し、不許可処分とした。法人は当該役員を処分後に解任しており、申請時点では欠格要件に該当する役員は不在であると主張した。
      【判旨】裁判所は「廃棄物処理法第14条の2の欠格要件は申請時点の状況で判断するため、申請書提出時点で欠格要件に該当する役員がいなければ欠格要件には該当しない。ただし、解任した役員が実質的に法人を支配・運営している場合には欠格要件に準じた取扱いをすることが可能である」と判示し、不許可処分を取り消した。
      【ポイント】欠格要件は申請時点で判断する。欠格要件該当者を解任すれば許可申請が可能だが、実質支配の有無が別途問題となる。
    keywords: ["欠格要件解釈", "役員解任後許可申請", "申請時点判断基準", "廃棄物処理業不許可処分", "欠格役員解任", "東京地裁令和3年"]

  - id: "case_016"
    court: "名古屋高等裁判所"
    date: "平成29年10月5日"
    case_number: "平成29年（行コ）第37号"
    title: "産業廃棄物処理施設の設置許可申請に対する生活環境影響調査の不備"
    content: |
      【事案】産業廃棄物焼却施設の設置許可申請において、申請者が行った生活環境影響調査（ミニアセス）の内容に不備があった（大気拡散計算の前提条件が不適切）として、都道府県知事が許可を拒否した。申請者は調査の方法論的誤りは軽微であり拒否は違法と主張した。
      【判旨】裁判所は「生活環境影響調査は廃棄物処理施設設置許可の実体的要件であり、調査方法・内容が廃棄物処理法施行規則の基準に適合しない場合には許可申請が不適法となる。大気拡散計算の前提条件の誤りが周辺環境への影響評価に重大な影響を与える場合には許可拒否は適法である」と判示した。
      【ポイント】生活環境影響調査の不備（計算前提の誤り等）は許可拒否の正当な理由となる。設置許可申請前に入念な調査・計算確認が必要。
    keywords: ["生活環境影響調査不備", "焼却施設設置許可拒否", "大気拡散計算誤り", "廃棄物処理施設許可要件", "ミニアセス不備", "名古屋高裁平成29年"]

  - id: "case_017"
    court: "札幌高等裁判所"
    date: "平成27年7月9日"
    case_number: "平成27年（行コ）第6号"
    title: "最終処分場の廃止後の汚染に係る原状回復費用負担（旧設置者の責任）"
    content: |
      【事案】産業廃棄物最終処分場が廃止後も周辺地下水の汚染が継続しており、都道府県知事が旧設置者（既に会社解散済みの法人）の旧代表者に対して廃棄物処理法第19条の5の措置命令を発した。旧代表者は法人解散後の個人への措置命令は違法と主張した。
      【判旨】裁判所は「廃棄物処理法第19条の5の措置命令は、廃棄物処理施設を設置した者・廃棄物の処分を委託した排出事業者等に対して発することができる。法人が解散した後も、法人の設置した処分場から生活環境への支障が継続している場合、その設置を主導した代表者個人も措置命令の対象となり得る」と判示した。
      【ポイント】法人解散後も、その法人の行為を主導した個人に対して措置命令が発せられる場合がある。廃棄物処分場の管理責任は長期間継続する。
    keywords: ["最終処分場廃止後汚染", "法人解散後措置命令", "旧代表者個人責任", "廃棄物処理法19条の5", "地下水汚染継続", "措置命令対象者", "札幌高裁平成27年"]

  - id: "case_018"
    court: "広島高等裁判所"
    date: "令和元年11月14日"
    case_number: "令和元年（行コ）第21号"
    title: "廃棄物の不法投棄に係る土地所有者の措置命令の適法性"
    content: |
      【事案】自己の所有地に他者が廃棄物を不法投棄したことに対し、都道府県知事が土地所有者（廃棄物の投棄には関与していない）に対して廃棄物処理法第19条の5に基づく措置命令（廃棄物の撤去）を発した。土地所有者は自己が廃棄物を投棄したわけではなく、措置命令は違法であると主張した。
      【判旨】裁判所は「廃棄物処理法第19条の5は措置命令の対象として、廃棄物処理業者だけでなく、廃棄物の不適正処理が行われた土地の所有者・管理者で当該廃棄物の処理について責任があると認められる者を含む。土地所有者が不法投棄を知りながら放置した場合や、土地の適切な管理を怠ったために不法投棄を招いた場合には措置命令の対象となる」と判示した。
      【ポイント】不法投棄された土地の所有者も措置命令対象となる場合がある。土地管理の不適切さが問われる。
    keywords: ["不法投棄土地所有者措置命令", "土地所有者廃棄物責任", "不法投棄放置措置命令", "廃棄物19条の5措置命令対象", "土地管理責任廃棄物", "広島高裁令和元年"]

  - id: "case_019"
    court: "東京高等裁判所"
    date: "平成26年7月17日"
    case_number: "平成26年（行コ）第117号"
    title: "産業廃棄物処理業の許可更新拒否（欠格要件・行政処分歴）"
    content: |
      【事案】産業廃棄物収集運搬業者が許可の更新申請を行ったところ、都道府県知事が申請者（法人）の役員が過去に廃棄物処理法違反で罰金刑を受けてから5年を経過していないとして更新を拒否した。申請者は過去の違反はマニフェストの記載誤りという軽微なものであると主張した。
      【判旨】裁判所は「廃棄物処理法第14条の2の欠格要件は、廃棄物処理法の規定により罰金の刑に処せられ、その執行を終わり、又は執行を受けることがなくなった日から5年を経過しない者は許可を受けることができないと定めており、違反の軽微性は欠格要件の適用を排除しない。許可の更新拒否は適法である」と判示した。
      【ポイント】欠格要件は罰金刑の種類・金額・軽重を問わず適用される。マニフェスト不交付等の「軽微な」違反による罰金刑も欠格要件に該当する。
    keywords: ["許可更新拒否欠格要件", "罰金刑欠格要件適用", "マニフェスト違反罰金刑欠格", "軽微違反欠格要件", "5年経過欠格要件", "東京高裁平成26年"]

  - id: "case_020"
    court: "最高裁判所"
    date: "平成28年12月19日"
    case_number: "平成28年（刑ヒ）第111号"
    title: "廃棄物処理法違反（不法投棄）における故意の認定"
    content: |
      【事案】産業廃棄物処理業者が廃棄物の処分（最終処分場への搬入）を行ったが、当該最終処分場が無許可の処分場であったことを後から知った。業者側は廃棄物搬入時に無許可であることを認識していなかったと主張し、故意の不法投棄罪の成立を否定した。
      【判旨】最高裁は「廃棄物処理法第16条の不法投棄罪が成立するためには、廃棄物を処分場外に捨てるという故意が必要である。処分場が無許可であることを認識していなかった場合には故意が認められない場合があるが、廃棄物処理業者としての通常の注意を払えば無許可であることを知り得た場合（過失）には、過失犯の成立が問題となる。許可証の確認義務を果たさなかった場合には業務上過失による廃棄物処理法違反が成立しうる」と判示した。
      【ポイント】不法投棄罪には故意が必要だが、許可証の確認を怠った過失による場合も廃棄物処理法違反となり得る。廃棄物処理業者は委託先の許可を確認する義務がある。
    keywords: ["不法投棄罪故意認定", "無許可処分場知らずに搬入", "廃棄物処理業者確認義務", "故意不法投棄業務上過失", "許可証確認義務", "最高裁平成28年"]

  - id: "case_021"
    court: "福岡地方裁判所"
    date: "令和4年8月30日"
    case_number: "令和3年（わ）第1423号"
    title: "廃棄物処理法違反（不正処分・帳簿不記載）と両罰規定の適用"
    content: |
      【事案】産業廃棄物処理業者（法人）の従業員が廃棄物の不正処分（許可範囲外の廃棄物の処分）・帳簿の不記載を行った。会社は従業員の行為を把握していたとして、廃棄物処理法の両罰規定により法人も起訴された。法人は管理・監督の不備を認めつつも、処分した従業員個人のみが責任を負うべきと主張した。
      【判旨】裁判所は「廃棄物処理法の両罰規定（第32条）は、法人の代表者又は使用人等が業務に関し違反行為をした場合に法人も罰する規定であり、法人が従業員の違反行為を防止するための適切な管理監督をしていた場合は免責されるが、管理監督体制が不十分であった場合は法人も処罰対象となる」と判示し、法人に罰金刑を科した。
      【ポイント】廃棄物処理法違反は従業員個人だけでなく法人も処罰される（両罰規定）。法人は従業員の廃棄物処理法遵守を管理監督する体制を整備する義務がある。
    keywords: ["廃棄物処理法両罰規定", "法人処罰廃棄物違反", "帳簿不記載法人罰則", "管理監督義務法人", "許可範囲外廃棄物処分", "福岡地裁令和4年"]

  - id: "case_022"
    court: "東京地方裁判所"
    date: "令和5年3月15日"
    case_number: "令和4年（ワ）第16245号"
    title: "産業廃棄物の不適正処理に係る排出事業者と処理業者の民事責任（損害賠償）"
    content: |
      【事案】排出事業者が廃棄物処理業者（後に無許可と判明）に産業廃棄物の処理を委託したところ、業者が廃棄物を不法投棄した。都道府県は排出事業者に対して措置命令を発し、排出事業者は原状回復費用（廃棄物撤去費用）を支出した。排出事業者は処理業者に対して損害賠償（支出した原状回復費用相当額）を求めて民事訴訟を提起した。
      【判旨】裁判所は「廃棄物処理業者が無許可であることを知らずに委託した排出事業者が措置命令を受けて原状回復費用を支出した場合、当該費用は廃棄物処理業者の不法行為（廃棄物の不法投棄）によって生じた損害に該当し、損害賠償請求が認められる。ただし、排出事業者が許可確認を怠った場合には過失相殺（損害の一部負担）が問題となる」と判示し、一部損害賠償を認容した。
      【ポイント】処理業者の不適正処理により排出事業者が損害を受けた場合、処理業者への民事損害賠償請求が可能。ただし排出事業者に過失がある場合は過失相殺がされる。
    keywords: ["産業廃棄物不適正処理損害賠償", "排出事業者民事責任", "措置命令費用損害賠償", "無許可業者委託損害", "過失相殺廃棄物処理", "東京地裁令和5年"]

  - id: "case_023"
    court: "大阪地方裁判所"
    date: "平成30年6月20日"
    case_number: "平成29年（ワ）第8834号"
    title: "産業廃棄物の不法投棄に係る土地汚染の修復費用（近隣住民への損害賠償）"
    content: |
      【事案】産業廃棄物処理業者が農地に廃棄物（産業廃棄物）を不法投棄し、廃棄物から有害物質（鉛・六価クロム等）が周辺農地・地下水に浸出した。近隣農家（複数）が農作物の被害・農地の使用不能を理由として廃棄物処理業者及び排出事業者に損害賠償を請求した。
      【判旨】裁判所は「廃棄物処理業者の不法投棄が農地汚染・農作物被害の原因であることが立証された。排出事業者は廃棄物処理業者が適法な許可を持つ業者であることを確認せずに委託したことで過失があり、近隣住民への不法行為責任を連帯して負う。損害額は農地修復費用・農作物被害額・精神的損害を含む」と判示し、廃棄物処理業者と排出事業者の連帯損害賠償を認容した。
      【ポイント】不法投棄による土地汚染で第三者（近隣農家）が損害を受けた場合、廃棄物処理業者と排出事業者が連帯して賠償責任を負う場合がある。
    keywords: ["不法投棄農地汚染損害賠償", "近隣農家損害賠償", "排出事業者連帯責任", "鉛六価クロム農地汚染", "廃棄物処理業者不法行為", "大阪地裁平成30年", "連帯損害賠償"]

  - id: "case_024"
    court: "最高裁判所"
    date: "令和3年6月3日"
    case_number: "令和2年（行ヒ）第338号"
    title: "産業廃棄物処理業の許可における廃棄物の種類（石綿含有廃棄物の収集運搬）"
    content: |
      【事案】産業廃棄物収集運搬業者が「がれき類」の許可を受けて、石綿含有廃棄物（石綿含有建材の解体廃棄物）を収集運搬していたところ、都道府県知事が石綿含有廃棄物の収集運搬には「廃石綿等（特別管理産業廃棄物）」の許可が必要として処分（行政処分）を発した。業者は石綿含有成形板（非飛散性）はがれき類として許可範囲内と主張した。
      【判旨】最高裁は「石綿含有廃棄物であっても、廃棄物処理法施行規則の規定に従い飛散性（廃石綿等に該当するもの）と非飛散性（石綿含有産業廃棄物）を適切に区別して許可を確認する必要がある。非飛散性の石綿含有廃棄物（石綿含有成形板等）はがれき類等の産業廃棄物の許可で収集運搬できるが、飛散性のもの（吹付け石綿・石綿含有断熱材等）は特別管理産業廃棄物の許可が別途必要である」と判示した。
      【ポイント】石綿含有廃棄物の収集運搬許可は「飛散性（廃石綿等）」か「非飛散性」かで異なる。現場での判別が重要。
    keywords: ["石綿含有廃棄物収集運搬許可", "廃石綿等特別管理産業廃棄物", "飛散性非飛散性区別", "がれき類許可石綿含有", "石綿含有成形板許可区分", "最高裁令和3年"]

  - id: "case_025"
    court: "仙台高等裁判所"
    date: "平成26年3月19日"
    case_number: "平成25年（行コ）第22号"
    title: "廃棄物処理施設設置許可における周辺住民との協定締結義務の有無"
    content: |
      【事案】産業廃棄物最終処分場の設置許可申請に対し、都道府県は周辺住民との環境保全協定の締結を許可の条件とした。申請者（処理業者）は、廃棄物処理法には周辺住民との協定締結を義務付ける規定はなく、協定締結を条件とする許可は違法であると主張した。
      【判旨】裁判所は「廃棄物処理施設設置許可に際して周辺住民との環境保全協定の締結を条件とすることは、廃棄物処理法の明文規定には存在しないが、都道府県条例又は行政指導として周辺住民との協議・協定締結を要件とすることは、廃棄物処理法の趣旨（生活環境の保全）に反しない範囲で許容される。ただし、協定締結が事実上の許可条件として機能する場合には、条例の根拠が必要である」と判示した。
      【ポイント】周辺住民との協定締結を事実上の許可条件とするには条例の根拠が必要。行政指導の範囲を超える場合は違法となる可能性がある。
    keywords: ["廃棄物処理施設設置許可条件", "周辺住民環境保全協定", "許可条件条例根拠", "行政指導許可条件", "仙台高裁平成26年", "最終処分場設置許可協定"]
