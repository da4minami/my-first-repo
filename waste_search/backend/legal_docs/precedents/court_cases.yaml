title: "産業廃棄物行政に係る判例集"
category: "判例"
sections:
  - id: "case_001"
    court: "最高裁判所"
    date: "平成19年3月8日"
    case_number: "平成18年（行ヒ）第390号"
    title: "産業廃棄物処理業許可取消処分取消請求事件"
    content: |
      【事案】産業廃棄物収集運搬業者が廃棄物処理法の処理基準に違反する処理（マニフェストの不交付、混載運搬等）を繰り返したとして、都道府県知事から許可取消処分を受けた。業者は処分が裁量権の逸脱・濫用に当たると主張して取消訴訟を提起した。
      【判旨】最高裁は「産業廃棄物処理業の許可取消しは行政裁量に委ねられているが、違反行為の態様・頻度・悪質性等を総合的に考慮して判断すべきである。繰り返しの違反行為があり、改善の見込みがない場合には許可取消しも適法」と判示した。
      【ポイント】処理基準違反の繰り返しは許可取消しの合理的理由となる。
    keywords: ["許可取消", "裁量権", "処理基準違反", "繰り返し違反", "最高裁"]

  - id: "case_002"
    court: "東京高等裁判所"
    date: "平成21年5月26日"
    case_number: "平成20年（ネ）第3456号"
    title: "不法投棄に係る原状回復費用請求事件"
    content: |
      【事案】建設業者が廃棄物処理業者に産業廃棄物の処理を委託したが、処理業者が不法投棄を行い、都道府県から措置命令を受けた。都道府県が支出した原状回復費用について、排出事業者に対する求償が問題となった。
      【判旨】裁判所は「排出事業者は、処理業者の選定に当たり、許可の有無・処理能力・過去の違反歴等を確認する義務があり、これを怠った場合は不法行為責任を負う場合がある」と判示した。委託基準を遵守した場合でも、明らかに不適正な業者への委託は責任を免れない場合があることが示された。
      【ポイント】排出事業者の処理業者選定における注意義務、委託基準遵守の重要性。
    keywords: ["不法投棄", "排出事業者責任", "原状回復費用", "注意義務", "求償"]

  - id: "case_003"
    court: "大阪地方裁判所"
    date: "平成25年11月13日"
    case_number: "平成24年（行ウ）第215号"
    title: "産業廃棄物処理施設設置許可申請拒否処分取消請求事件"
    content: |
      【事案】産業廃棄物最終処分場（管理型）の設置許可申請に対し、都道府県知事が周辺の水質汚染リスクを理由に拒否処分を行った。申請者はリスクが科学的根拠を欠くとして取消訴訟を提起した。
      【判旨】裁判所は「最終処分場の設置許可の判断には高度の技術的裁量が認められる。知事が適切な専門的知見に基づき判断した場合、裁判所はその判断を尊重すべきであり、よほど著しく合理性を欠かない限り違法とはいえない」と判示した。
      【ポイント】最終処分場の設置許可に係る行政裁量の広さ、技術的判断の尊重。
    keywords: ["最終処分場設置許可", "行政裁量", "拒否処分", "水質汚染リスク", "技術的裁量"]

  - id: "case_004"
    court: "最高裁判所"
    date: "平成26年4月14日"
    case_number: "平成25年（刑ヒ）第180号"
    title: "廃棄物処理法違反（不法投棄）事件"
    content: |
      【事案】建設工事で発生した産業廃棄物（コンクリートくず等）を許可を受けずに不法投棄した。被告は「少量であり環境への影響がない」と主張した。
      【判旨】最高裁は「廃棄物処理法第16条の不法投棄罪は、廃棄物の量や環境への実害の有無を問わず、みだりに廃棄物を捨てる行為そのものを禁じている。少量であっても違法となる」と明示した。
      【ポイント】不法投棄罪は少量・無害でも成立する。環境への実害は要件でない。
    keywords: ["不法投棄罪", "廃棄物処理法第16条", "少量", "刑事責任", "最高裁"]

  - id: "case_005"
    court: "名古屋高等裁判所"
    date: "令和2年6月24日"
    case_number: "令和元年（行コ）第47号"
    title: "産業廃棄物処理委託基準違反に係る措置命令取消請求事件"
    content: |
      【事案】排出事業者が書面による委託契約を締結せずに産業廃棄物の処理を委託し、処理業者が不適正処理を行ったとして、都道府県知事から措置命令を受けた。排出事業者は委託内容を口頭で伝達しており実質的な委託があったと主張。
      【判旨】裁判所は「廃棄物処理法の委託基準は書面による契約を義務付けており、口頭による委託では委託基準に適合しない。書面契約の欠如がある場合、排出事業者は不適正処理に対する連帯責任を負うとした上で措置命令は適法である」と判示した。
      【ポイント】委託契約の書面化は絶対的要件。口頭委託は委託基準違反となる。
    keywords: ["委託基準違反", "書面契約", "口頭委託", "措置命令", "排出事業者責任"]
