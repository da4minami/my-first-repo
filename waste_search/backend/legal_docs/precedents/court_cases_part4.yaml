title: "産業廃棄物行政に係る判例集（第4集・行政処分・民事・刑事）"
category: "判例"
sections:
  - id: "case_026"
    court: "東京高等裁判所"
    date: "平成24年5月24日"
    case_number: "平成23年（行コ）第298号"
    title: "産業廃棄物処理施設の維持管理基準違反に係る改善命令の適法性"
    content: |
      【事案】産業廃棄物焼却施設の設置者が、廃棄物処理法施行規則に定める維持管理基準（燃焼温度の保持・ダイオキシン類測定の定期実施等）を遵守していなかったとして、都道府県知事が改善命令を発した。設置者は施設の老朽化による技術的困難と費用負担を理由に命令の取消しを求めた。
      【判旨】裁判所は「廃棄物処理施設の維持管理基準は廃棄物の適正処理と生活環境保全のために設けられた最低限の技術基準であり、経済的理由や技術的困難を理由に基準を下回ることは許されない。改善命令の期限設定は合理的な範囲内であり、設置者が期限内に改善できない場合には施設の廃止を選択することも可能である」と判示し、改善命令を適法とした。
      【ポイント】維持管理基準は経済的理由では免除されない。基準達成が困難な場合は施設廃止の選択が求められる。
    keywords: ["廃棄物処理施設維持管理基準違反", "改善命令適法性", "焼却施設燃焼温度維持", "ダイオキシン類測定義務", "経済的理由維持管理基準免除不可", "東京高裁平成24年"]

  - id: "case_027"
    court: "最高裁判所"
    date: "令和2年3月26日"
    case_number: "令和元年（行ヒ）第379号"
    title: "廃棄物処理法に基づく立入検査の適法性（任意調査か強制調査か）"
    content: |
      【事案】都道府県の廃棄物担当職員が産業廃棄物処理業者の事業場に立入検査を実施しようとしたところ、業者が拒否した。都道府県は廃棄物処理法第19条の立入検査権限に基づき強制的に立ち入ることができるとして入構した。業者は正当な理由のない立入りは違法であると主張した。
      【判旨】最高裁は「廃棄物処理法第19条の立入検査は行政調査（任意調査）であり、強制力を持つ捜索や差押えとは異なる。ただし、正当な理由なく立入を拒否した者は罰則（30万円以下の罰金）の対象となる。都道府県職員が身分証明書を提示し検査の趣旨を説明した上での立入りは適法であり、業者には受忍義務がある」と判示した。
      【ポイント】廃棄物処理法の立入検査は任意調査だが、正当な理由なく拒否すると罰則対象となる。業者には原則として立入を受忍する義務がある。
    keywords: ["廃棄物処理法立入検査適法性", "立入検査任意調査強制調査", "立入検査拒否罰則", "身分証明書提示義務", "行政調査受忍義務", "最高裁令和2年"]

  - id: "case_028"
    court: "最高裁判所"
    date: "平成22年9月21日"
    case_number: "平成22年（刑ヒ）第72号"
    title: "廃棄物の保管基準違反の刑事罰（廃棄物処理法第25条違反）"
    content: |
      【事案】産業廃棄物収集運搬業者が積替え保管施設において、廃棄物処理法施行規則の保管基準（囲いの設置・掲示板の設置・廃棄物の飛散・流出・悪臭防止措置等）に違反して廃棄物を保管していたとして、廃棄物処理法第25条第1項第14号違反（保管基準違反）として起訴された。
      【判旨】最高裁は「廃棄物の保管基準（廃棄物処理法施行令第3条及び施行規則第1条の2）に違反した場合には、廃棄物処理法第25条第1項第14号（許可の条件に違反した場合等）ではなく、廃棄物処理法第19条の3（改善命令）の対象となる行政処分が先行するのが原則であるが、悪質な継続的違反については直ちに刑事罰の対象となる」と判示した。
      【ポイント】保管基準違反は行政処分（改善命令）の対象だが、悪質・継続的な違反は直接刑事処罰の対象となる。
    keywords: ["廃棄物保管基準違反刑事罰", "積替え保管基準違反", "廃棄物処理法25条違反", "保管基準違反行政処分先行", "悪質継続的違反刑事処罰", "最高裁平成22年"]

  - id: "case_029"
    court: "神戸地方裁判所"
    date: "令和3年4月22日"
    case_number: "令和2年（ワ）第2341号"
    title: "建設工事における廃棄物の不法投棄と元請業者・排出事業者の民事責任"
    content: |
      【事案】建設会社（元請業者）が工事現場で発生した廃棄物（木くず・コンクリートくず等）を下請業者に処分を委託したところ、下請業者が近隣の山林に不法投棄した。近隣土地所有者が元請業者・下請業者に対して損害賠償（不法投棄廃棄物の撤去費用・土地の汚染修復費用）を請求した。
      【判旨】裁判所は「建設工事の元請業者は排出事業者として廃棄物の適正処理を確保する義務を負い、下請業者に廃棄物処理業の許可の有無を確認せずに廃棄物を委託した場合には過失がある。下請業者の不法投棄は元請業者の選任・管理の過失と相当因果関係があり、元請業者は連帯して損害賠償責任を負う」と判示した。
      【ポイント】元請業者は下請業者への廃棄物処理委託に際して許可確認等の義務を怠ると、不法投棄による損害について民事連帯責任を負う。
    keywords: ["建設廃棄物不法投棄元請責任", "元請業者下請業者廃棄物委託", "許可確認義務怠慢", "不法投棄民事連帯責任", "排出事業者選任管理責任", "神戸地裁令和3年"]

  - id: "case_030"
    court: "大阪高等裁判所"
    date: "平成25年10月17日"
    case_number: "平成25年（行コ）第123号"
    title: "廃棄物処理業許可の条件（廃棄物の種類制限）の適法性"
    content: |
      【事案】都道府県知事が産業廃棄物収集運搬業の許可を付与する際、取り扱える廃棄物の種類を特定のものに限定する条件（許可条件）を付した。申請者（処理業者）は申請した全ての廃棄物の種類について許可されるべきであり、種類制限は廃棄物処理法の規定に反すると主張した。
      【判旨】裁判所は「都道府県知事は廃棄物処理業の許可に際して、施設の能力・設備・申請者の技術力等を考慮して適切な条件を付することができる（廃棄物処理法第14条第9項）。廃棄物の種類を申請者が適切に処理できる範囲に限定する条件は合理的な根拠があり、適法である」と判示した。
      【ポイント】許可条件として廃棄物の種類を制限することは適法。申請した廃棄物の種類全てが許可されるとは限らない。
    keywords: ["廃棄物処理業許可条件廃棄物種類制限", "許可条件適法性", "廃棄物処理法14条9項許可条件", "廃棄物種類限定許可", "都道府県知事許可条件裁量", "大阪高裁平成25年"]

  - id: "case_031"
    court: "東京地方裁判所"
    date: "令和4年12月7日"
    case_number: "令和4年（わ）第2156号"
    title: "廃棄物処理法違反（不法投棄・無許可業者への委託）と量刑"
    content: |
      【事案】解体工事業者（被告）が複数の建設現場から発生した廃棄物（木くず・廃プラスチック類・コンクリート塊等の混合廃棄物）を無許可業者に廃棄物処理を委託し、無許可業者が山林に不法投棄した。被告は自身は不法投棄の現場にいなかったが、無許可業者であることを知りながら委託していたとして廃棄物処理法違反で起訴された。
      【判旨】裁判所は「廃棄物処理業の許可を受けていない者に廃棄物の処理を委託することは廃棄物処理法第12条第5項（委託基準）に違反し、さらに不法投棄の実行を認識しながら委託を継続した場合には不法投棄罪（第16条）の共謀共同正犯が成立する。数か月にわたる組織的・継続的な違反であることを考慮し、懲役1年6月・執行猶予3年の判決を言い渡す」と判示した。
      【ポイント】無許可業者への廃棄物委託で不法投棄が発生した場合、委託者も不法投棄の共謀共同正犯として懲役刑の対象となる。継続的・組織的違反は量刑が重くなる。
    keywords: ["無許可業者委託不法投棄共謀", "廃棄物処理業許可なし委託罪", "共謀共同正犯廃棄物", "懲役刑廃棄物処理法違反", "継続的組織的違反量刑", "東京地裁令和4年"]

  - id: "case_032"
    court: "最高裁判所"
    date: "平成20年7月18日"
    case_number: "平成19年（行ヒ）第217号"
    title: "産業廃棄物処理施設の設置許可申請に対する隣接都道府県知事の関与"
    content: |
      【事案】A県内に産業廃棄物最終処分場の設置が計画されたところ、処分場予定地が隣接B県との県境に近く、B県側の住民から生活環境への影響を懸念する声が上がった。B県知事は廃棄物処理法上の関与権限はないと主張しながらも、A県知事に対して許可前の協議を求めた。申請者はB県による関与阻止を求めて訴訟を提起した。
      【判旨】最高裁は「廃棄物処理施設の設置許可権限は施設所在地の都道府県知事にある。隣接都道府県知事には廃棄物処理法上の許可・不許可に対する法的権限はないが、設置許可に係る手続き（生活環境影響調査の縦覧等）への意見表明や行政機関間の協議を申し出ることは可能である。隣接都道府県からの意見は許可権者が考慮すべき事項となり得る」と判示した。
      【ポイント】処分場所在地の都道府県知事に許可権限があり、隣接都道府県の法的拒否権はない。しかし隣接都道府県の意見表明は考慮要素となる。
    keywords: ["廃棄物処理施設隣接都道府県関与", "最終処分場県境設置", "都道府県許可権限の帰属", "隣接都道府県意見表明", "行政機関間協議廃棄物施設", "最高裁平成20年"]
