title: "産業廃棄物行政に係る判例集（第2集）"
category: "判例"
sections:
  - id: "case_006"
    court: "最高裁判所"
    date: "平成11年7月19日"
    case_number: "平成10年（受）第1926号"
    title: "廃棄物の「不要性」に関する事件（有価物か廃棄物か）"
    content: |
      【事案】廃棄物処理業の許可を持たない業者がくず鉄の収集運搬を行い、廃棄物処理法違反として起訴された。業者側は当該くず鉄は有償で取引される有価物であり廃棄物に該当しないと主張した。
      【判旨】最高裁は「廃棄物に該当するかは、当該物件の性状、排出の状況、通常の取扱い形態、取引価値の有無及び占有者の意思等を総合的に勘案して決すべきである。占有者が自ら利用し、又は他人に有償で売却することができない不要物であれば廃棄物に該当する」と判示し、有価物性の判断基準を示した。
      【ポイント】廃棄物該当性は形式的な名称ではなく実態（有価物性・不要物性）で総合判断する。
    keywords: ["廃棄物の不要性", "有価物", "廃棄物該当性", "総合判断", "くず鉄", "最高裁"]

  - id: "case_007"
    court: "最高裁判所"
    date: "平成14年9月5日"
    case_number: "平成12年（刑ヒ）第238号"
    title: "無許可業者への委託と排出事業者の罪責"
    content: |
      【事案】排出事業者が産業廃棄物の処理を無許可業者に委託し、その業者が不法投棄を行った。排出事業者は自らは不法投棄をしていないと主張し、不法投棄の共犯（共謀共同正犯）としての責任を争った。
      【判旨】最高裁は「排出事業者が、産業廃棄物処理業の許可を受けていない者に産業廃棄物の処理を委託し、その者が産業廃棄物を不法投棄することを認識しながらこれを委託した場合には、廃棄物処理法第16条違反の不法投棄罪の共同正犯が成立する」と判示した。
      【ポイント】無許可業者に委託した排出事業者も、不法投棄を認識していた場合は共犯として刑事責任を負う。
    keywords: ["無許可業者委託", "排出事業者の刑事責任", "共同正犯", "不法投棄", "最高裁"]

  - id: "case_008"
    court: "最高裁判所"
    date: "平成26年10月9日"
    case_number: "平成26年（刑ヒ）第59号"
    title: "廃棄物処理法の「みだりに廃棄物を捨てた」の解釈"
    content: |
      【事案】石綿（アスベスト）スレートを所有地内に放置した者が廃棄物処理法第16条違反で起訴された。自己の土地内への放置が「みだりに廃棄物を捨てた」に該当するかが争われた。
      【判旨】最高裁は「廃棄物処理法第16条の『みだりに』廃棄物を捨てることとは、正当な理由なく廃棄物をその管理権外に置くことであり、自己の土地内への放置も含まれる」と判示し、有罪を確定した。
      【ポイント】自己の土地内であっても廃棄物を適切な方法によらず放置することは不法投棄罪に該当する。
    keywords: ["みだりに廃棄物を捨てた", "自己土地内放置", "アスベスト", "不法投棄罪解釈", "最高裁"]

  - id: "case_009"
    court: "東京高等裁判所"
    date: "令和3年3月24日"
    case_number: "令和2年（行コ）第125号"
    title: "マニフェストの記載不備と委託基準違反の判断"
    content: |
      【事案】排出事業者がマニフェストに廃棄物の数量を実際より少なく記載して交付し、残余の廃棄物が不適正処理された。都道府県知事は排出事業者にも委託基準違反（マニフェストの虚偽記載）として措置命令を発した。排出事業者は記載誤りは軽微であると主張した。
      【判旨】裁判所は「マニフェストの記載事項（種類・数量）は廃棄物の追跡管理に不可欠であり、不正確な記載は委託基準違反となる。記載内容の精度は廃棄物の不適正処理防止のための制度的担保であり、誤りの大小に関わらず義務違反が成立する」と判示した。
      【ポイント】マニフェストの数量・種類の正確な記載は法的義務。少量の過少記載でも違法となる。
    keywords: ["マニフェスト虚偽記載", "委託基準違反", "数量記載誤り", "措置命令", "東京高裁"]

  - id: "case_010"
    court: "福岡高等裁判所"
    date: "平成28年11月30日"
    case_number: "平成28年（ネ）第432号"
    title: "産業廃棄物の混合廃棄物の種類判断"
    content: |
      【事案】建設工事から生じた廃棄物（コンクリート塊、金属くず、廃プラスチック類、木くずが混合した廃棄物）を安定型最終処分場に搬入したことが、処理基準違反に当たるかが争われた。
      【判旨】裁判所は「混合廃棄物の最終処分場の種類は、含まれる廃棄物のうち最も厳しい管理基準が必要なものに従うべきであり、木くずが含まれる場合は管理型最終処分場での処理が必要となる。安定型産業廃棄物以外のものが混入した廃棄物を安定型処分場に搬入することは処理基準違反となる」と判示した。
      【ポイント】混合廃棄物は最も制限の厳しい廃棄物の種類に従って最終処分場を選定する必要がある。
    keywords: ["混合廃棄物", "安定型最終処分場", "木くず混入", "処理基準違反", "最終処分場の種類判断", "福岡高裁"]

  - id: "case_011"
    court: "最高裁判所"
    date: "令和4年1月20日"
    case_number: "令和3年（行ヒ）第118号"
    title: "廃棄物処理法に基づく措置命令の要件（生活環境支障の認定）"
    content: |
      【事案】産業廃棄物の不法投棄現場において、都道府県知事が「生活環境の保全上支障が生ずるおそれがある」として措置命令を発した。処理業者は支障発生のおそれがないと主張して処分の取消しを求めた。
      【判旨】最高裁は「廃棄物処理法第19条の5の措置命令の要件である『生活環境の保全上支障が生じ、又は生ずるおそれがある』の認定は、現に支障が生じている必要はなく、客観的な状況（廃棄物の種類・量・処理方法・周辺環境等）から支障発生のおそれが合理的に認められれば足りる。知事の判断に裁量の余地があり、著しく不合理でない限り違法とはならない」と判示した。
      【ポイント】措置命令は現実の環境被害がなくても「おそれ」があれば発令可能。行政裁量が広く認められる。
    keywords: ["措置命令要件", "生活環境支障のおそれ", "行政裁量", "不法投棄", "最高裁", "令和4年"]
